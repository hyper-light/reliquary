[workspace]
members = ["crates/*"]
# vendor/ holds what Reliquary vendors (vendor/MANIFEST.toml), each project a workspace of its own.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"
repository = "https://github.com/hyper-light/reliquary"
publish = false

# The no-panic rule and the rest of CLAUDE.md as lints. Production code is checked again by
# scripts/check-production.sh, without the test allowances.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
exit = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# A dependency's overflow unwinds to the boundary that contains it instead of wrapping into a wrong
# value; Reliquary's own arithmetic is checked and never reaches this.
overflow-checks = true
# Symbols for profilers; no effect on generated code.
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Each hyper-light product and aws-lc-rs at the one copy Reliquary vendors (vendor/MANIFEST.toml), at the
# revision kiln vendors it: Reliquary's crates name them by name and version, and kiln, vendoring Reliquary,
# patches the same names to its own copies (kiln's docs/vendoring.md). The vendored crates take one another
# by path, which Mantle's recorded change points at vendor/hyper-raft (vendor/mantle/UPSTREAM.md).
[patch.crates-io]
# Amphora's embedded store and amphora-api, the trait Reliquary keeps its records through
# (vendor/amphora/UPSTREAM.md).
amphora = { path = "vendor/amphora/crates/amphora" }
amphora-api = { path = "vendor/amphora/crates/api" }
# aws-lc-rs at kiln's release with Mantle's changes (vendor/aws-lc-rs/UPSTREAM.md); aws-lc-sys stays
# crates.io's, built as kiln builds it (.cargo/config.toml).
aws-lc-rs = { path = "vendor/aws-lc-rs/aws-lc-rs" }
hyper-block = { path = "vendor/hyper-raft/crates/hyper-block" }
hyper-durable = { path = "vendor/hyper-raft/crates/hyper-durable" }
hyper-log = { path = "vendor/hyper-raft/crates/hyper-log" }
hyper-measure = { path = "vendor/hyper-raft/crates/hyper-measure" }
hyper-quic = { path = "vendor/hyper-raft/crates/hyper-quic" }
hyper-raft = { path = "vendor/hyper-raft/crates/hyper-raft" }
hyper-rt = { path = "vendor/hyper-raft/crates/hyper-rt" }
hyper-rt-transport = { path = "vendor/hyper-raft/crates/hyper-rt-transport" }
hyper-sim = { path = "vendor/hyper-raft/crates/hyper-sim" }
hyper-timing = { path = "vendor/hyper-raft/crates/hyper-timing" }
hyper-tls = { path = "vendor/hyper-raft/crates/hyper-tls" }
hyper-transport = { path = "vendor/hyper-raft/crates/hyper-transport" }
mantle-client = { path = "vendor/mantle/crates/client" }
mantle-crc = { path = "vendor/mantle/crates/crc" }
mantle-http = { path = "vendor/mantle/crates/http" }
mantle-protocol = { path = "vendor/mantle/crates/protocol" }
# quiver-api, the trait Reliquary reaches its events through (vendor/quiver/UPSTREAM.md).
quiver-api = { path = "vendor/quiver/crates/quiver-api" }
