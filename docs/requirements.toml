  { id = "T-RQ2.3.4", text = "[refusal] A layer of another media type under an agent manifest; an agent config under a harness artifact type → refused." },
  { id = "T-RQ2.3.5", text = "[edge] An agent with no `platform`; with no layers beyond one empty directory; with `asks` absent; with unknown extra config fields → the first three accepted; the fourth as Shards' reader decides, and the test pins which." },
  { id = "T-RQ2.3.6", text = "[edge] An index of two platforms where one member is invalid → the index is refused, naming the member." },
  { id = "T-RQ2.3.7", text = "[edge] Layers applied in order where a later layer replaces a file with a directory → accepted or refused as Shards' apply does, pinned." },
  { id = "T-RQ2.3.8", text = "[model] The shared corpus through Shards' checker and Reliquary's → equal verdicts, and the corpus's counters show every rule was hit." },
  { id = "T-RQ2.3.9", text = "[happy] `AGENT main FROM <reliquary>/agents/x:1` in an Agentfile → `shards build image` takes it and the agent runs." },
]

