  { id = "AC-RQ4.9.3", text = "Time to ready does not grow with the number of repositories, tags or blobs stored, shown at three store sizes." },
  { id = "AC-RQ4.9.4", text = "No per-request allocation remains on the manifest and blob `GET` paths beyond what the cost table lists and justifies." },
]
