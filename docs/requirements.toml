  { id = "AC-RQ5.6.2", text = "A followed server says so in `_meta`, with its source and the time read; a local publish can never take a followed server's name." },
  { id = "AC-RQ5.6.3", text = "The follow's request rate is derived from the upstream's stated limits and its `429` answers, and a follow never draws a `429` twice in a row." },
