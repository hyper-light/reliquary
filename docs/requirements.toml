[[own]]
id = "RQ7.1"
phase = "RQ7"
title = "Signatures, verified when they arrive"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.2"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ7.1.1", text = "Every bundle sigstore-go's own test vectors accept is recorded as verified, and every one they reject as failed, with the same reason class." },
  { id = "AC-RQ7.1.2", text = "A signature made by `cosign sign` and by `shards sign`, with a key and keyless, pushed with or without the referrers API, yields a verified fact naming the right signer." },
  { id = "AC-RQ7.1.3", text = "A fact names the trust root's version it was verified under; when a root or a key is revoked, the facts that rest on it are re-evaluated, and the count re-evaluated is reported." },
  { id = "AC-RQ7.1.4", text = "Verifying a signature makes no network request at push: the log's inclusion and the timestamp are checked from the bundle and the cached root." },
  { id = "AC-RQ7.1.5", text = "A signature's subject need not exist yet, and its fact attaches when the subject arrives." },
  { id = "AC-RQ7.1.6", text = "A bundle whose log entry is of the public log's older generation and one of its newer generation both verify, and every key used comes from the trust root: none is in the code." },
  { id = "AC-RQ7.1.7", text = "Whether a log entry is required is stated per trust root; where it is not, a signed timestamp from an authority the root names is required instead, as Sigstore's client specification says." },
  { id = "AC-RQ7.1.8", text = "A bundle of a format version the verifier does not know yields the fact \"unverifiable\", naming the version, and is re-evaluated when a verifier for it ships." },
]
tests = [
  { id = "T-RQ7.1.1", text = "[happy] Sign an agent with a key, push the signature → the agent's facts list that key as verified." },
  { id = "T-RQ7.1.2", text = "[happy] A keyless signature with a certificate, a log entry and a timestamp → verified, with its identity and issuer." },
  { id = "T-RQ7.1.3", text = "[refusal] A bundle whose signature is over another digest; whose certificate had expired at the timestamp; whose log entry's inclusion proof is wrong; whose key is not the stated one; that carries no trusted time; whose certificate lacks its certificate-transparency timestamp or carries a bad one → each recorded as failed, with its reason." },
  { id = "T-RQ7.1.4", text = "[edge] The signature pushed before its subject; two signatures by one key; a signature of an index and of one of its members → attached when the subject arrives; one fact; each on its own subject." },
  { id = "T-RQ7.1.5", text = "[edge] A signature under the `sha256-<hex>.sig` tag form, and one listed under the referrers fallback tag `sha256-<hex>` → each recognized, verified, and listed with the referrers." },
  { id = "T-RQ7.1.6", text = "[hostile] A bundle of nested JSON larger than its budget; a certificate chain longer than its budget; a malformed protobuf-JSON → refused in bounded time and memory." },
  { id = "T-RQ7.1.7", text = "[race] A signature pushed while its subject is being deleted → attached to nothing, or the delete is refused by policy; never a fact on a missing subject." },
  { id = "T-RQ7.1.8", text = "[model] Sigstore's conformance vectors through Shards' verifier as vendored → the published verdicts." },
  { id = "T-RQ7.1.9", text = "[edge] Sign one image with cosign's current release in its default form (a bundle as a referrer) and with its previous major release (a tag), in one repository → both verified; the subject shows both facts." },
  { id = "T-RQ7.1.10", text = "[edge] A bundle of an unknown format version; a keyless signature from an instance that keeps no log, under a root that requires a log entry and under one that does not → \"unverifiable\", naming the version; failed; verified by its timestamp." },
]

[[own]]
id = "RQ7.2"
phase = "RQ7"
title = "Trust roots that cannot be rolled back"
source = "docs/design/plan/phase-07-trust.md"
serves = ["T-T9.4.1", "AC-T9.4.2"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ7.2.1", text = "A rollback attack with old TUF metadata is refused (T-T9.4.1): for each role, metadata of a lower version than the last trusted is rejected, on every node." },
  { id = "AC-RQ7.2.2", text = "The client's verdicts equal go-tuf's on the TUF conformance suite and on Shards' recorded oracle." },
  { id = "AC-RQ7.2.3", text = "Freeze (expired metadata replayed), mix-and-match (a snapshot that disagrees with its targets) and an endless-data attack are each refused, typed." },
  { id = "AC-RQ7.2.4", text = "When the root cannot be refreshed past its expiry, facts verified under it are marked stale from that instant, and the event says which root." },
  { id = "AC-RQ7.2.5", text = "How often the root is refreshed is derived from the metadata's own expiry and the path's learned availability, with no fixed period." },
]
tests = [
  { id = "T-RQ7.2.1", text = "[refusal] Serve an older timestamp, snapshot, targets and root in turn → each refused; the trusted version does not move back." },
  { id = "T-RQ7.2.2", text = "[refusal] Serve expired metadata; a snapshot naming a targets version the repository does not serve; metadata signed by a key the root does not name; too few signatures for the threshold → each refused." },
  { id = "T-RQ7.2.3", text = "[happy] A root rotated twice since the binary was built → the client walks both and trusts the newest." },
  { id = "T-RQ7.2.4", text = "[failure] The TUF repository is unreachable for longer than the metadata lives → facts go stale at expiry; pulls follow the policy's stale rule; nothing is trusted past it." },
  { id = "T-RQ7.2.5", text = "[hostile] A metadata file that never ends; one of deeply nested JSON; a targets file listing a path that escapes its directory → refused at the byte budget; refused; refused." },
  { id = "T-RQ7.2.6", text = "[race] Two nodes refresh at once and one sees a newer version → both end at the newer; neither accepts the older afterwards." },
  { id = "T-RQ7.2.7", text = "[crash] Power cut while the trusted metadata is being replaced → after restart the old or the new is trusted, whole, never neither." },
]

[[own]]
id = "RQ7.3"
phase = "RQ7"
title = "A signed statement of what each tag points at"
source = "docs/design/plan/phase-07-trust.md"
serves = ["T-T9.4.1", "AC-T9.4.2"]
needs = ["RQ7.2"]
criteria = [
  { id = "AC-RQ7.3.1", text = "A client that has seen a tag at one digest refuses a later answer whose metadata is older, on any node or region (T-T9.4.1)." },
  { id = "AC-RQ7.3.2", text = "A stock TUF client (go-tuf) verifies Reliquary's metadata from its root with no special case." },
  { id = "AC-RQ7.3.3", text = "After a tag moves, a verifying client sees the new digest with valid metadata no later than a plain client sees the new tag, measured as a difference of intervals." },
  { id = "AC-RQ7.3.4", text = "The timestamp's life is the operator's statement of how stale a tag may be; nothing in the code picks one." },
  { id = "AC-RQ7.3.5", text = "Signing keys never leave the `Secrets` seam's holder; Reliquary holds a lease to sign, not a key; a lost lease stops new statements and is told as an event." },
  { id = "AC-RQ7.3.6", text = "The metadata for a namespace of the largest scale size is produced, served and verified in bounded memory, by delegations whose size the design derives." },
]
tests = [
  { id = "T-RQ7.3.1", text = "[refusal] Replay to a client yesterday's timestamp and tag digest → refused as rolled back." },
  { id = "T-RQ7.3.2", text = "[refusal] Serve a current timestamp with an old snapshot; a targets file missing a tag the client saw → refused." },
  { id = "T-RQ7.3.3", text = "[happy] Move a tag; a verifying client pulls → the new digest, verified." },
  { id = "T-RQ7.3.4", text = "[failure] The signing lease is lost → existing statements serve until they expire; tag moves are refused or wait, by the stated rule; an event names the cause." },
  { id = "T-RQ7.3.5", text = "[race] Two tags of one namespace move at once on two nodes → one snapshot covers both; no client sees a snapshot that names one move and metadata for the other." },
  { id = "T-RQ7.3.6", text = "[crash] Power cut between committing a tag and publishing its statement → after restart the statement is published before the tag is served to verifying clients." },
  { id = "T-RQ7.3.7", text = "[exhaustion] A namespace at the largest size the scale phase tests → metadata operations stay within their memory budget." },
  { id = "T-RQ7.3.8", text = "[hostile] A client that asks for metadata versions in a loop → served from memory within its share; signing is never triggered by a read." },
  { id = "T-RQ7.3.9", text = "[deadlock] A tag move waiting for its statement while signing waits for the snapshot that includes the move → the order is fixed (commit, snapshot, sign) and no step waits on a later one; the move completes or is refused typed." },
  { id = "T-RQ7.3.10", text = "[livelock] Tags of one namespace moving faster than a snapshot can be signed → each snapshot covers every move committed before it; signing does not restart for each move, and the backlog drains when moves stop." },
]

[[own]]
id = "RQ7.4"
phase = "RQ7"
title = "Policy at pull"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.2"]
needs = ["RQ7.1"]
criteria = [
  { id = "AC-RQ7.4.1", text = "Unsigned, wrongly signed or stale artifacts accepted where policy forbids them is exactly 0, measured by a test of planted cases (AC-T9.4.2)." },
  { id = "AC-RQ7.4.2", text = "Each decision equals OPA's on the same policy and input, over the policy test corpus." },
  { id = "AC-RQ7.4.3", text = "A pull's added cost with policies on is a lookup: no Rego runs in a pull's path, by counter." },
  { id = "AC-RQ7.4.4", text = "A policy change or a fact change is reflected in the next pull after its commit, on every node." },
  { id = "AC-RQ7.4.5", text = "A policy that errors, does not terminate within its counted budget, or returns no decision denies, and says so." },
  { id = "AC-RQ7.4.6", text = "A refusal names the policy, its version and the rule, and never reveals facts about artifacts the caller may not read." },
  { id = "AC-RQ7.4.7", text = "Report-only mode records what would have been denied and denies nothing." },
]
tests = [
  { id = "T-RQ7.4.1", text = "[refusal] Planted cases under \"must be signed by key K\": unsigned; signed by another key; signed by K over another digest; signed by K with stale facts where the policy forbids stale → each pull `DENIED`." },
  { id = "T-RQ7.4.2", text = "[happy] The same artifact signed by K → pulled." },
  { id = "T-RQ7.4.3", text = "[edge] An index allowed while one member is denied; a manifest denied but pulled by digest; a blob of a denied manifest shared with an allowed one → the member denied; denied; the blob served only through the allowed manifest's repository." },
  { id = "T-RQ7.4.4", text = "[race] A signature attached while a pull is in flight; a policy tightened mid-pull → the pull sees the decision of one instant; later pulls the new one." },
  { id = "T-RQ7.4.5", text = "[failure] The decision record is unavailable → pulls under a policy are refused typed, never allowed by default." },
  { id = "T-RQ7.4.6", text = "[hostile] A policy with unbounded recursion-like rules, a regex bomb, or a gigabyte comprehension → stopped at its budget, denied, and reported to the policy's owner." },
  { id = "T-RQ7.4.7", text = "[exhaustion] A policy change that re-decides every artifact in a large namespace → decided in the background within its budget; until an artifact is re-decided its pull is evaluated on demand or denied, by the stated rule; pulls elsewhere are unaffected." },
  { id = "T-RQ7.4.8", text = "[model] The policy corpus through OPA and through the vendored engine → identical decisions." },
  { id = "T-RQ7.4.9", text = "[livelock] Facts changing while a policy change re-decides the same artifacts → each decision is for one revision of facts and policy; the queue drains when changes stop; no pull waits on the backlog." },
  { id = "T-RQ7.4.10", text = "[deadlock] A re-decision that needs a fact whose verification waits on a trust-root refresh that the policy itself gates → the refresh never passes through policy; the decision completes or denies typed." },
]

[[own]]
id = "RQ7.5"
phase = "RQ7"
title = "SBOMs, vulnerabilities and exceptions"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.2"]
needs = ["RQ7.1"]
criteria = [
  { id = "AC-RQ7.5.1", text = "An SBOM referrer that is not valid SPDX or CycloneDX, or names another subject, is recorded as invalid and gives no \"has SBOM\" fact." },
  { id = "AC-RQ7.5.2", text = "On a corpus of SBOMs with known advisories, every advisory that applies is found and none that does not, compared with the advisory publishers' own matching rules." },
  { id = "AC-RQ7.5.3", text = "When the advisory database changes, the facts of every affected artifact are updated, and only those." },
  { id = "AC-RQ7.5.4", text = "A fact says how old its advisory data is, and a policy can deny on age." },
  { id = "AC-RQ7.5.5", text = "A VEX statement changes a decision only where the policy trusts its signer." },
  { id = "AC-RQ7.5.6", text = "An SBOM attached as an attestation is found by its predicate type, from the referrer's annotation or else from the statement; each referrer's fact records that type, so the SBOM is found without fetching the others." },
  { id = "AC-RQ7.5.7", text = "An advisory range that cannot be evaluated gives \"unknown\", saying why; unknown is never reported as not affected, and a policy states what unknown means." },
  { id = "AC-RQ7.5.8", text = "A VEX \"not affected\" with neither a justification nor an impact statement is invalid and changes no decision, as OpenVEX requires." },
]
tests = [
  { id = "T-RQ7.5.1", text = "[happy] An image with an SBOM listing a package with a critical advisory, under \"no critical vulnerability\" → `DENIED`, naming the advisory." },
  { id = "T-RQ7.5.2", text = "[happy] The same image with a trusted VEX \"not affected\"; with an untrusted one → pulled; `DENIED`." },
  { id = "T-RQ7.5.3", text = "[edge] A version range at each boundary (first affected, last affected, fixed); a package named by different ecosystems' conventions; an SBOM of zero packages → matched as the publishers' rules state." },
  { id = "T-RQ7.5.4", text = "[failure] The advisory source is unreachable → facts age; the policy's age rule decides; nothing is treated as clean because data is missing." },
  { id = "T-RQ7.5.5", text = "[race] An advisory arrives while an artifact is being pulled → this pull or the next is denied; none after the fact's commit is allowed." },
  { id = "T-RQ7.5.6", text = "[hostile] An SBOM of more packages than its budget; one with cyclic relationships; one that is a decompression bomb → bounded by its budget, refused typed." },
  { id = "T-RQ7.5.7", text = "[edge] The same SBOM attached under its own media type, as a cosign attestation and as BuildKit writes it → \"has SBOM\" in each case, from the same packages." },
  { id = "T-RQ7.5.8", text = "[edge] An advisory with a semantic-version range; one in an ecosystem's own ordering; one that names git commits → matched; matched by that ecosystem's comparator, or \"unknown\" where there is none; \"unknown\"." },
  { id = "T-RQ7.5.9", text = "[refusal] A signed, trusted VEX \"not affected\" that gives no justification and no impact statement → invalid; the pull stays `DENIED`." },
]

[[own]]
id = "RQ7.6"
phase = "RQ7"
title = "Provenance on everything kiln builds"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.3"]
needs = ["RQ7.1"]
criteria = [
  { id = "AC-RQ7.6.1", text = "Kiln-built artifacts without provenance is exactly 0, measured by a check over the registry (AC-T9.4.3)." },
  { id = "AC-RQ7.6.2", text = "A provenance whose subject, builder identity or signature does not verify gives no provenance fact." },
  { id = "AC-RQ7.6.3", text = "The check's cost per run does not grow with the registry's size beyond what changed since its last run." },
  { id = "AC-RQ7.6.4", text = "The artifact page shows the source repository, commit and pipeline of a build, linked to kiln's own record of the run." },
  { id = "AC-RQ7.6.5", text = "A provenance fact needs the SLSA predicate type exactly, the artifact's digest among the statement's subjects, and a signer the operator allows to speak for the named builder; fields the parser does not know are ignored, not refused." },
  { id = "AC-RQ7.6.6", text = "An attestation is found in each form in use: a bundle as a referrer, cosign's `.att` tag, and BuildKit's attestation manifest as a referrer and as an index member of platform `unknown/unknown`; one reachable two ways is counted once, and it is never offered as a platform to run." },
]
tests = [
  { id = "T-RQ7.6.1", text = "[happy] Kiln CI builds and pushes an image → its provenance is attached and verified; the check reports nothing missing." },
  { id = "T-RQ7.6.2", text = "[refusal] An artifact pushed to a kiln-built namespace by hand with no attestation; with an attestation for another digest; with one signed by another builder → each reported by the check, and denied where a policy requires provenance." },
  { id = "T-RQ7.6.3", text = "[edge] A multi-platform build → each platform's manifest and the index have provenance." },
  { id = "T-RQ7.6.4", text = "[race] The check runs while a build's artifact has arrived and its attestation has not → reported only if the attestation is still missing after the push's commit completes." },
  { id = "T-RQ7.6.5", text = "[refusal] A provenance naming kiln's builder, validly signed by an identity not allowed to speak for it; one whose predicate type differs by one character; one whose subjects omit the artifact → no provenance fact, each with its reason." },
  { id = "T-RQ7.6.6", text = "[edge] A provenance carrying a field from a later minor version; an image built by BuildKit in its current and in its older attestation form; an attestation under an `.att` tag → accepted; found in both, and no listing offers an `unknown/unknown` entry to run; found." },
  { id = "T-RQ7.6.7", text = "[edge] An attestation manifest that is both an index member and a referrer, after its index is deleted → still held by its subject, counted once; collected only when RQ9's rule says nothing holds it." },
]

[[own]]
id = "RQ7.7"
phase = "RQ7"
title = "Kiln refuses to launch what is not signed"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.1"]
needs = ["RQ7.4", "RQ2.3", "RQ3.6"]
criteria = [
  { id = "AC-RQ7.7.1", text = "Kiln refuses to launch an Agentfile whose agent or harness isn't signed by an allowed key, in a change request that passes the gate (AC-T9.4.1)." },
  { id = "AC-RQ7.7.2", text = "With the registry's policy turned off, the client's check alone refuses the launch; with the client's check turned off in a test build, the registry's policy alone refuses the pull." },
  { id = "AC-RQ7.7.3", text = "A launch of signed members adds no network round trip beyond the pull's own." },
  { id = "AC-RQ7.7.4", text = "The refusal reaches the person in kiln's words, naming the member, its digest and the keys that would have been accepted." },
]
tests = [
  { id = "T-RQ7.7.1", text = "[refusal] An Agentfile naming an unsigned agent; one signed by a key kiln does not allow; one whose signature is of an older digest of the same tag → not launched, each named." },
  { id = "T-RQ7.7.2", text = "[happy] The same Agentfile with every member signed by an allowed key → launched." },
  { id = "T-RQ7.7.3", text = "[refusal] A registry (simulated) that answers an old digest for the tag with old metadata → the client refuses it as rolled back." },
  { id = "T-RQ7.7.4", text = "[edge] An Agentfile pinning members by digest → the signature of that digest is checked; the tag's statement is not needed." },
  { id = "T-RQ7.7.5", text = "[failure] The trust root is stale beyond the policy's rule → the launch is refused, saying the root is stale." },
]

[[own]]
id = "RQ7.8"
phase = "RQ7"
title = "A history of every tag that anyone can verify"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.2"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ7.8.1", text = "Every committed tag change and delete has exactly one entry, in commit order; a comparison of the log with the records' feed finds no gap and no extra." },
  { id = "AC-RQ7.8.2", text = "Inclusion and consistency proofs verify with an independent implementation of the published log format." },
  { id = "AC-RQ7.8.3", text = "A checkpoint is signed through the `Secrets` seam and never covers an entry that is not durable." },
  { id = "AC-RQ7.8.4", text = "The log's serving cost per read does not grow with its length, and a tile, once complete, never changes." },
]
tests = [
  { id = "T-RQ7.8.1", text = "[happy] Move a tag three times → three entries; each proves included; each pair of checkpoints proves consistent." },
  { id = "T-RQ7.8.2", text = "[refusal] A checkpoint for a smaller tree after a larger one was seen; an entry altered in a served tile → a monitor's check fails on each." },
  { id = "T-RQ7.8.3", text = "[crash] Power cut between a tag's commit and its log entry → after restart the entry is appended before a new checkpoint is signed." },
  { id = "T-RQ7.8.4", text = "[race] Tags of many namespaces moving at once on several nodes → one total order, the feed's." },
  { id = "T-RQ7.8.5", text = "[exhaustion] A log of the scale phase's length → proofs and tiles served within their bound." },
]

[[own]]
id = "RQ7.9"
phase = "RQ7"
title = "Notary Project signatures"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.2"]
needs = ["RQ7.1"]
criteria = [
  { id = "AC-RQ7.9.1", text = "On a corpus of signatures made by notation, valid and invalid in each way its specification names, in both envelope formats, our verdicts equal notation's own, with the same reason class." },
  { id = "AC-RQ7.9.2", text = "A signature made by `notation sign`, in the current form and in the older form that names its type only in the config, is listed by the referrers API under the Notary artifact type and yields a verified fact naming the signer's certificate subject." },
  { id = "AC-RQ7.9.3", text = "A signature verifies only under a trust store and a trusted identity the operator stated for its repository; no certificate is trusted because the machine's own store trusts it." },
  { id = "AC-RQ7.9.4", text = "Verifying at push makes no network request; revocation data is fetched outside the push, its date is part of the fact, and a fact is re-evaluated when that data changes." },
  { id = "AC-RQ7.9.5", text = "A policy can require a signature of either kind, or of both, by one rule over facts." },
]
tests = [
  { id = "T-RQ7.9.1", text = "[happy] Sign an image with `notation sign` under a test authority and push → the fact names the certificate's subject as verified." },
  { id = "T-RQ7.9.2", text = "[refusal] A signature whose chain ends at an authority not in the store; whose signer is not a trusted identity; whose certificate had expired at the signing time; whose envelope was altered; whose payload names another digest → each recorded as failed, with its reason." },
  { id = "T-RQ7.9.3", text = "[edge] A JWS envelope and a COSE envelope of one subject; a signature in the older form; a signature whose certificate has since expired but whose countersigned timestamp predates the expiry → both verified; listed under the Notary type; verified." },
  { id = "T-RQ7.9.4", text = "[failure] The revocation source cannot be reached → the fact says how old its revocation data is; the policy's age rule decides; nothing is treated as unrevoked because data is missing." },
  { id = "T-RQ7.9.5", text = "[hostile] An envelope larger than its budget; a certificate chain longer than its budget; a COSE structure nested past its budget; a certificate with a malformed extension → refused in bounded time and memory." },
  { id = "T-RQ7.9.6", text = "[race] A certificate revoked while its signature is being verified → the fact reflects one instant; after the revocation's commit the fact is failed on every node." },
  { id = "T-RQ7.9.7", text = "[model] The notation-made corpus through our verifier and through notation → identical verdicts." },
]

[[own]]
id = "RQ7.10"
phase = "RQ7"
title = "Signing on push, by the operator's rule"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.4.2"]
needs = ["RQ7.1", "RQ7.3"]
criteria = [
  { id = "AC-RQ7.10.1", text = "Under a signing rule an artifact and its signature become visible in one commit: no reader sees the artifact unsigned, and when the signing lease is lost the push is refused typed." },
  { id = "AC-RQ7.10.2", text = "`cosign verify --key` with the namespace's public key accepts the signature, with no step that is Reliquary's own." },
  { id = "AC-RQ7.10.3", text = "The signed statement and the fact name the rule and its version, the principal that pushed, and the time; the fact is marked as made by the registry, and a policy can require a signature that is not." },
  { id = "AC-RQ7.10.4", text = "The key never leaves the `Secrets` seam's holder; Reliquary holds a lease to sign; no signature is made for an artifact the admission checks refused." },
  { id = "AC-RQ7.10.5", text = "A push under a signing rule costs one signing operation more than one without, by counter, and an A|B record states what that adds to its latency." },
]
tests = [
  { id = "T-RQ7.10.1", text = "[happy] Push an image to a namespace with a signing rule → its referrers list a signature; `cosign verify --key` accepts it." },
  { id = "T-RQ7.10.2", text = "[refusal] Push while the signing lease is lost → refused typed, naming the rule; nothing of the push is visible; after the lease returns the same push succeeds." },
  { id = "T-RQ7.10.3", text = "[edge] A push that matches no rule; an index and its members under one rule; the same manifest pushed twice; a client's own signature pushed under a signing rule → unsigned; each signed as the rule says; one signature, not two; stored as the client's own and not countersigned." },
  { id = "T-RQ7.10.4", text = "[refusal] A policy requiring a signature made outside the registry, on an artifact that has only the registry's → `DENIED`." },
  { id = "T-RQ7.10.5", text = "[race] The rule removed while a push it covered is in flight → the push is signed under the rule's version it began with, or unsigned under the new one, and its fact says which." },
  { id = "T-RQ7.10.6", text = "[crash] Power cut after signing and before the commit → after restart neither the artifact nor a stray signature is visible; a retry signs again." },
  { id = "T-RQ7.10.7", text = "[exhaustion] Pushes arriving faster than the signer signs → admitted at the signer's measured rate, the rest refused `429` with `Retry-After`; pushes to namespaces with no rule are unaffected." },
]

[[own]]
id = "RQ7.11"
phase = "RQ7"
title = "Machines that push with no stored secret"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.10.1"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ7.11.1", text = "A token from a stated issuer whose audience and claims match a rule is exchanged for a registry token carrying exactly the rule's grants; one that fails on issuer, audience, signature, expiry or claims is refused `401`, saying which check failed and nothing about the rules." },
  { id = "AC-RQ7.11.2", text = "The audience is always checked: a rule without one cannot be stated." },
  { id = "AC-RQ7.11.3", text = "A registry token made by exchange expires no later than the token it was exchanged for." },
  { id = "AC-RQ7.11.4", text = "GitHub Actions, GitLab CI and a Kubernetes service account each push and pull with their platform's own token and no stored secret, through `docker login` or a credential helper, with no change to the client." },
  { id = "AC-RQ7.11.5", text = "A rule can match on any claim of the token, not the subject alone, so a repository can be named by the immutable ID its issuer gives; a rule that names an ID is not matched by another repository re-created under the same name." },
  { id = "AC-RQ7.11.6", text = "An issuer's keys are refreshed outside any request, by the lifetime the issuer states; a key rotation is followed without a failed exchange, and an unreachable issuer never makes a token valid." },
  { id = "AC-RQ7.11.7", text = "A client certificate under a stated authority names a principal on the OCI door by a stated field (its subject, a DNS name or a URI name), and a revoked one is refused from the revocation's commit on." },
]
tests = [
  { id = "T-RQ7.11.1", text = "[happy] A CI job with its platform's token and no secret configured → logs in, pushes and pulls." },
  { id = "T-RQ7.11.2", text = "[refusal] A token for another audience; from an issuer not stated; signed by a key the issuer does not publish; expired; with `alg: none`; whose claims match no rule → each `401`, naming the failed check." },
  { id = "T-RQ7.11.3", text = "[refusal] A rule naming a repository by its ID, and a token from a repository deleted and re-created under the same name → refused." },
  { id = "T-RQ7.11.4", text = "[edge] A job's token about to expire; a rule granting two repositories and a request for one; two rules that both match → the registry token expires with it; only the asked scope is granted; the grants are the union, and the answer names both rules." },
  { id = "T-RQ7.11.5", text = "[failure] The issuer's key endpoint is unreachable across a rotation → exchanges signed by keys still held succeed until those keys' lifetime ends; ones signed by the new key are refused typed until it is fetched; none is accepted unverified." },
  { id = "T-RQ7.11.6", text = "[hostile] An issuer document that redirects to an internal address; a key set larger than its budget; a token whose header names a key URL of its own; a flood of tokens each naming a different unknown key → the fetch is refused; refused at the budget; the URL is ignored; no fetch is made per token beyond what the refresh rule allows." },
  { id = "T-RQ7.11.7", text = "[race] A rule removed while an exchange is in flight → the exchange is decided by one version of the rules; tokens already made live out their short lives, and no new one is made." },
  { id = "T-RQ7.11.8", text = "[edge] A client with a certificate under the stated authority; one with a certificate from another authority → pushes over the OCI door with no token; refused in the handshake or `401`, never served." },
]

[[own]]
id = "RQ7.12"
phase = "RQ7"
title = "Credentials for machines, and sign-in for people"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.10.1"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ7.12.1", text = "A machine identity can do only what its grants name, on the repositories they name; it cannot sign in as a person, create identities or change grants." },
  { id = "AC-RQ7.12.2", text = "A credential's expiry must be stated when it is made; it is generated by Reliquary with as much entropy as its hash holds, shown once, stored only as that hash, and never logged." },
  { id = "AC-RQ7.12.3", text = "A revoked or expired credential makes no new token from that commit on, on every node; tokens it already made end within the token lifetime of RQ1.7." },
  { id = "AC-RQ7.12.4", text = "Rotation gives a second credential before the first ends, and the overlap is the operator's statement." },
  { id = "AC-RQ7.12.5", text = "A person signs in with `reliquary login` and with Docker's credential helper through the issuer's device flow; the registry never sees the person's password, and group claims earn grants by the operator's rule." },
  { id = "AC-RQ7.12.6", text = "Removing a person from a group at the issuer takes effect no later than the end of their session's stated life, and a session cannot be extended without the issuer." },
  { id = "AC-RQ7.12.7", text = "Each identity's last use is recorded with no write on the request's path, so an unused credential can be found." },
]
tests = [
  { id = "T-RQ7.12.1", text = "[happy] Make a machine identity with pull on one repository; pull with it; push with it → pulled; `403` `DENIED`." },
  { id = "T-RQ7.12.2", text = "[refusal] Use a credential after its expiry; after its revocation; a credential of one namespace on another; a machine credential at the sign-in for people → each refused." },
  { id = "T-RQ7.12.3", text = "[edge] Rotate a credential; make one with no expiry stated → both work during the overlap and only the new one after; refused, naming the missing expiry." },
  { id = "T-RQ7.12.4", text = "[happy] `reliquary login` against a test issuer, approved on another device, then `docker pull` → pulled with the person's grants; the registry's records hold no password." },
  { id = "T-RQ7.12.5", text = "[failure] The issuer is unreachable → sessions in being last their stated life; new sign-ins are refused typed; machine credentials and workload exchanges are unaffected." },
  { id = "T-RQ7.12.6", text = "[hostile] Guess credentials for one identity as fast as a core allows → each guess costs one hash and is counted; the limiter of RQ4.3 holds the source to its share; no answer shows whether the identity exists." },
  { id = "T-RQ7.12.7", text = "[race] A credential revoked on one node while it is used on another → no token is made on any node after the revocation's commit." },
  { id = "T-RQ7.12.8", text = "[edge] A person in more groups than the issuer's token carries, where the issuer says the list was cut → the groups are fetched from the issuer or the sign-in is refused typed; grants are never computed from a list known to be cut." },
]

[[own]]
id = "RQ7.13"
phase = "RQ7"
title = "Events others can act on, with none lost"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.10.1"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ7.13.1", text = "Every committed change within a subscription's filter is delivered at least once across node loss, restart and upgrade: with the nemesis running, a comparison of what a subscriber received with the feed finds no gap." },
  { id = "AC-RQ7.13.2", text = "Events of one repository arrive in commit order, and each carries an ID that is the same on redelivery." },
  { id = "AC-RQ7.13.3", text = "A receiver written for Distribution's notifications accepts Reliquary's webhook envelope unchanged." },
  { id = "AC-RQ7.13.4", text = "No event is held only in memory: a subscriber's backlog is its cursor, so its memory cost on a node is bounded whatever its lag." },
  { id = "AC-RQ7.13.5", text = "A subscriber whose cursor is older than the feed's history is answered `GONE` with the revision to list again from; no event is dropped without that answer." },
  { id = "AC-RQ7.13.6", text = "A webhook request is signed with a key from the `Secrets` seam, carries no credential of the registry, and goes only to addresses the operator's rule allows; the address is resolved once and held for the request." },
  { id = "AC-RQ7.13.7", text = "No delivery wait, retry count or batch size is a picked number: waits are RQ0.8's, and a subscriber that never answers costs a bounded, counted amount." },
  { id = "AC-RQ7.13.8", text = "An event never shows a repository, a tag or a digest to a subscriber whose principal may not read it." },
]
tests = [
  { id = "T-RQ7.13.1", text = "[happy] Subscribe by webhook, by topic and on the event lane; push, move a tag, delete → each receives the three events, in order, in its own form." },
  { id = "T-RQ7.13.2", text = "[failure] The receiver is down while changes commit, then returns → every event since its cursor arrives, in order; none is repeated except the one in flight when it went down." },
  { id = "T-RQ7.13.3", text = "[crash] Kill the delivering node between a delivery and the cursor's advance → another node redelivers that event with the same ID and carries on." },
  { id = "T-RQ7.13.4", text = "[edge] A subscriber lags past the feed's kept history → `GONE` with a revision; after listing again from it the subscriber's state equals the registry's." },
  { id = "T-RQ7.13.5", text = "[hostile] A webhook address that resolves to loopback, to a link-local or a metadata address, or that changes its answer between check and connect; a receiver that answers just often enough to look alive; one that redirects elsewhere → refused by the address rule; cut by progress and retried by the learned wait; the redirect is not followed." },
  { id = "T-RQ7.13.6", text = "[exhaustion] More subscriptions than the node's delivery budget → admitted to the budget, the rest refused typed when they subscribe; existing deliveries keep their order." },
  { id = "T-RQ7.13.7", text = "[livelock] A receiver that fails every delivery while changes keep committing → its retries do not grow in rate; its cursor stays; other subscribers are unaffected; an event names the stuck subscription." },
  { id = "T-RQ7.13.8", text = "[race] A repository's grant removed from a subscriber's principal while events for it wait → none committed after the removal is delivered." },
  { id = "T-RQ7.13.9", text = "[deadlock] Delivery waiting on the feed while the feed's compaction waits on the slowest cursor → compaction never waits on a subscriber; the laggard is answered `GONE`." },
]

[[own]]
id = "RQ7.14"
phase = "RQ7"
title = "An audit trail"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.10.1"]
needs = ["RQ7.8", "RQ7.13"]
criteria = [
  { id = "AC-RQ7.14.1", text = "Every committed change has exactly one audit record, written in the change's own transaction; a comparison of the trail with the records' feed finds no gap and no extra." },
  { id = "AC-RQ7.14.2", text = "A manifest or blob `GET` in a namespace that does not audit pulls performs no write on its path, by counter." },
  { id = "AC-RQ7.14.3", text = "In a namespace that audits pulls, every served pull has a record, and a pull whose record cannot be queued within its budget is refused typed; an A|B record states the cost this adds to a pull." },
  { id = "AC-RQ7.14.4", text = "Denied requests and sign-ins are counted exactly by kind; when their detail is shed under load, the trail says how many records were shed, by kind." },
  { id = "AC-RQ7.14.5", text = "No record holds a secret, a token or a credential: a lint over the record's type and a scan of a soak's trail both show it." },
  { id = "AC-RQ7.14.6", text = "A record altered or removed after its checkpoint is detected by the log's proofs." },
  { id = "AC-RQ7.14.7", text = "The trail is kept as long as the operator states; what is removed is removed by that rule alone, and its count is recorded." },
]
tests = [
  { id = "T-RQ7.14.1", text = "[happy] Push, move a tag, delete, change a grant → four records, each naming the principal, the action, the object and the outcome." },
  { id = "T-RQ7.14.2", text = "[crash] Power cut at every write of a push → after restart the change and its record are both present or both absent." },
  { id = "T-RQ7.14.3", text = "[exhaustion] A flood of denied requests → each counted by kind; detail shed at the budget and the shed count recorded; memory within budget; served requests unaffected." },
  { id = "T-RQ7.14.4", text = "[refusal] In a namespace that audits pulls, a pull while the trail's queue is full → refused typed; none is served unrecorded." },
  { id = "T-RQ7.14.5", text = "[hostile] A repository name, a user agent and a tag holding control characters, terminal escapes and a record separator → stored and shown escaped; no record is forged or split." },
  { id = "T-RQ7.14.6", text = "[refusal] Alter one stored record; remove one → the monitor's check fails on each." },
  { id = "T-RQ7.14.7", text = "[race] Two administrators change one grant at once → two records in commit order, each with the value it replaced." },
  { id = "T-RQ7.14.8", text = "[edge] A change made by the registry itself (a collection, a retention rule, a signing rule) → recorded with the rule as its principal, not a person." },
]

[[own]]
id = "RQ7.15"
phase = "RQ7"
title = "Scanners that are not ours"
source = "docs/design/plan/phase-07-trust.md"
serves = ["AC-T9.10.1"]
needs = ["RQ7.5", "RQ7.13"]
criteria = [
  { id = "AC-RQ7.15.1", text = "Harbor's adapter for Trivy, unchanged, scans artifacts pushed to Reliquary, and its report's findings appear as facts." },
  { id = "AC-RQ7.15.2", text = "The credential given to a scanner reads only the artifact to be scanned, and expires; with it nothing else can be read and nothing written." },
  { id = "AC-RQ7.15.3", text = "A push's latency is the same with and without a scanner attached, within the interval." },
  { id = "AC-RQ7.15.4", text = "Facts from a scanner name the scanner, its version and its database's date; two scanners' facts on one artifact are kept apart, and a policy chooses which it believes." },
  { id = "AC-RQ7.15.5", text = "A scan that fails, never finishes or returns a report that does not parse leaves the artifact \"not scanned\", with the reason; it is never recorded as clean." },
  { id = "AC-RQ7.15.6", text = "Waiting for a report follows the scanner's own answers and RQ0.8's waits; no timeout is a picked number, and scans in flight are bounded by the scanner's measured rate." },
]
tests = [
  { id = "T-RQ7.15.1", text = "[happy] Attach the Trivy adapter; push an image with a known vulnerable package → a report referrer and vulnerability facts; a policy of \"no critical vulnerability\" denies the pull." },
  { id = "T-RQ7.15.2", text = "[refusal] Use the scanner's credential to read another repository; to push; after its expiry → each refused." },
  { id = "T-RQ7.15.3", text = "[failure] The scanner is down; answers \"not ready\" without end; returns a report for another digest; returns malformed JSON → \"not scanned\" with the reason each time; retried by the learned wait; never clean." },
  { id = "T-RQ7.15.4", text = "[edge] An artifact type the scanner's metadata does not list; an index; an artifact pushed again unchanged; the scanner's database updated → not sent; each member scanned once; not scanned again; scanned again as the operator's rule states." },
  { id = "T-RQ7.15.5", text = "[exhaustion] Pushes faster than the scanner scans → the backlog is RQ7.13's durable cursor, bounded in memory; pushes are not slowed; the count waiting is a metric." },
  { id = "T-RQ7.15.6", text = "[hostile] A report larger than its budget; one naming more findings than its budget; a scanner address that resolves to an internal address the rule forbids → refused typed; refused typed; never called." },
  { id = "T-RQ7.15.7", text = "[race] An artifact deleted while its scan is in flight → the report attaches to nothing and is discarded by the stated rule, counted; no fact is left on a missing subject." },
]

[[own]]
id = "RQ8.1"
phase = "RQ8"
title = "A client for other registries that never trips their limits"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.2"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ8.1.1", text = "The client pulls from Docker Hub, GHCR, Quay, registry.k8s.io and MCR, anonymously and with credentials, and passes Shards' own registry test suite as vendored." },
  { id = "AC-RQ8.1.2", text = "Against a simulated upstream with a stated limit, requests sent never exceed the limit in any window, at any offered load." },
  { id = "AC-RQ8.1.3", text = "The budget's figures come from the upstream's own headers and answers; no upstream's limit is written in the code, and an upstream that states none is paced by its `429` answers alone." },
  { id = "AC-RQ8.1.4", text = "A foreground miss is never delayed by background work while budget remains." },
  { id = "AC-RQ8.1.5", text = "Credentials for one host are never sent to another, redirect or not." },
]
tests = [
  { id = "T-RQ8.1.1", text = "[happy] Pull a manifest and its layers from each of the five upstreams' recorded behaviors → identical bytes; digests verify." },
  { id = "T-RQ8.1.2", text = "[edge] An upstream that lowers its limit mid-run; one that states a limit in one header form and another in a second form; one that states none and answers `429` → the budget follows each." },
  { id = "T-RQ8.1.3", text = "[failure] `429` with `Retry-After`; `503`; a reset mid-body; a TLS failure → waited out as told; retried by RQ0.8's rule; resumed by range; refused typed." },
  { id = "T-RQ8.1.4", text = "[hostile] An upstream that redirects a blob to a third host and expects the token there → the token is not sent." },
  { id = "T-RQ8.1.5", text = "[hostile] An upstream that sends a body unlike its digest, an endless body, or a manifest of another media type than stated → refused; nothing cached." },
  { id = "T-RQ8.1.6", text = "[exhaustion] More misses at once than the budget admits → the excess waits in a bounded queue or is refused with `Retry-After`; none is sent upstream early." },
  { id = "T-RQ8.1.7", text = "[livelock] Background refresh and foreground misses competing at the budget's edge → foreground always proceeds; background resumes when budget returns." },
]

[[own]]
id = "RQ8.2"
phase = "RQ8"
title = "Names, and how clients are pointed here"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.1"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ8.2.1", text = "The same upstream image is one repository in Reliquary however a client names it (by mirror configuration, by `ns`, or by its cache path)." },
  { id = "AC-RQ8.2.2", text = "Docker, containerd, Podman and Shards each pull `ubuntu`, `ghcr.io/x/y` and `registry.k8s.io/pause` through Reliquary with the configuration `reliquary mirror-config` prints for it." },
  { id = "AC-RQ8.2.3", text = "A push, a tag move or a delete by a client on a cached repository is refused `DENIED`, saying it is a cache." },
  { id = "AC-RQ8.2.4", text = "An upstream not on the operator's list is refused `DENIED`; Reliquary is never an open proxy." },
]
tests = [
  { id = "T-RQ8.2.1", text = "[happy] Pull one image by each naming → one repository, one set of blobs." },
  { id = "T-RQ8.2.2", text = "[edge] `ubuntu`, `library/ubuntu` and `docker.io/library/ubuntu`; an upstream on a port; an upstream name that contains the cache's own prefix → resolved to the right upstream each time." },
  { id = "T-RQ8.2.3", text = "[refusal] `ns=evil.example` where that host is not listed; `ns` with a path, credentials or an IP in a private range → `DENIED` or `400`." },
  { id = "T-RQ8.2.4", text = "[refusal] `docker push` to a cached repository → `DENIED`." },
  { id = "T-RQ8.2.5", text = "[hostile] A request whose `ns` differs from the namespace in its path → refused; neither is trusted over the other." },
]

[[own]]
id = "RQ8.3"
phase = "RQ8"
title = "Tags as fresh as asked, and never a mix"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["T-T9.5.1"]
needs = ["RQ8.1", "RQ8.2"]
criteria = [
  { id = "AC-RQ8.3.1", text = "When an upstream tag moves, the cache serves the new digest within its freshness window and never mixes the two (T-T9.5.1)." },
  { id = "AC-RQ8.3.2", text = "The freshness window is the operator's statement per upstream or repository; where none is stated every pull is checked, and concurrent pulls share one check." },
  { id = "AC-RQ8.3.3", text = "A cached tag never points at a manifest Reliquary does not hold whole." },
  { id = "AC-RQ8.3.4", text = "A check that fails (the upstream is down or throttling) serves the held tag, marked with a `Warning` header and its age." },
  { id = "AC-RQ8.3.5", text = "Checks draw on the budget's cheapest request the upstream offers, and the record says which each upstream counts." },
]
tests = [
  { id = "T-RQ8.3.1", text = "[happy] Move an upstream tag; pull after the window → the new digest and its layers." },
  { id = "T-RQ8.3.2", text = "[race] Move the tag while a client is between its manifest and its layers → that client completes with the old image, whole." },
  { id = "T-RQ8.3.3", text = "[race] Many pulls arrive during one check → one upstream request; all share its answer." },
  { id = "T-RQ8.3.4", text = "[failure] The upstream dies after Reliquary learned the new digest and before it stored the manifest → the tag stays on the old digest; nothing half-moved." },
  { id = "T-RQ8.3.5", text = "[edge] The upstream deletes the tag; replaces an image with an index under the same tag; moves the tag back to an older digest → the cache follows each, by the stated rule for deletes." },
  { id = "T-RQ8.3.6", text = "[edge] A window of zero, and one longer than the test → every pull checks; none does." },
  { id = "T-RQ8.3.7", text = "[hostile] An upstream that flips a tag between two digests on every request → each pull gets one whole image; the cache does not thrash its storage past the retention rule." },
]

[[own]]
id = "RQ8.4"
phase = "RQ8"
title = "Fetched once, by however many ask"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.1"]
needs = ["RQ8.1"]
criteria = [
  { id = "AC-RQ8.4.1", text = "For any number of concurrent misses on one blob, upstream requests for it are one, plus resumes after cuts." },
  { id = "AC-RQ8.4.2", text = "A client's first byte arrives without waiting for the whole blob." },
  { id = "AC-RQ8.4.3", text = "A blob whose bytes do not match its digest is never stored and never served to a later client." },
  { id = "AC-RQ8.4.4", text = "Memory for a fill is bounded by one piece per reader, whatever the blob's size and the slowest reader's pace; a reader too slow to keep up is moved to read from what is already stored." },
  { id = "AC-RQ8.4.5", text = "After a fill, serving the blob is the same path and the same speed as a pushed blob." },
]
tests = [
  { id = "T-RQ8.4.1", text = "[happy] Many clients pull one uncached image at once → one upstream fetch per blob; every client verifies." },
  { id = "T-RQ8.4.2", text = "[failure] The upstream cuts the body at a random byte → resumed by range; clients see no error; one extra upstream request." },
  { id = "T-RQ8.4.3", text = "[failure] The upstream sends a wrong byte mid-blob → every streaming client's pull fails verification; nothing is cached; the next pull fetches again." },
  { id = "T-RQ8.4.4", text = "[race] The first client disconnects mid-fill → the fill continues for the others and completes." },
  { id = "T-RQ8.4.5", text = "[race] A client asks for a range of a blob that is half filled → served from what is stored and what arrives, or made to wait; never wrong bytes." },
  { id = "T-RQ8.4.6", text = "[exhaustion] One reader far slower than the rest → the fast ones are not slowed; memory stays bounded." },
  { id = "T-RQ8.4.7", text = "[deadlock] A fill waiting for storage room that retention can free only by dropping what a reader of the fill holds → the fill is refused typed; no cycle." },
  { id = "T-RQ8.4.8", text = "[crash] Kill the node mid-fill → after restart the partial fill resumes or is discarded whole; no partial blob is served as complete." },
]

[[own]]
id = "RQ8.5"
phase = "RQ8"
title = "The upstream is down, and nobody notices"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.3"]
needs = ["RQ8.3", "RQ8.4"]
criteria = [
  { id = "AC-RQ8.5.1", text = "Cached pulls failed while an upstream is down is exactly 0, measured by an outage drill (AC-T9.5.3)." },
  { id = "AC-RQ8.5.2", text = "During an outage, a pull of held content adds no wait on the upstream, within the measurement's interval of a pull with the upstream up." },
  { id = "AC-RQ8.5.3", text = "A pull of content not held fails fast and typed during an outage, and succeeds without operator action once the upstream returns." },
  { id = "AC-RQ8.5.4", text = "The outage and the recovery are each one event, with the upstream named, and a gauge of held-but-unverifiable tags." },
]
tests = [
  { id = "T-RQ8.5.1", text = "[happy] The outage drill: cut the upstream; pull every held image from many runners → all succeed." },
  { id = "T-RQ8.5.2", text = "[failure] The upstream accepts connections and never answers; answers `500` to everything; resolves to nothing in DNS; presents an expired certificate → held content is served in each case; unheld is refused typed." },
  { id = "T-RQ8.5.3", text = "[edge] The upstream comes back with a tag moved during the outage → the next pull after the window gets the new image." },
  { id = "T-RQ8.5.4", text = "[livelock] The upstream flaps up and down faster than a fill takes → fills resume across flaps and complete; pulls of held content never fail." },
  { id = "T-RQ8.5.5", text = "[exhaustion] Thousands of pulls of unheld content during an outage → each refused cheaply; no connection pile-up toward the dead upstream." },
]

[[own]]
id = "RQ8.6"
phase = "RQ8"
title = "Upstream credentials, and private images"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.2"]
needs = ["RQ8.1"]
criteria = [
  { id = "AC-RQ8.6.1", text = "An authenticated upstream pull works for each of the five upstreams with a leased credential, and the credential appears in no log, event, record or core dump path the tests can read." },
  { id = "AC-RQ8.6.2", text = "A principal without a grant on a cached private repository is refused, with the same answer as for a repository that does not exist." },
  { id = "AC-RQ8.6.3", text = "A lease that expires or is revoked stops upstream fetches under it at once; held content is served by its grant as before." },
  { id = "AC-RQ8.6.4", text = "A credential rotated in Veil is used on the next upstream request, with no restart." },
]
tests = [
  { id = "T-RQ8.6.1", text = "[happy] Pull a private upstream image through Reliquary as a granted principal → served." },
  { id = "T-RQ8.6.2", text = "[refusal] The same pull as an ungranted principal, before and after the image is cached → refused alike." },
  { id = "T-RQ8.6.3", text = "[failure] The `Secrets` seam is unavailable → fetches needing a credential are refused typed; anonymous upstreams and held content are unaffected." },
  { id = "T-RQ8.6.4", text = "[hostile] An upstream that echoes the `Authorization` header into its error body → the body is not logged or relayed." },
  { id = "T-RQ8.6.5", text = "[race] A credential revoked mid-fill → the fill stops at its next request; what was fetched and verified so far is kept by the stated rule or discarded whole." },
]

[[own]]
id = "RQ8.7"
phase = "RQ8"
title = "Mirrors of chosen repositories"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.1"]
needs = ["RQ8.3", "RQ8.4"]
criteria = [
  { id = "AC-RQ8.7.1", text = "After a mirror settles, every listed tag's digest equals its upstream's, and every blob of its closure is held, for each platform the operator listed." },
  { id = "AC-RQ8.7.2", text = "A mirrored tag that moves upstream is current here within the watch's cycle, whose length is what the budget's remainder allows and is reported." },
  { id = "AC-RQ8.7.3", text = "Mirroring never delays a foreground pull's upstream request." },
  { id = "AC-RQ8.7.4", text = "The mirror list kiln's registry had maps to Reliquary's with no entry lost, shown by a comparison." },
]
tests = [
  { id = "T-RQ8.7.1", text = "[happy] Mirror a repository's `v1.*` tags → each present and current." },
  { id = "T-RQ8.7.2", text = "[edge] A pattern matching no tag; matching more tags than one cycle's budget; a tag added and one deleted upstream → nothing; all, within budget over several cycles; followed." },
  { id = "T-RQ8.7.3", text = "[failure] The upstream is down for many cycles → the mirror keeps what it has and catches up after." },
  { id = "T-RQ8.7.4", text = "[exhaustion] A mirror list larger than the budget can keep current → the report says which tags are behind and by how long; foreground is unaffected." },
  { id = "T-RQ8.7.5", text = "[race] A mirrored tag moves twice within one cycle → the mirror ends at the latest; no intermediate image is half-copied." },
]

[[own]]
id = "RQ8.8"
phase = "RQ8"
title = "What to keep when the disk is not endless"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.3"]
needs = ["RQ8.4"]
criteria = [
  { id = "AC-RQ8.8.1", text = "Cached bytes per namespace never exceed its quota beyond one fill in flight." },
  { id = "AC-RQ8.8.2", text = "On the replayed trace, the rule's miss bytes are no worse than least-recently-used's, shown by an A|B record, and the record names the rule kept." },
  { id = "AC-RQ8.8.3", text = "Nothing a pull is reading is dropped; a fill that cannot make room is refused typed." },
  { id = "AC-RQ8.8.4", text = "During an upstream outage nothing from that upstream is dropped unless nothing else can make the room, and the drop is an event." },
  { id = "AC-RQ8.8.5", text = "The rule has no age, period or count picked by hand; each input is measured and listed in the constants register." },
]
tests = [
  { id = "T-RQ8.8.1", text = "[happy] Fill past the quota with a workload of some hot and many cold images → cold ones go; hot ones stay; pulls of hot ones never miss." },
  { id = "T-RQ8.8.2", text = "[edge] An image pulled once long ago, and one never pulled since it was mirrored → dropped before the hot set; the mirror's listed tags are kept by the mirror's own rule." },
  { id = "T-RQ8.8.3", text = "[race] An image chosen to drop is pulled at that instant → the pull completes; the drop yields or happens after." },
  { id = "T-RQ8.8.4", text = "[exhaustion] Every cached image is in use and the quota is full → new fills are refused typed, naming the quota." },
  { id = "T-RQ8.8.5", text = "[failure] The upstream is down and the quota is full → images from live upstreams are dropped first." },
]

[[own]]
id = "RQ8.9"
phase = "RQ8"
title = "Every runner pulls through Reliquary"
source = "docs/design/plan/phase-08-pull-through.md"
serves = ["AC-T9.5.1", "AC-T9.5.2"]
needs = ["RQ8.5", "RQ8.6", "RQ8.7"]
criteria = [
  { id = "AC-RQ8.9.1", text = "Every runner pulls through Reliquary at LAN speed and CI never hits an upstream rate limit, in a change request that passes the gate (AC-T9.5.1)." },
  { id = "AC-RQ8.9.2", text = "Upstream rate-limit failures in CI over a week is exactly 0, measured by CI's records (AC-T9.5.2)." },
  { id = "AC-RQ8.9.3", text = "A cached pull on a runner's LAN is link-bound: its throughput's interval overlaps the measured link's, for images above the size where the link, not the round trips, is the limit." },
  { id = "AC-RQ8.9.4", text = "A runner whose Reliquary is unreachable falls back as kiln's change states, and the fallback is an event, never silent." },
]
tests = [
  { id = "T-RQ8.9.1", text = "[happy] A CI leg on each runner platform pulls its image → served by Reliquary; the upstream's request counter moved only on the first." },
  { id = "T-RQ8.9.2", text = "[happy] A week of CI's records → no rate-limit failure." },
  { id = "T-RQ8.9.3", text = "[failure] The outage drill on the lab fleet → no cached pull fails." },
  { id = "T-RQ8.9.4", text = "[edge] A leg that needs an image no runner has pulled before, during an upstream throttle → it waits within the budget and succeeds, or is refused typed with when to retry; it is not a rate-limit failure of CI." },
]

[[own]]
id = "RQ9.1"
phase = "RQ9"
title = "Many nodes, one registry"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["AC-T9.7.1"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ9.1.1", text = "The differential suite passes on three nodes with clients switching node on every request, under partitions, crashes and delays." },
  { id = "AC-RQ9.1.2", text = "An upload's chunks sent to different nodes in turn complete with the right digest." },
  { id = "AC-RQ9.1.3", text = "A write acknowledged by one node is read from every node from the acknowledgement on." },
  { id = "AC-RQ9.1.4", text = "A node joins or leaves with no request refused for that reason beyond those in flight on it, which their clients resume elsewhere." },
  { id = "AC-RQ9.1.5", text = "With every hint between nodes dropped, every answer is still correct." },
  { id = "AC-RQ9.1.6", text = "No node elects itself anything: there is no leader among Reliquary's nodes, and every coordination is a conditional transaction on the records." },
]
tests = [
  { id = "T-RQ9.1.1", text = "[model] Generated histories against three nodes with the nemesis → all match the model." },
  { id = "T-RQ9.1.2", text = "[happy] A chunked upload with each chunk to a different node → `201`; pulls identical from every node." },
  { id = "T-RQ9.1.3", text = "[race] A tag moved on one node and read on another in the same instant, repeated under injected delays → every read is one a linearization allows." },
  { id = "T-RQ9.1.4", text = "[failure] Kill a node mid-upload and mid-download → clients resume on another node from their durable offset and verified prefix." },
  { id = "T-RQ9.1.5", text = "[failure] A node partitioned from the records but reachable by clients → it refuses typed and says where to go; it serves nothing it cannot prove current." },
  { id = "T-RQ9.1.6", text = "[failure] All hints dropped, delayed and duplicated → correct answers; duplicate upstream fills are the only cost, and they are counted." },
  { id = "T-RQ9.1.7", text = "[livelock] Three nodes each retrying a conditional write the others keep winning → each completes within its counted budget or refuses typed." },
  { id = "T-RQ9.1.8", text = "[exhaustion] One node at its admission limit while others idle → its refusals carry `Retry-After`; clients that move to another node are served." },
]

[[own]]
id = "RQ9.2"
phase = "RQ9"
title = "Records and bytes on their clusters"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["AC-T9.7.1", "AC-T9.7.2"]
needs = ["RQ0.4"]
criteria = [
  { id = "AC-RQ9.2.1", text = "Both seams' conformance suites pass against the clusters, on Linux, macOS and Windows clients." },
  { id = "AC-RQ9.2.2", text = "A leader change in Amphora or a node loss in Mantle during any operation ends in the operation's success, a typed refusal, or a reconciled outcome; never a duplicate or a lost acknowledged write." },
  { id = "AC-RQ9.2.3", text = "The laptop and the cluster differ only in what the configuration states about where records and bytes are; a diff of the code paths taken, by coverage, shows no cluster-only branch in the core." },
  { id = "AC-RQ9.2.4", text = "If the stated failures to survive cannot be met by the hardware present, startup refuses and names what is missing." },
]
tests = [
  { id = "T-RQ9.2.1", text = "[happy] Run both seam suites against a three-node Amphora and a three-node Mantle cell → every clause passes." },
  { id = "T-RQ9.2.2", text = "[failure] Kill Amphora's leader during a manifest commit, a tag move and a delete → each completes once or is refused typed; a retry never applies twice." },
  { id = "T-RQ9.2.3", text = "[failure] Kill a Mantle node during a blob upload and a download → both complete from the other nodes." },
  { id = "T-RQ9.2.4", text = "[failure] Partition the minority side of each cluster → the majority serves; the minority refuses typed." },
  { id = "T-RQ9.2.5", text = "[edge] An `UnknownOutcome` after a failover → reconciled by reading; the client is told the true outcome." },
  { id = "T-RQ9.2.6", text = "[exhaustion] A Mantle cell that answers `Full` on one node only → writes go elsewhere by Mantle's placement; Reliquary retries nothing in a loop." },
]

[[own]]
id = "RQ9.3"
phase = "RQ9"
title = "Garbage collection that never stops the registry and never takes what is used"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["AC-T9.7.3", "AC-T9.7.4", "T-T9.7.1"]
needs = ["RQ1.2", "RQ9.1"]
criteria = [
  { id = "AC-RQ9.3.1", text = "Referenced blobs collected is exactly 0, measured by a property test of generated histories (AC-T9.7.4), with the nemesis, on one node and three." },
  { id = "AC-RQ9.3.2", text = "Pushes or pulls failed during garbage collection under load is exactly 0, measured by a GC drill (AC-T9.7.3)." },
  { id = "AC-RQ9.3.3", text = "A push racing a collection of its blobs completes and its blobs stay (T-T9.7.1)." },
  { id = "AC-RQ9.3.4", text = "The registry is never read-only and never paused for collection; throughput and latency during collection stay within their intervals without it." },
  { id = "AC-RQ9.3.5", text = "Every unreferenced blob is eventually collected: after the system is quiet, bytes held equal bytes referenced plus what leases and the horizon protect, exactly." },
  { id = "AC-RQ9.3.6", text = "A collector that dies at any step leaves a state another node completes or undoes; no blob stays condemned or removing for good." },
  { id = "AC-RQ9.3.7", text = "A read of a condemned blob through any path is counted as an alarm, restores the blob, and is 0 in every test that does not plant it." },
]
tests = [
  { id = "T-RQ9.3.1", text = "[model] TLC on the model with pushes, mounts, deletes and two collectors → no state where a linked blob's bytes are gone; with the condemn's condition removed → a counterexample." },
  { id = "T-RQ9.3.2", text = "[race] A push that found its blob present races the blob's condemn, check and remove at every interleaving the simulator can produce → the push completes; the blob is readable after." },
  { id = "T-RQ9.3.3", text = "[race] Two collectors on one blob → one proceeds; the other's condition fails; the bytes are deleted once." },
  { id = "T-RQ9.3.4", text = "[race] A mount of a blob in the instant it is removed → `202` and a fresh upload, or `201` on a restored blob; never `201` on missing bytes." },
  { id = "T-RQ9.3.5", text = "[crash] Kill the collector between each pair of its steps → another node finishes; the property holds." },
  { id = "T-RQ9.3.6", text = "[crash] Power cut after the bytes are deleted and before the record is → after restart the record is removed, and a push of the same content uploads again and succeeds." },
  { id = "T-RQ9.3.7", text = "[failure] Mantle refuses the delete → the blob stays removing and is retried by RQ0.8's rule; it is never linked meanwhile." },
  { id = "T-RQ9.3.8", text = "[hostile] Plant a read of a condemned blob → the alarm counts one; the blob is live again; nothing is deleted." },
  { id = "T-RQ9.3.9", text = "[non-vacuity] Read the property test's counters → blobs collected, pushes that raced a condemn, and blobs restored are each above zero." },
  { id = "T-RQ9.3.10", text = "[perf] The GC drill: sustained pushes and pulls at the admission limit while a backlog is collected → no failed request; latency within its interval." },
  { id = "T-RQ9.3.11", text = "[livelock] A pusher restoring a blob and a collector condemning it, in turn, again and again → the push completes within its counted budget; the collector leaves the blob until its horizon passes again; neither spins." },
  { id = "T-RQ9.3.12", text = "[deadlock] Collectors on several nodes each holding a condemned blob while a push needs all of them → no collector waits on a push and no push waits on a collector: each step is one conditional write that succeeds or fails at once." },
]

[[own]]
id = "RQ9.4"
phase = "RQ9"
title = "Finding garbage without looking at everything"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["AC-T9.7.3"]
needs = ["RQ9.3"]
criteria = [
  { id = "AC-RQ9.4.1", text = "The work to collect one unreferenced blob does not grow with the number of blobs, manifests or repositories stored, at the plan's three scale sizes." },
  { id = "AC-RQ9.4.2", text = "Every change that can orphan a blob enqueues a candidate in the same transaction as the change; a comparison of the queue with a full scan after generated histories finds no orphan the queue missed." },
  { id = "AC-RQ9.4.3", text = "The horizon has no fixed length: it is learned per repository, starts from liveness and progress, and is in the constants register as learned." },
  { id = "AC-RQ9.4.4", text = "With stock clients pushing large images over slow links, pushes refused `MANIFEST_BLOB_UNKNOWN` because a blob was collected under them is exactly 0 in the drill." },
  { id = "AC-RQ9.4.5", text = "The background reconciliation's rate is derived from idle capacity; in every test without planted corruption it finds nothing, and what it finds is an alarm." },
  { id = "AC-RQ9.4.6", text = "The review queue is bounded by what the records hold of it; past its bound new candidates wait in the change feed, and none is dropped." },
]
tests = [
  { id = "T-RQ9.4.1", text = "[happy] Delete a manifest whose blobs nothing else references → after the horizon the bytes are gone and the quota is credited." },
  { id = "T-RQ9.4.2", text = "[edge] Delete one of two manifests sharing a layer → the shared layer stays; the unshared goes." },
  { id = "T-RQ9.4.3", text = "[edge] A blob pushed and never referenced → collected after the horizon; one referenced a moment before the horizon ends → kept." },
  { id = "T-RQ9.4.4", text = "[race] A slow client: `HEAD` finds a layer, then it uploads other layers for longer than any gap seen before, then pushes the manifest → the manifest is accepted; the layer was protected by the client's progress." },
  { id = "T-RQ9.4.5", text = "[failure] The collector is down for a long time, then starts → it works through the backlog a counted step at a time; requests are unaffected." },
  { id = "T-RQ9.4.6", text = "[exhaustion] A mass delete of a huge repository → the queue grows to its bound and no further; the delete's acknowledgement does not wait for collection." },
  { id = "T-RQ9.4.7", text = "[model] After generated histories, compare what the queue collected with a full mark from the tags → the same set, less what the horizon protects." },
  { id = "T-RQ9.4.8", text = "[hostile] A client that asserts millions of blobs it never references, to pin them → its assertions protect only what its quota is charged for, and lapse with its progress." },
]

[[own]]
id = "RQ9.5"
phase = "RQ9"
title = "Quotas that are exact"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["CP-T9.7"]
needs = ["RQ9.1"]
criteria = [
  { id = "AC-RQ9.5.1", text = "After any generated history, each namespace's charged bytes equal the sum of the sizes of what it links plus its open uploads, exactly." },
  { id = "AC-RQ9.5.2", text = "Bytes written past a quota is exactly 0, in a test that fills a namespace from many nodes at once." },
  { id = "AC-RQ9.5.3", text = "A refusal for quota is typed, names the quota and what remains, and costs no upload." },
  { id = "AC-RQ9.5.4", text = "Under many concurrent pushes to one namespace, commit throughput is within the interval of the same pushes spread over many namespaces." },
  { id = "AC-RQ9.5.5", text = "A blob shared by two namespaces is charged to both, and one namespace's deletion of it changes only its own charge." },
]
tests = [
  { id = "T-RQ9.5.1", text = "[happy] Push until the quota is reached → the push that would pass it is refused with the remainder; a smaller one fits." },
  { id = "T-RQ9.5.2", text = "[race] Many nodes push to one namespace at once with a quota that fits half → exactly the bytes that fit are accepted; the counter is exact." },
  { id = "T-RQ9.5.3", text = "[edge] A push of exactly the remainder; a zero-byte blob at a full quota; a mount of a blob larger than the remainder → accepted; accepted; refused." },
  { id = "T-RQ9.5.4", text = "[edge] A quota lowered below current use → nothing is deleted; new pushes are refused; deletes are allowed." },
  { id = "T-RQ9.5.5", text = "[crash] Kill a node between staging bytes and charging them, at every write → after restart the charge is exact." },
  { id = "T-RQ9.5.6", text = "[hostile] A chunked upload with no stated length that runs past the quota → cut at the byte that passes it; staged bytes freed." },
  { id = "T-RQ9.5.7", text = "[model] Generated histories → charges equal a recomputation from the records." },
  { id = "T-RQ9.5.8", text = "[deadlock] Two pushes each holding staged bytes and each needing the quota the other holds to finish → one is refused typed and frees its bytes; neither waits for the other." },
]

[[own]]
id = "RQ9.6"
phase = "RQ9"
title = "Retention and immutability, as the operator states them"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["CP-T9.7"]
needs = ["RQ9.3"]
criteria = [
  { id = "AC-RQ9.6.1", text = "A move or delete of an immutable tag is refused `DENIED` by both doors, naming the rule." },
  { id = "AC-RQ9.6.2", text = "After a rule settles, what remains is exactly what the rule keeps, compared with a direct evaluation of the rule over the records." },
  { id = "AC-RQ9.6.3", text = "A dry run lists exactly what the live run then removes, where nothing changed between them." },
  { id = "AC-RQ9.6.4", text = "A manifest is never removed while a tag a rule keeps, an index a rule keeps, or a policy's hold names it." },
  { id = "AC-RQ9.6.5", text = "Whether a signature, SBOM or other referrer outlives its subject is the rule's to say, and the default keeps it." },
  { id = "AC-RQ9.6.6", text = "Applying a rule to a repository costs work in proportion to what changed, not to what it holds." },
]
tests = [
  { id = "T-RQ9.6.1", text = "[refusal] Move, delete and re-push with other content an immutable tag → each `DENIED`; re-push with the same content succeeds." },
  { id = "T-RQ9.6.2", text = "[happy] \"Keep the newest five `v*` tags and anything pulled since its upload\" → the others are removed; their unshared blobs are collected." },
  { id = "T-RQ9.6.3", text = "[edge] A rule matching nothing; everything; a manifest kept by one rule and removed by another → nothing removed; everything but holds; kept." },
  { id = "T-RQ9.6.4", text = "[edge] A multi-platform index kept while a rule would remove one member → the member stays." },
  { id = "T-RQ9.6.5", text = "[race] A tag is pushed as a rule removes its manifest's previous version → the new version is untouched; the old goes." },
  { id = "T-RQ9.6.6", text = "[race] A rule changed while it is being applied → each manifest is judged by one version of the rule; the next pass uses the new one." },
  { id = "T-RQ9.6.7", text = "[hostile] A tag pattern built to be expensive → bounded by a counted budget, refused if it cannot be evaluated within it." },
]

[[own]]
id = "RQ9.7"
phase = "RQ9"
title = "A disk is wiped, a machine is lost, and nothing is missing"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["AC-T9.7.2", "AC-T9.7.1"]
needs = ["RQ9.2", "RQ9.3"]
criteria = [
  { id = "AC-RQ9.7.1", text = "Blobs lost when a storage node's disk is wiped is exactly 0, measured by the Mantle lab (AC-T9.7.2)." },
  { id = "AC-RQ9.7.2", text = "Acknowledged artifacts lost across every drill is exactly 0, by a full verification after each." },
  { id = "AC-RQ9.7.3", text = "During a drill within the stated failures to survive, pushes and pulls that fail are only those in flight on the lost machine, and each resumes elsewhere." },
  { id = "AC-RQ9.7.4", text = "After each drill the cluster returns to full redundancy without an operator, and the time it took is recorded with what bounded it." },
  { id = "AC-RQ9.7.5", text = "Each drill's record names its hardware, commit, load and counts, and is reproducible by one command." },
]
tests = [
  { id = "T-RQ9.7.1", text = "[failure] Wipe one storage node's disk under load → no blob lost; repair completes; every blob verifies." },
  { id = "T-RQ9.7.2", text = "[failure] Power off one machine of three under load → service continues; in-flight requests resume; nothing acknowledged is lost." },
  { id = "T-RQ9.7.3", text = "[failure] A disk that stalls for longer than any wait learned so far → requests move off it by RQ0.8's rule; none hangs." },
  { id = "T-RQ9.7.4", text = "[failure] A partition that isolates one machine, then heals → the isolated node refused typed while cut off; no divergent state after." },
  { id = "T-RQ9.7.5", text = "[failure] One more failure than stated → the registry refuses what it can no longer make durable, typed, and serves what it can verify; nothing is acknowledged that is not safe." },
  { id = "T-RQ9.7.6", text = "[crash] Garbage collection running through each drill → the property of RQ9.3 holds after." },
]

[[own]]
id = "RQ9.8"
phase = "RQ9"
title = "Upgrades with two versions running"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["CP-T9.7", "CP-T9.10"]
needs = ["RQ9.1"]
criteria = [
  { id = "AC-RQ9.8.1", text = "The differential suite passes on a cluster of mixed versions, N and N-1, with clients on either." },
  { id = "AC-RQ9.8.2", text = "A record written by N is read correctly by N-1, and the reverse, for every family, checked by golden records of every released version." },
  { id = "AC-RQ9.8.3", text = "A capability is used only after every node reports it; a node that joins without it holds the capability off." },
  { id = "AC-RQ9.8.4", text = "Rolling back one release restores service with no record lost, in a drill recorded before the release." },
]
tests = [
  { id = "T-RQ9.8.1", text = "[model] Generated histories against a mixed cluster → all match the model." },
  { id = "T-RQ9.8.2", text = "[happy] Upgrade a three-node cluster a node at a time under load → no request fails beyond those in flight on the restarting node." },
  { id = "T-RQ9.8.3", text = "[edge] A new node writes a record with a field the old does not know → the old node preserves the field when it rewrites the record." },
  { id = "T-RQ9.8.4", text = "[failure] An upgrade stopped halfway for a long time → the mixed cluster keeps serving." },
  { id = "T-RQ9.8.5", text = "[failure] The rollback drill → service restored; every artifact verifies." },
  { id = "T-RQ9.8.6", text = "[refusal] A node two releases behind tries to join → refused at its hello, naming both versions." },
]

[[own]]
id = "RQ9.9"
phase = "RQ9"
title = "Checking everything, end to end, in the background"
source = "docs/design/plan/phase-09-cluster.md"
serves = ["AC-T9.10.3"]
needs = ["RQ9.2"]
criteria = [
  { id = "AC-RQ9.9.1", text = "A planted wrong byte, missing object, dangling edge or orphan row is each found within one pass and reported with what it affects." },
  { id = "AC-RQ9.9.2", text = "A pass over the store completes in a time the pace states, and request latency during it stays within its interval." },
  { id = "AC-RQ9.9.3", text = "A damaged blob is never served: its pull is refused typed, naming the damage, until it is repaired or re-pushed." },
  { id = "AC-RQ9.9.4", text = "With the records of blobs deleted in a drill, the rebuild restores every blob record from Mantle, and every manifest then verifies." },
  { id = "AC-RQ9.9.5", text = "In every run with nothing planted, the check finds nothing." },
]
tests = [
  { id = "T-RQ9.9.1", text = "[failure] Flip a byte beneath Mantle's own checks (in a test build) → found; repaired from redundancy; verified." },
  { id = "T-RQ9.9.2", text = "[failure] Remove an object a blob record names → found; the blob marked damaged; pulls refused typed; a re-push repairs it." },
  { id = "T-RQ9.9.3", text = "[failure] The rebuild drill → records restored; the differential check of tags and manifests passes." },
  { id = "T-RQ9.9.4", text = "[exhaustion] The check running at full load → it yields; requests keep their latency; the pass takes longer and says so." },
  { id = "T-RQ9.9.5", text = "[race] A blob collected while the check reads it → no false damage report." },
]

