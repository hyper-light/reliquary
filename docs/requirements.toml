[[own]]
id = "RQ2.7"
phase = "RQ2"
title = "Tar and zip artifacts, and one file out of them"
source = "docs/design/plan/phase-02-artifacts.md"
serves = ["CP-T9.1"]
needs = ["RQ2.1", "RQ2.2"]
criteria = [
  { id = "AC-RQ2.7.1", text = "A tar, tar.gz, tar.zst or zip pushed as an archive artifact is stored byte for byte and pulls back identical." },
  { id = "AC-RQ2.7.2", text = "Its index lists exactly the entries its own tool lists, each with a digest that matches the extracted file." },
  { id = "AC-RQ2.7.3", text = "One file read through the registry equals the file its own tool extracts, for every entry of every archive in the corpus." },
  { id = "AC-RQ2.7.4", text = "Reading one file from a zip or plain tar reads only that file's bytes from Mantle, measured by the bytes-read counter." },
  { id = "AC-RQ2.7.5", text = "An archive RQ2.2 refuses is refused on push with the entry named; an encrypted zip entry is stored and indexed as unreadable, not refused." },
  { id = "AC-RQ2.7.6", text = "The index is itself an OCI artifact that any client can list through the referrers API." },
]
tests = [
  { id = "T-RQ2.7.1", text = "[happy] Push each archive form with ORAS, list it, and read one file from the middle → accepted; listed; the file identical to the tool's extraction." },
  { id = "T-RQ2.7.2", text = "[edge] An archive with one empty file; with a file larger than memory; with more entries than one index page holds; with a name of every script Unicode has → listed and read correctly." },
  { id = "T-RQ2.7.3", text = "[edge] A zip with stored, deflated and unsupported-method entries → the first two readable; the third listed with its method and refused typed on read." },
  { id = "T-RQ2.7.4", text = "[refusal] Ask for a path the archive lacks; a path with `..`; a directory → `404`, `400`, the directory's listing." },
  { id = "T-RQ2.7.5", text = "[race] The archive deleted while one of its files streams → the stream completes or ends in an error; never another archive's bytes." },
  { id = "T-RQ2.7.6", text = "[hostile] A zip whose index would be larger than the archive (millions of empty entries) → refused at the entry budget." },
  { id = "T-RQ2.7.7", text = "[failure] The index referrer is deleted → listing rebuilds it on demand within the check's budget, or answers typed that it is being rebuilt." },
  { id = "T-RQ2.7.8", text = "[exhaustion] Many clients each reading a late file of a large tar.gz → each read is charged its decompression; past the budget they are refused with `Retry-After`, and the registry stays responsive." },
]

[[own]]
id = "RQ2.8"
phase = "RQ2"
title = "Files by URL"
source = "docs/design/plan/phase-02-artifacts.md"
serves = ["CP-T9.1", "CP-T9.2"]
needs = ["RQ2.7"]
criteria = [
  { id = "AC-RQ2.8.1", text = "`curl -T file URL` then `curl -O URL` round-trips any file byte for byte, and `oras pull` of the same name and tag gets the same bytes." },
  { id = "AC-RQ2.8.2", text = "A `PUT` is atomic: a reader sees the old file or the new, never a part; a failed `PUT` leaves the old." },
  { id = "AC-RQ2.8.3", text = "The `GET` carries the file's SHA-256, honors ranges and conditional requests, and an immutable version answers with caching headers that say so." },
  { id = "AC-RQ2.8.4", text = "A `PUT` with a stated digest that is not the body's is refused and nothing changes." },
  { id = "AC-RQ2.8.5", text = "The URL's grammar maps onto a valid repository name and tag, and a path that does not is refused `400` saying why." },
]
tests = [
  { id = "T-RQ2.8.1", text = "[happy] Put and get a zip, a tar and a single binary → identical; each appears in the repository's tag list." },
  { id = "T-RQ2.8.2", text = "[edge] Put a zero-byte file; a file larger than memory; the same file twice; a second file to the same URL → stored; stored; unchanged; replaced atomically, or refused where the version is immutable." },
  { id = "T-RQ2.8.3", text = "[refusal] A path with an upper-case repository, an empty segment, or a tag over 128 characters → `400` with the rule." },
  { id = "T-RQ2.8.4", text = "[failure] The upload's connection drops at points across the file → the old file is still served whole." },
  { id = "T-RQ2.8.5", text = "[race] Two `PUT`s to one URL at once → one wins whole; the other is told it lost or wins after; a reader never sees a mix." },
  { id = "T-RQ2.8.6", text = "[hostile] A `PUT` with a `Content-Length` it does not honor; a filename with control characters or a NUL → refused." },
  { id = "T-RQ2.8.7", text = "[happy] An `.mcpb` bundle put by URL → its `fileSha256` as an MCP `server.json` would state it equals the header's digest." },
]

