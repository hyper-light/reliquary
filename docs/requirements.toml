  { id = "T-RQ4.9.2", text = "[edge] Open the admitted number of idle connections → memory grows by the pinned amount each, and returns when they close." },
  { id = "T-RQ4.9.3", text = "[edge] Start against stores of the plan's three scale sizes → times to ready overlap." },
  { id = "T-RQ4.9.4", text = "[exhaustion] Hold open uploads to the staging limit → memory within the counted bound." },
  { id = "T-RQ4.9.5", text = "[failure] Start after an unclean stop with a long recovery → ready only after recovery; its time is reported apart from a clean start's." },
  { id = "T-RQ4.9.6", text = "[perf] The same measurements on each competitor → recorded beside Reliquary's." },
