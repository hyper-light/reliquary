[package]
name = "reliquary-sim"
description = "Reliquary's simulated world (plan RQ0.6, docs/design/sim.md): nodes that run a core against the simulated seams, clients that run histories, a network, disks and clocks with faults, a nemesis, and the checks a run is judged by; every run a function of its seed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Records: Amphora's trait and data, which a node's calls carry and the records store answers through
# (architecture D2; docs/design/seams.md S11).
amphora-api = "0.1"
# SHA-256 of the event log, as kiln, Mantle and hyper-raft link it.
aws-lc-rs = "1.18"
# The world every run is in: virtual time, each machine's clocks, the event queue, named streams, the
# network, the decision trace and the run-twice check (architecture D21).
hyper-sim = "0.1"
# A machine clock and the stores' state are shared with the seams' simulators, which take them by Arc.
parking_lot = "0.12"
# The requests, the reference model whose decisions the model node runs, histories and the
# linearizability checker (plan RQ0.5).
reliquary-api = { path = "../reliquary-api" }
# The seams and their simulators (plan RQ0.4).
reliquary-core = { path = "../reliquary-core" }
thiserror = "2"

[dev-dependencies]
# The skip record, for the test that needs another platform's run to compare (plan RQ0.3).
reliquary-testkit = { path = "../reliquary-testkit" }

[lints]
workspace = true
