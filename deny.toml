# cargo-deny's checks of the dependency graph, the gate's `deny` step (scripts/gates.sh; plan RQ0.3,
# T-RQ0.3.4; docs/design/gates.md, G4): advisories, bans, licenses and sources, over every target
# Reliquary builds for and every feature. From Mantle's deny.toml (Mantle 89d365cc9bf3), with the
# targets Reliquary's (CLAUDE.md §12) and the changes each section says.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
# Every feature: the recursion check builds them all (scripts/check-recursion.py), and a dependency
# a feature brings is as linked as any other.
all-features = true

[advisories]
# A crate with a RustSec advisory, unmaintained or unsound included, fails; so does a yanked version.
yanked = "deny"
unmaintained = "all"
unsound = "all"
# The one kind of exception: an advisory in what a vendored product brings, which Reliquary may not
# change (CLAUDE.md, "Vendoring"; another product's dependencies are its owner's). Each is allowed
# only for the crate of that product that depends on it directly, expires, and is asked of the
# product's owner (STATUS.md, "Open"). Today all are the Amphora store's (vendor/amphora): chrono
# through amphora-engine, and heapless 0.7 through postcard 1.1, whose `^0.7` keeps out the fixes.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained, through vendored Amphora's engine", allow = ["amphora-engine", "amphora-engine-ext"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0574", reason = "heapless 0.7, unsound (FindMutView::pop), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0575", reason = "heapless 0.7, unsound (Spsc::peek), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0576", reason = "heapless 0.7, unsound (IndexMap::truncate), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0577", reason = "heapless 0.7, unsound (a panicking Drop), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0578", reason = "heapless 0.7, unsound (SortedLinkedList::zeroize), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0579", reason = "heapless 0.7, unsound (Deque from TryFrom), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0580", reason = "heapless 0.7, unsound (the treiber stack), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0581", reason = "heapless 0.7, unsound (Deque::make_contiguous), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
  { id = "RUSTSEC-2026-0582", reason = "heapless 0.7, unsound (IndexMap::insert at u16::MAX), through postcard 1.1 in vendored Amphora", allow = ["postcard"], expiry = "2026-12-20" },
]

[licenses]
# The licenses Reliquary's dependencies may carry: permissive ones, as Mantle's list, with OpenSSL's
# for AWS-LC's (aws-lc-sys: "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"), the crypto kiln links.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.93
# The list is the policy for what Reliquary ships; cargo-deny reads no dev-dependency's license
# (its `include-dev` default: a test's dependency is in no artifact), so an allowed license nothing
# shipping carries yet is not a finding.
unused-allowed-license = "allow"

[bans]
# Two versions of a crates.io crate are allowed and said; two of a shared hyper-light crate fail
# crates/reliquary/tests/vendored.rs (AC-RQ0.1.3).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# One TLS stack and one crypto library, AWS-LC's, as kiln links them (vendor/aws-lc-rs/UPSTREAM.md).
deny = [
  { crate = "openssl", reason = "Reliquary's TLS is hyper-tls over aws-lc-rs" },
  { crate = "openssl-sys", reason = "Reliquary's TLS is hyper-tls over aws-lc-rs" },
  { crate = "native-tls", reason = "Reliquary's TLS is hyper-tls over aws-lc-rs" },
]

[sources]
# crates.io alone; another hyper-light product comes by name and version, patched to its vendored
# copy (CLAUDE.md, "Vendoring"), never from git. The one git source is what vendored Amphora takes,
# socket2 at a fixed commit, an exception of the kind [advisories] states.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/rust-lang/socket2"]
required-git-spec = "rev"
