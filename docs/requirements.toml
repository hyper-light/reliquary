  { id = "T-RQ3.7.4", text = "[failure] The native door goes away mid-pull → the pull resumes over the OCI door from its verified prefix." },
  { id = "T-RQ3.7.5", text = "[refusal] An unenrolled Shards against a private repository → the OCI door's `401` flow, as before." },
  { id = "T-RQ3.7.6", text = "[edge] A reference with a tag, with a digest, and with both → resolved as Shards' reference parser states." },
