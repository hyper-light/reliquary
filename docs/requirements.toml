  { id = "T-RQ2.4.2", text = "[hostile] Flip each superblock field in turn; point an inode's data past the end; make two directories each other's parent; set an unknown feature bit → each refused, naming the structure." },
  { id = "T-RQ2.4.3", text = "[hostile] Mutation-fuzz valid disks and mount every one the validator accepts in a throwaway guest → no accepted disk makes the guest's kernel fault or read outside the image." },
  { id = "T-RQ2.4.4", text = "[edge] A disk of one empty directory; one with a file of exactly one block; one with the longest name and the deepest path the format allows; one larger than memory → accepted." },
  { id = "T-RQ2.4.5", text = "[refusal] A microVM manifest with two disks; with no config; with a disk of the wrong media type → refused." },
  { id = "T-RQ2.4.6", text = "[exhaustion] A disk whose directory count exceeds the check's entry budget → refused typed at the budget." },
  { id = "T-RQ2.4.7", text = "[happy] A microVM built from an Agentfile and one made ad hoc from `ubuntu` → both accepted by the same checks." },
]

