  { id = "T-RQ12.6.3", text = "[race] The home is moved while the old home is alive but partitioned, and both take a write → the old home's write is refused or, when it rejoins, superseded by the stated rule; never two histories." },
  { id = "T-RQ12.6.4", text = "[failure] The region returns after a long absence with a different state → reconciled; states equal; it was not ready before." },
  { id = "T-RQ12.6.5", text = "[exhaustion] Reconciliation of regions holding the scale phase's repository count with a small difference → work proportional to the difference." },
]

[[own]]
id = "RQ12.7"
phase = "RQ12"
title = "One suite, three regions"
source = "docs/design/plan/phase-12-regions.md"
serves = ["CP-T9.9"]
needs = ["RQ12.5", "RQ12.6"]
criteria = [
  { id = "AC-RQ12.7.1", text = "The same differential suite passes on one node, three nodes and three regions, with the guarantees each repository's rule states." },
  { id = "AC-RQ12.7.2", text = "Coverage shows no branch of the core that only a multi-region deployment takes, other than the replication rule's own." },
  { id = "AC-RQ12.7.3", text = "The suite's non-vacuity counters show cross-region conflicts, forwards, fetch-throughs and reconciliations each occurred." },
]
tests = [
  { id = "T-RQ12.7.1", text = "[model] Generated histories on three regions with the nemesis → all match the model under each rule." },
  { id = "T-RQ12.7.2", text = "[livelock] Two regions forwarding a write to each other because each believes the other is home → cannot happen: the home is a record with one value; the test forces the belief and shows the refusal." },
  { id = "T-RQ12.7.3", text = "[deadlock] Each region waiting for another's acknowledgement under a rule that needs two → a region that cannot get it refuses typed; none waits for good." },
  { id = "T-RQ12.7.4", text = "[non-vacuity] The counters → all above zero." },
]

[[own]]
id = "RQ13.1"
phase = "RQ13"
title = "The fleet Hex runs, simulated"
source = "docs/design/plan/phase-13-scale-release.md"
serves = ["CP-T9.10"]
needs = ["RQ9", "RQ10"]
criteria = [
  { id = "AC-RQ13.1.1", text = "The simulation at Hex's stated scale completes with every start served, every answer matching the model, and no bound exceeded." },
  { id = "AC-RQ13.1.2", text = "For each request kind, work per request at the plan's three scale sizes is flat or grows no faster than the logarithm the design states, by counter." },
  { id = "AC-RQ13.1.3", text = "Memory per node in the simulation stays within the budget derived for it at every size." },
  { id = "AC-RQ13.1.4", text = "A burst in which every node asks for one new image at once is served with origin bytes within RQ10.7's bound and no request waiting past what its admission stated." },
  { id = "AC-RQ13.1.5", text = "The scale figures come from Hex's design record and published sources cited in `docs/research/`; none is picked here." },
]
tests = [
  { id = "T-RQ13.1.1", text = "[model] The simulation at Hex's scale with the nemesis → matches the model; liveness holds." },
  { id = "T-RQ13.1.2", text = "[exhaustion] The burst: every node starts the same unheld image in the same instant → served; origin within bound; no queue unbounded." },
  { id = "T-RQ13.1.3", text = "[edge] One repository with as many tags as the largest test size; one namespace with as many repositories; one blob linked by as many repositories → listings page; pulls and collection keep their cost." },
  { id = "T-RQ13.1.4", text = "[perf] Measure work per request at the three registry sizes → records of record; flat or within the stated logarithm." },
  { id = "T-RQ13.1.5", text = "[deadlock] The whole fleet at its admission limits at once, across records, bytes and peers → the simulation ends with all work done or refused, none waiting." },
]

[[own]]
id = "RQ13.2"
phase = "RQ13"
title = "A capacity model, checked against real machines"
source = "docs/design/plan/phase-13-scale-release.md"
serves = ["AC-T9.10.2"]
needs = ["RQ4.10", "RQ9"]
criteria = [
  { id = "AC-RQ13.2.1", text = "The model's predicted saturation throughput for each request kind is within the measured interval on one node and on three, on at least two different machines." },
  { id = "AC-RQ13.2.2", text = "Every input of the model is measured by `reliquary doctor` or `reliquary bench` on the machine in question; none is a number carried from another machine." },
  { id = "AC-RQ13.2.3", text = "The document separates what was measured, what was simulated and what is predicted, and says which hardware each measurement is from." },
  { id = "AC-RQ13.2.4", text = "Where a prediction depends on Mantle's or Amphora's own scaling, it cites their records and does not restate them." },
]
tests = [
  { id = "T-RQ13.2.1", text = "[perf] Saturation runs for each request kind on one node and three, of record → within the model's interval." },
  { id = "T-RQ13.2.2", text = "[edge] The same runs on a second, different machine → the model, fed that machine's measurements, holds there too." },
  { id = "T-RQ13.2.3", text = "[refusal] A model input missing on a machine → the tool says which measurement to run; it does not substitute a default." },
]

[[own]]
id = "RQ13.3"
phase = "RQ13"
title = "Fire drills"
source = "docs/design/plan/phase-13-scale-release.md"
serves = ["AC-T9.10.3"]
needs = ["RQ9.7", "RQ12.6"]
criteria = [
  { id = "AC-RQ13.3.1", text = "Artifacts lost in the fire drills (node off, disk lost, partition, region lost) is exactly 0, measured by the drills' counts (AC-T9.10.3)." },
  { id = "AC-RQ13.3.2", text = "Each drill's record states what was running, what failed, what requests failed and why, how long recovery took and what bounded it." },
  { id = "AC-RQ13.3.3", text = "After each drill the fleet returns to its stated redundancy with no operator action, and says when it has." },
  { id = "AC-RQ13.3.4", text = "Each drill is one command and is repeated until its record shows the same outcome on consecutive runs." },
]
tests = [
  { id = "T-RQ13.3.1", text = "[failure] Node off, under load → no acknowledged artifact lost; in-flight requests resume." },
  { id = "T-RQ13.3.2", text = "[failure] Disk lost → repaired; every blob verifies." },
  { id = "T-RQ13.3.3", text = "[failure] Partition, each way of cutting three machines → the majority serves; the rest refuses typed; no divergence." },
  { id = "T-RQ13.3.4", text = "[failure] Region lost → RQ12.6's outcome." },
  { id = "T-RQ13.3.5", text = "[failure] Two of the above at once, within and beyond the stated failures to survive → within: as above; beyond: typed refusal of what is no longer safe, and nothing acknowledged is lost." },
]

[[own]]
id = "RQ13.4"
phase = "RQ13"
title = "A security review that tries to break it"
source = "docs/design/plan/phase-13-scale-release.md"
serves = ["CP-T9.10"]
needs = ["RQ9"]
criteria = [
  { id = "AC-RQ13.4.1", text = "`docs/design/threat-model.md` lists each asset, each actor, each boundary and each mitigation, with the test that shows the mitigation." },
  { id = "AC-RQ13.4.2", text = "Every parser of external input (HTTP, HPACK, JSON, YAML, tar, gzip, zstd, zip, EROFS, JWT, DER, protobuf-JSON, Rego, the native wire) has a fuzz target, and each has run until new coverage stopped for the campaign's stated length." },
  { id = "AC-RQ13.4.3", text = "The adversarial review's findings are each recorded in `docs/bugs/` with a failing test, a fix and a re-check by a second fresh subagent." },
  { id = "AC-RQ13.4.4", text = "No secret appears in any log, event, error, metric or dump the review could obtain." },
  { id = "AC-RQ13.4.5", text = "Dependencies have no open advisory, and every vendored change is recorded." },
]
tests = [
  { id = "T-RQ13.4.1", text = "[hostile] The review's attempts: cross-tenant read by mount, by cache timing, by search counts, by peer holdings; privilege gain through token confusion between doors; path escape through every archive kind → each refused, each a test." },
  { id = "T-RQ13.4.2", text = "[hostile] Resource exhaustion through each door's every bound → typed refusals; service to others within its interval." },
  { id = "T-RQ13.4.3", text = "[hostile] A malicious upstream, peer, publisher and client, one at a time → none makes Reliquary serve wrong bytes or store unverified ones." },
  { id = "T-RQ13.4.4", text = "[non-vacuity] Measure each fuzz target's coverage → its corpus reaches the code it is for; a target that reaches nothing fails." },
]

[[own]]
id = "RQ13.5"
phase = "RQ13"
title = "Operating it"
source = "docs/design/plan/phase-13-scale-release.md"
serves = ["AC-T9.10.1"]
needs = ["RQ9"]
criteria = [
  { id = "AC-RQ13.5.1", text = "Every alert has a runbook, and a fresh subagent following each runbook on a lab fault resolves it or reaches the stated escalation." },
  { id = "AC-RQ13.5.2", text = "Every metric and event in code is on a dashboard or is listed as deliberately not; the doc-truth test of RQ0.9 enforces it." },
  { id = "AC-RQ13.5.3", text = "A restore of the records from a backup, in the lab, yields a registry in which every artifact acknowledged before the backup verifies." },
  { id = "AC-RQ13.5.4", text = "Draining a node fails no request: in-flight ones finish or move, by counter." },
  { id = "AC-RQ13.5.5", text = "Objectives and alert thresholds are the operator's statements with documented starting points derived from the comparison's measured latencies; none is fixed in the binary." },
]
tests = [
  { id = "T-RQ13.5.1", text = "[happy] Plant each fault a runbook covers → its alert fires; the runbook resolves it." },
  { id = "T-RQ13.5.2", text = "[failure] The backup and restore drill → verified." },
  { id = "T-RQ13.5.3", text = "[happy] Drain a node under load → no failed request." },
  { id = "T-RQ13.5.4", text = "[edge] An alert's condition flapping at its threshold → one page, not many." },
]

[[own]]
id = "RQ13.6"
phase = "RQ13"
title = "The release, and a stranger's first hour"
source = "docs/design/plan/phase-13-scale-release.md"
serves = ["AC-T9.10.1", "T-T9.10.1"]
needs = ["RQ9"]
criteria = [
  { id = "AC-RQ13.6.1", text = "A fresh machine reaches a working Reliquary from its README alone, by a fresh subagent (T-T9.10.1), on Linux, macOS and Windows." },
  { id = "AC-RQ13.6.2", text = "Each target's archive passes the client matrix and the conformance suite on a runner of that target before it is published." },
  { id = "AC-RQ13.6.3", text = "Each archive's signature, SBOM and provenance verify with cosign and with `reliquary`, from Reliquary's own registry." },
  { id = "AC-RQ13.6.4", text = "Every command and configuration example in the documentation is executed by a doc-truth test." },
  { id = "AC-RQ13.6.5", text = "An upgrade from the previous release, and a rollback to it, are documented and drilled." },
  { id = "AC-RQ13.6.6", text = "The Linux archives run unchanged on the current releases of Debian, Ubuntu, Fedora, a RHEL-compatible distribution, openSUSE, Arch and Alpine, on x86_64 and arm64; the Windows archives on x86_64 and arm64; the macOS archive on arm64 alone, and an Intel Mac is refused by name." },
]
tests = [
  { id = "T-RQ13.6.1", text = "[happy] The fresh-subagent test on each platform → a push and a pull succeed within the README's steps, with no step the README lacks." },
  { id = "T-RQ13.6.2", text = "[refusal] An archive whose signature is stripped or altered → `reliquary` refuses to self-upgrade to it." },
  { id = "T-RQ13.6.3", text = "[edge] Install with no network after the download; with a data directory on a small disk; as an unprivileged user → works or refuses typed, saying what is needed." },
  { id = "T-RQ13.6.4", text = "[happy] The documentation's examples → all pass." },
  { id = "T-RQ13.6.5", text = "[edge] Install and run the client matrix's smoke test on each Linux distribution of AC-RQ13.6.6, on Windows on both architectures, and on macOS arm64 → each works from the same archive for its target." },
  { id = "T-RQ13.6.6", text = "[refusal] Run the macOS archive's installer on an Intel Mac (or under the x86_64 slice) → one typed line naming the platform as unsupported." },
]

