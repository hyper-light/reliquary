[package]
name = "reliquary"
description = "Reliquary: the registry for agents, skills and more: build once, equip every agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "reliquary"
path = "src/main.rs"

# `reliquary bench` (plan RQ0.7).
[dependencies]
reliquary-bench = { path = "../reliquary-bench" }

# What tests/vendored.rs links: each crate Reliquary vendors and names (vendor/MANIFEST.toml), by name and
# version, patched to its copy (the root Cargo.toml), so the workspace links one revision of each and builds
# for every target (plan RQ0.1); and the manifests' and cargo's own formats, read by the pin and
# one-revision tests.
[dev-dependencies]
amphora = "0.1"
amphora-api = "0.1"
aws-lc-rs = "1.18"
hyper-measure = "0.1"
hyper-quic = "0.1"
hyper-rt = "0.1"
hyper-rt-transport = "0.1"
hyper-sim = "0.1"
hyper-timing = "0.1"
hyper-tls = "0.1"
hyper-transport = "0.1"
mantle-client = "0.1"
mantle-crc = "0.1"
mantle-http = "0.1"
mantle-protocol = "0.1"
serde_json = "1"
tempfile = "3"
toml = "0.9"
# The skip record, for tests/gates.rs's and tests/vendored.rs's tests that need the network or a tool
# the runner may lack (plan RQ0.3).
reliquary-testkit = { path = "../reliquary-testkit" }

[lints]
workspace = true
