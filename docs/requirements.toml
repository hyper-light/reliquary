criteria = [
  { id = "AC-RQ11.3.1", text = "The CI cache service (GitHub's cache API) works unchanged on Reliquary (AC-T9.8.3): `actions/cache`, the setup actions' caches and BuildKit's cache backend pass kiln's existing suite with no client change." },
  { id = "AC-RQ11.3.2", text = "Lookup returns what GitHub's rules return for every case of kiln's cache conformance: exact key, restore prefixes in order, scope fallbacks, version mismatch." },
  { id = "AC-RQ11.3.3", text = "A cache entry, once finalized, is immutable; a second save of the same key and version is refused as GitHub refuses it." },
  { id = "AC-RQ11.3.4", text = "Stored bytes for a sequence of slightly changed caches grow by about the changes, per RQ10.1's measured sharing for that content." },
  { id = "AC-RQ11.3.5", text = "A restore's download is a signed URL to bytes served at the speed RQ4 measured for blobs of its size." },
]
tests = [
  { id = "T-RQ11.3.1", text = "[happy] A workflow saves a cache and a later run restores it → identical bytes." },
  { id = "T-RQ11.3.2", text = "[edge] Keys that share a prefix; a restore key that matches several entries; an entry from the default branch read by a pull request and the reverse → GitHub's answers." },
  { id = "T-RQ11.3.3", text = "[race] Two legs save the same key at once → one wins; the other gets GitHub's \"already exists\"." },
  { id = "T-RQ11.3.4", text = "[race] An entry evicted while a leg downloads it → the download completes or fails cleanly; a miss on the next lookup." },
  { id = "T-RQ11.3.5", text = "[failure] A save cut midway → no entry; no partial restore possible." },
  { id = "T-RQ11.3.6", text = "[exhaustion] Saves past the repository's quota → the least valuable entries go first; the save succeeds or is refused typed if nothing can go." },
  { id = "T-RQ11.3.7", text = "[hostile] A token for one repository's legs asking for another's cache → refused." },
]

