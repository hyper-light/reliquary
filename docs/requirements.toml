  { id = "AC-RQ12.4.2", text = "The winner under multi-writer is a function of the two moves alone: any region computes it from them, in any delivery order." },
  { id = "AC-RQ12.4.3", text = "The losing move's manifest remains pullable by digest, and an event names both digests and the rule that decided." },
  { id = "AC-RQ12.4.4", text = "Immutability is never broken: an immutable tag in a multi-writer repository is refused when the rule is stated." },
  { id = "AC-RQ12.4.5", text = "A clock that is wrong in one region cannot make that region win forever: the logical part of the clock bounds its lead, and the test shows it." },
]
tests = [
