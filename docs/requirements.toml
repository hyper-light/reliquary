  { id = "T-RQ0.3.2", text = "[refusal] Add two functions that call each other through a trait object → the gate fails and names the cycle." },
  { id = "T-RQ0.3.3", text = "[refusal] Add `unsafe` in a file CLAUDE.md does not name → the gate fails." },
  { id = "T-RQ0.3.4", text = "[refusal] Add a dependency with an advisory, and one with a license outside the allow list → `cargo deny` fails each." },
  { id = "T-RQ0.3.5", text = "[refusal] Add a test citing `T-RQ9.99.9` → the citation gate fails." },
  { id = "T-RQ0.3.6", text = "[edge] A test that needs a privilege the runner lacks → it skips, and its line is in the skip record with what it lacked." },
  { id = "T-RQ0.3.7", text = "[edge] A test that returns early without recording a skip → the gate's audit of early returns flags it." },
  { id = "T-RQ0.3.8", text = "[happy] Run the gate on one commit on each of the five targets → it passes on each." },
  { id = "T-RQ0.3.9", text = "[edge] Run the suite in a container of each Linux distribution family, glibc and musl, on x86_64 and arm64 → it passes in each, or the record names the family and what it lacked." },
]

[[own]]
id = "RQ0.4"
phase = "RQ0"
title = "Seams to other products, each with a simulator and a suite"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1"]
needs = ["RQ0.1"]
criteria = [
  { id = "AC-RQ0.4.1", text = "Each trait's contract is a numbered list of clauses in `docs/design/seams.md`, and a doc-truth test checks each clause has a suite case." },
  { id = "AC-RQ0.4.2", text = "Each simulator passes its suite." },
  { id = "AC-RQ0.4.3", text = "Each simulator can inject: every typed refusal of its trait, an answer delayed past the caller's patience, an answer lost after the effect applied, and a stream cut at any byte." },
  { id = "AC-RQ0.4.4", text = "No trait carries a whole object in memory: bodies move as bounded pieces, and a counting-allocator test shows peak memory does not grow with object size." },
  { id = "AC-RQ0.4.5", text = "No trait method takes a timeout as a number: each takes a deadline its caller derives." },
]
tests = [
  { id = "T-RQ0.4.1", text = "[happy] Put an object many times larger than the memory budget through `Bytes` in pieces and get it back → identical bytes; peak heap within one piece plus the counted overhead." },
  { id = "T-RQ0.4.2", text = "[refusal] Create-once on a key that exists → refused as existing, and the first object is unchanged." },
  { id = "T-RQ0.4.3", text = "[edge] Resume a put from each possible durable offset after a cut → the object is whole, and no byte was sent twice past the last run." },
  { id = "T-RQ0.4.4", text = "[edge] Ranges at the first byte, the last byte, past the end, and of zero length → answered as RFC 9110 has them." },
  { id = "T-RQ0.4.5", text = "[race] Two create-once puts of one key at once → exactly one wins; the other is told it exists." },
  { id = "T-RQ0.4.6", text = "[failure] An answer lost after a commit applied → the caller reconciles by reading and never applies twice." },
  { id = "T-RQ0.4.7", text = "[exhaustion] The simulator refuses `Full` and `Busy` → the caller gets a typed refusal, and nothing is retried in a loop." },
  { id = "T-RQ0.4.8", text = "[hostile] A grant with a changed key, method, size or expiry → refused by the simulator's Mantle side." },
  { id = "T-RQ0.4.9", text = "[non-vacuity] The suite counts each injected fault kind per trait → every count is above zero." },
]

[[own]]
id = "RQ0.5"
phase = "RQ0"
title = "A reference model and a differential harness"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1", "AC-T9.7.4"]
needs = ["RQ0.1"]
criteria = [
  { id = "AC-RQ0.5.1", text = "The model answers every endpoint of distribution spec v1.1.1, with its status and error code, with no I/O, no concurrency and no cache: each answer is one function of the model's state." },
  { id = "AC-RQ0.5.2", text = "The generator produces every operation, every refusal the spec names, and interleavings of two to many clients; its counters show each was produced." },
  { id = "AC-RQ0.5.3", text = "The checker finds a planted bug in each of: a lost tag update, a manifest accepted with a missing blob, a blob readable through a repository it was never pushed to, and a non-linearizable tag read." },
  { id = "AC-RQ0.5.4", text = "A failing history is shrunk to a minimal one and replays from its seed." },
]
tests = [
  { id = "T-RQ0.5.1", text = "[model] Run generated histories against the model alone until every operation kind and error code has occurred → its own invariants hold throughout (a tag always names a manifest that exists; a manifest's blobs exist)." },
  { id = "T-RQ0.5.2", text = "[model] Run the model against itself with one planted fault per run → each fault is reported; none is missed." },
  { id = "T-RQ0.5.3", text = "[edge] Histories with zero operations, one operation, and only refused operations → pass." },
  { id = "T-RQ0.5.4", text = "[race] Two clients moving one tag while a third reads it → every read is a value some linearization allows." },
  { id = "T-RQ0.5.5", text = "[non-vacuity] Read the counters after a run → each operation kind and each error code is above zero; a run where one is zero fails." },
  { id = "T-RQ0.5.6", text = "[happy] Run again with a failing seed that one run printed → the same failure, at the same operation." },
]

[[own]]
id = "RQ0.6"
phase = "RQ0"
title = "A simulated world with a nemesis"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1", "CP-T9.7", "CP-T9.9"]
needs = ["RQ0.4", "RQ0.5"]
criteria = [
  { id = "AC-RQ0.6.1", text = "The same seed gives the same history and the same verdict on every supported target." },
  { id = "AC-RQ0.6.2", text = "The nemesis can crash a node, cut power under a write, partition any set of nodes, slow a link or a disk, jump a clock, and lose an answer." },
  { id = "AC-RQ0.6.3", text = "Crash injection covers every write: a sweep cuts power before and after each write a history makes to records and to bytes." },
  { id = "AC-RQ0.6.4", text = "No simulated wait is a wall-clock sleep: a grep for `thread::sleep` and runtime sleeps in tests finds none." },
  { id = "AC-RQ0.6.5", text = "A liveness check fails a run in which a client's operation neither completes nor is refused once faults stop." },
]
tests = [
  { id = "T-RQ0.6.1", text = "[happy] A history with no faults → every operation completes and matches the model." },
  { id = "T-RQ0.6.2", text = "[crash] Power cut at each write of a push, one run per write → after restart no acknowledged operation is lost and no partial object is visible." },
  { id = "T-RQ0.6.3", text = "[failure] A partition between a node and its records → operations are refused typed, and complete after the partition heals." },
  { id = "T-RQ0.6.4", text = "[livelock] Two clients retrying conflicting tag moves forever → both finish within a counted number of attempts; the run fails if either starves." },
  { id = "T-RQ0.6.5", text = "[deadlock] A history that takes every pair of resources in both orders → no run ends with waiters and no progress." },
  { id = "T-RQ0.6.6", text = "[edge] A clock that jumps backward by more than any lease in the run → no lease is honored twice and no wait becomes negative." },
  { id = "T-RQ0.6.7", text = "[non-vacuity] Read the fault counters after a nemesis run → each fault kind is above zero." },
  { id = "T-RQ0.6.8", text = "[happy] One seed run on Linux, macOS and Windows → the three event logs are byte-identical." },
]

[[own]]
id = "RQ0.7"
phase = "RQ0"
title = "A measurement tool that states intervals and compares two builds"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.10", "AC-T9.1.4"]
needs = ["RQ0.1"]
criteria = [
  { id = "AC-RQ0.7.1", text = "A point's report follows Mantle's `docs/design/measurement.md` §2 to §6: order in time, states, medians with intervals, and no mean." },
  { id = "AC-RQ0.7.2", text = "A|B mode reports \"A better\", \"B better\" or \"not separated\", with both intervals, and never a verdict from non-overlapping means alone." },
  { id = "AC-RQ0.7.3", text = "An A|A run (the same build twice) reports a difference no more often than the tests' stated level, 5%, the level Mantle's measurement design uses." },
  { id = "AC-RQ0.7.4", text = "A record made above the load rule is marked \"not of record\" and cannot be cited by an acceptance criterion." },
  { id = "AC-RQ0.7.5", text = "Open-loop load generation records each operation's intended start, and latency is measured from it." },
  { id = "AC-RQ0.7.6", text = "CI gates instruction counts for the benches it names, and a nightly run feeds latency to a change-point detector whose alert names the commit range." },
  { id = "AC-RQ0.7.7", text = "How many builds, process starts and rounds a point is measured over follows from the variation measured at each level and the interval asked for; the record states each count and why, and no \"best of N\" has a picked N." },
  { id = "AC-RQ0.7.8", text = "The change-point detector gives the same verdict on the same history every time it is run." },
]
tests = [
  { id = "T-RQ0.7.1", text = "[happy] Measure a synthetic operation with a known latency distribution → the reported quantiles' intervals contain the true values." },
  { id = "T-RQ0.7.2", text = "[edge] A synthetic operation with two states, the minority above the share the dip test can see → two states are reported, each with its share." },
  { id = "T-RQ0.7.3", text = "[edge] Rounds that drift upward in time → reported as ordered, with no interval stated." },
  { id = "T-RQ0.7.4", text = "[refusal] Ask for a p99.9 from too few samples → a dash, not a number." },
  { id = "T-RQ0.7.5", text = "[failure] A server that stalls for a second mid-run under open-loop load → the stall appears in the tail; under a closed-loop control run it would not, and the test shows the difference." },
  { id = "T-RQ0.7.6", text = "[happy] A|B of a build against one with a planted slowdown wider than the point's interval → \"B worse\", intervals separated." },
  { id = "T-RQ0.7.7", text = "[refusal] A|B of two identical builds, repeated → verdicts of a difference stay within the stated 5% level, by a binomial test." },
  { id = "T-RQ0.7.8", text = "[edge] A benchmark started while another process loads the machine → the record says \"not of record\" and names the load." },
  { id = "T-RQ0.7.9", text = "[edge] A synthetic benchmark whose variation lies between process starts and not between rounds → the tool repeats process starts, not rounds, and the record says so." },
  { id = "T-RQ0.7.10", text = "[edge] Run the detector twice over one recorded series with a planted shift → the same change point both times, at the planted commit range." },
]

[[own]]
id = "RQ0.8"
phase = "RQ0"
title = "Estimators for everything that would have been a constant"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1"]
needs = ["RQ0.1", "RQ0.6"]
criteria = [
  { id = "AC-RQ0.8.1", text = "Each estimator is a pure state machine with no clock, socket or file of its own." },
  { id = "AC-RQ0.8.2", text = "No estimator starts from a guessed value: its cold-start behavior is stated and is a function of liveness, progress or a protocol's own figure." },
  { id = "AC-RQ0.8.3", text = "In simulation each estimator converges on a stationary path, and follows a step change, a slow drift and a two-state path, with the lag stated and bounded by samples, not time." },
  { id = "AC-RQ0.8.4", text = "What is learned is keyed by what it describes and never by the machine alone; a record learned on one path is not applied to another." },
  { id = "AC-RQ0.8.5", text = "Records written by two processes at once merge without losing either's samples." },
  { id = "AC-RQ0.8.6", text = "Every figure inside an estimator has a row in `docs/design/constants.md` of an accepted kind." },
  { id = "AC-RQ0.8.7", text = "Each estimator states its objective, the range its output cannot leave (derived, never picked) and what it does when its feedback stops or contradicts itself." },
  { id = "AC-RQ0.8.8", text = "Learning is not assumed to win: where a cited source measured a fixed rule (a share, a percentile), the estimator is adopted only if an A|B on recorded traces shows it no worse; otherwise the cited rule stands, as a `cited` row with the range over which its source found it insensitive." },
]
tests = [
  { id = "T-RQ0.8.1", text = "[happy] A path with a fixed latency → the wait settles above it and no healthy request is cut." },
  { id = "T-RQ0.8.2", text = "[edge] Latency doubles mid-run → no more than the stated number of requests are cut before the wait follows." },
  { id = "T-RQ0.8.3", text = "[edge] Latency halves mid-run → the wait comes down, by the aging rule, within the stated number of samples." },
  { id = "T-RQ0.8.4", text = "[failure] A peer that accepts a request and then goes silent → the wait ends when liveness ends, not at a fixed time." },
  { id = "T-RQ0.8.5", text = "[edge] A cold start against a path slower than any seen before → the first request is not cut while the peer shows progress." },
  { id = "T-RQ0.8.6", text = "[hostile] A peer that sends one byte just often enough to look alive → progress, not liveness alone, bounds the wait, and the transfer is cut and told as stalled." },
  { id = "T-RQ0.8.7", text = "[livelock] An admission limit probing around its base while load oscillates at the probe period → the limit does not chase the oscillation to its floor." },
  { id = "T-RQ0.8.8", text = "[edge] The limit when no request was ever turned away → unchanged: a phase that measured its clients moves nothing." },
  { id = "T-RQ0.8.9", text = "[race] Two processes ending transfers at once write one path's record → both samples are in the merged record." },
  { id = "T-RQ0.8.10", text = "[exhaustion] More distinct paths than the record store's bound → the least recently used are evicted by the stated rule, and a typed count says how many." },
  { id = "T-RQ0.8.11", text = "[failure] Feed an estimator feedback that is wrong (successes reported as failures), then none at all → its output stays inside its stated range; it falls back as stated; the anomaly is told as an event." },
  { id = "T-RQ0.8.12", text = "[refusal] An estimator that loses its A|B to the cited fixed rule on the recorded traces → it is not adopted: the record names the fixed rule as the winner and the constants table carries it as `cited`." },
]

[[own]]
id = "RQ0.9"
phase = "RQ0"
title = "Observability from the first line"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1"]
needs = ["RQ0.1"]
criteria = [
  { id = "AC-RQ0.9.1", text = "A metric or event in code that the document lacks fails a test, and so does a documented one the code lacks." },
  { id = "AC-RQ0.9.2", text = "A label whose values come from a request (a repository, a tag, a digest, a principal) fails a lint." },
  { id = "AC-RQ0.9.3", text = "The naming scheme is recorded as agreed with Observe's owner, with the message's date." },
  { id = "AC-RQ0.9.4", text = "Every component added later ships its dashboard rows in the same change, checked by the same test." },
]
tests = [
  { id = "T-RQ0.9.1", text = "[refusal] Add a counter with a `repository` label → the lint fails." },
  { id = "T-RQ0.9.2", text = "[refusal] Add a metric without documenting it → the doc-truth test fails and names it." },
  { id = "T-RQ0.9.3", text = "[refusal] Name a metric `reliquary_pull_ms` → the unit lint fails and asks for `_seconds`." },
  { id = "T-RQ0.9.4", text = "[happy] Scrape a running stub → every sample parses as OpenMetrics and has a HELP and a TYPE." },
  { id = "T-RQ0.9.5", text = "[exhaustion] Emit events faster than the sink takes them → the oldest are dropped by the stated rule and a counter says how many; the emitter never blocks." },
]

[[own]]
id = "RQ1.1"
phase = "RQ1"
title = "Names, tags, digests and media types"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2"]
needs = ["RQ0"]
criteria = [
  { id = "AC-RQ1.1.1", text = "A name is accepted exactly when it matches the spec's regular expression and fits the length a registry host plus name may take; a tag exactly when it matches the spec's and is at most 128 characters." },
  { id = "AC-RQ1.1.2", text = "A digest is accepted exactly when its algorithm is registered and its encoded part has that algorithm's length in lowercase hex." },
  { id = "AC-RQ1.1.3", text = "A digest resumed from a saved state at any block boundary equals the one-shot digest." },
  { id = "AC-RQ1.1.4", text = "No parser allocates more than its input's length, reads past it, or takes time worse than linear in it." },
  { id = "AC-RQ1.1.5", text = "Each parser agrees with a reference on generated input: the spec's expression run by a regex engine for names and tags, and go-digest's vectors for digests." },
]
tests = [
  { id = "T-RQ1.1.1", text = "[happy] Parse every name, tag and digest in the spec's own examples → each accepted, each round-trips to the same text." },
  { id = "T-RQ1.1.2", text = "[refusal] Names with an upper-case letter, a leading or trailing separator, `..`, `//`, three underscores, or an empty component → each refused `NAME_INVALID`." },
  { id = "T-RQ1.1.3", text = "[edge] A tag of exactly 128 characters, and one of 129; a tag starting with `.` or `-` → accepted, refused, refused." },
  { id = "T-RQ1.1.4", text = "[edge] `sha256` with 63 and 65 hex digits, upper-case hex, an unknown algorithm, `sha512` with 128 digits → refused, refused, refused, refused `UNSUPPORTED`, accepted." },
  { id = "T-RQ1.1.5", text = "[hostile] Fuzz each parser with arbitrary bytes, invalid UTF-8 and inputs longer than any bound the parser has → no panic, no hang, memory within the bound." },
  { id = "T-RQ1.1.6", text = "[model] Generated strings through the parser and the reference → the same verdict on each." },
  { id = "T-RQ1.1.7", text = "[edge] Save a digest's state after each block of generated inputs, resume, finish → equals the one-shot digest every time; a state taken mid-block is refused." },
  { id = "T-RQ1.1.8", text = "[refusal] A manifest of media type `application/vnd.docker.distribution.manifest.v1+json` or `…v1+prettyjws` → refused `MANIFEST_INVALID`, saying schema 1 is not taken." },
]

[[own]]
id = "RQ1.2"
phase = "RQ1"
title = "The records and their transactions"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2", "AC-T9.7.4"]
needs = ["RQ0"]
criteria = [
  { id = "AC-RQ1.2.1", text = "`docs/design/records.md` lists each family, its key, its value and the transactions that write it, and a doc-truth test checks the list against the code." },
  { id = "AC-RQ1.2.2", text = "The invariants hold after every transaction and after a crash between any two: a tag names a manifest that exists; a manifest's every reference has a row; a link names a live blob; a live blob's bytes exist; a readable blob has a link in that repository." },
  { id = "AC-RQ1.2.3", text = "The TLA+ model has the operations push blob, mount, push manifest, move tag, delete tag, delete manifest, delete blob and collect, and TLC finds no reachable state that breaks an invariant." },
  { id = "AC-RQ1.2.4", text = "A manifest with more references than one transaction's conditions hold is committed in stages, and a reader never sees it before its last stage." },
  { id = "AC-RQ1.2.5", text = "Every write that can meet `Conflict`, `Timeout` or `UnknownOutcome` has a stated answer for each: retry on a fresh read within a counted budget, refuse, or reconcile." },
  { id = "AC-RQ1.2.6", text = "A row's value fits Amphora's bound for a value by construction; what cannot (a large manifest's bytes) is kept in Mantle and named by the row." },
]
tests = [
  { id = "T-RQ1.2.1", text = "[model] TLC on the model with two repositories, two clients and a collector → no invariant broken; with a planted missing condition → a trace that breaks one." },
  { id = "T-RQ1.2.2", text = "[crash] In simulation, cut power between every pair of transactions of every operation → invariants hold after restart, and an unfinished operation is either absent or finishable." },
  { id = "T-RQ1.2.3", text = "[race] Two pushes of one manifest digest at once → one row, both answered `201`." },
  { id = "T-RQ1.2.4", text = "[race] A manifest pushed while one of its blobs is deleted → the push is refused `MANIFEST_BLOB_UNKNOWN`, or the delete is refused; never a manifest whose blob is gone." },
  { id = "T-RQ1.2.5", text = "[race] Two clients moving one tag to different manifests → the tag ends at one of them, and each client's answer agrees with a linearization." },
  { id = "T-RQ1.2.6", text = "[failure] A commit whose answer is lost → the operation is not applied twice, and the client's retry gets the first outcome." },
  { id = "T-RQ1.2.7", text = "[edge] A manifest referencing one more blob than a transaction holds → committed in stages; a concurrent GET sees `404` until it is whole, then `200`." },
  { id = "T-RQ1.2.8", text = "[livelock] Many clients in a conflict loop on one tag → each finishes within its counted budget or is refused typed; none retries without end." },
  { id = "T-RQ1.2.9", text = "[exhaustion] Amphora answers `Full` → the push is refused typed and leaves no partial rows." },
  { id = "T-RQ1.2.10", text = "[edge] An index that references itself by digest (impossible by hashing) and an index nested in an index → the first cannot be made; the second is accepted and its edges recorded." },
]

[[own]]
id = "RQ1.3"
phase = "RQ1"
title = "Blob uploads"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2"]
needs = ["RQ1.1", "RQ1.2"]
criteria = [
  { id = "AC-RQ1.3.1", text = "Each upload form in distribution spec v1.1.1, and the upload cancel and `digest-algorithm` forms on its `main`, answers with the status and headers the spec states." },
  { id = "AC-RQ1.3.2", text = "A chunk that does not start where the last ended is refused `416`, and the session's `GET` then reports the true offset." },
  { id = "AC-RQ1.3.3", text = "A closing digest that is not the content's is refused `DIGEST_INVALID`, the blob never becomes visible, and its staged bytes are freed." },
  { id = "AC-RQ1.3.4", text = "A session continues from its durable offset after the process restarts, with no byte before that offset sent again." },
  { id = "AC-RQ1.3.5", text = "The server's memory for one upload is bounded by one piece and the counted overhead, whatever the blob's size." },
  { id = "AC-RQ1.3.6", text = "Two uploads of the same content at once both succeed, and one copy is kept." },
  { id = "AC-RQ1.3.7", text = "A mount succeeds only where the caller may read the source repository; a mount without a source follows the stated policy and never reveals whether another tenant holds the blob." },
  { id = "AC-RQ1.3.8", text = "`OCI-Chunk-Min-Length`, when sent, is the least piece Mantle's upload plan takes, not a figure of Reliquary's." },
]
tests = [
  { id = "T-RQ1.3.1", text = "[happy] Push one blob by each form → each `201` with `Location` and `Docker-Content-Digest`; each blob then pulls back identical." },
  { id = "T-RQ1.3.2", text = "[edge] A zero-byte blob; a one-byte blob; a blob one byte under and over a Mantle block; a blob larger than memory → each stored and read back identical." },
  { id = "T-RQ1.3.3", text = "[refusal] A chunk out of order; a chunk overlapping the last; a final `PUT` whose `Content-Range` skips bytes → each `416`, session intact." },
  { id = "T-RQ1.3.4", text = "[refusal] A closing digest of the wrong content, of the wrong length, of an unknown algorithm, and malformed → `DIGEST_INVALID`, `DIGEST_INVALID`, `UNSUPPORTED`/`400`, `DIGEST_INVALID`." },
  { id = "T-RQ1.3.5", text = "[refusal] `PATCH`, `PUT`, `GET` and `DELETE` on an unknown, finished or cancelled session → `404` `BLOB_UPLOAD_UNKNOWN`." },
  { id = "T-RQ1.3.6", text = "[failure] Kill the server mid-chunk, restart, ask the session's status, resume → the blob completes; bytes sent equal the blob's length plus at most the unacknowledged run." },
  { id = "T-RQ1.3.7", text = "[failure] The client's connection drops mid-body → the session's offset is what was made durable, and a later `PATCH` from there succeeds." },
  { id = "T-RQ1.3.8", text = "[race] Two clients writing the same session at once → one chunk wins at each offset; the other is refused `416`; the blob's digest is right." },
  { id = "T-RQ1.3.9", text = "[race] Two sessions upload the same content and close at the same instant → both `201`; one copy of the bytes remains; both repositories can read it." },
  { id = "T-RQ1.3.10", text = "[race] A session cancelled while its last chunk is in flight → either cancelled with nothing visible, or completed; never a visible blob with a freed body." },
  { id = "T-RQ1.3.11", text = "[exhaustion] Open sessions until the staging budget is reached → the next is refused typed with what is held and by whom; after the least recently progressed is reclaimed, a new one opens." },
  { id = "T-RQ1.3.12", text = "[exhaustion] Mantle answers `Full` mid-upload → the chunk is refused typed, the session keeps its durable offset, and the upload completes once room returns." },
  { id = "T-RQ1.3.13", text = "[hostile] A body longer than its `Content-Length`; a shorter one; a `Content-Range` beyond 2⁶⁴; chunked encoding with a malformed chunk size → each refused, none corrupts the session." },
  { id = "T-RQ1.3.14", text = "[hostile] A client that sends one byte at long intervals → it holds one session's room and no thread; it is cut when its progress no longer keeps it alive by RQ0.8's rule." },
  { id = "T-RQ1.3.15", text = "[edge] A mount of a digest the source repository has; one it lacks; one from a repository the caller cannot read → `201`; `202` with a new session; `202` with a new session and no hint that it exists." },
  { id = "T-RQ1.3.16", text = "[deadlock] Many sessions closing while the staging budget is full and reclaim is running → every close completes or is refused; none waits on reclaim that waits on it." },
]

[[own]]
id = "RQ1.4"
phase = "RQ1"
title = "Blob reads"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2", "AC-T9.1.4"]
needs = ["RQ1.1", "RQ1.2"]
criteria = [
  { id = "AC-RQ1.4.1", text = "`GET` and `HEAD` answer `200` with `Content-Length`, `Docker-Content-Digest` and `Content-Type: application/octet-stream`, and `404` `BLOB_UNKNOWN` for a blob the repository does not link." },
  { id = "AC-RQ1.4.2", text = "A single byte range is answered `206` with the right `Content-Range`; an unsatisfiable one `416`; several ranges are answered as RFC 9110 allows and the answer is stated." },
  { id = "AC-RQ1.4.3", text = "`If-None-Match` with the blob's digest answers `304` with no body." },
  { id = "AC-RQ1.4.4", text = "The server's memory for one read is bounded by one piece, whatever the blob's size and however slowly the client reads." },
  { id = "AC-RQ1.4.5", text = "Every byte served was verified by Mantle on read; a blob Mantle cannot verify is refused, never served wrong." },
]
tests = [
  { id = "T-RQ1.4.1", text = "[happy] `GET` a blob whole and in every pair of adjacent ranges → the pieces joined equal the blob, and its digest matches." },
  { id = "T-RQ1.4.2", text = "[edge] Ranges `0-0`, the last byte, `-1` (suffix), past the end, and reversed bounds → `206`, `206`, `206`, `416`, `416` or whole per RFC 9110." },
  { id = "T-RQ1.4.3", text = "[refusal] A blob that exists in another repository only → `404`, in the same time as a blob that exists nowhere, within the measurement's interval." },
  { id = "T-RQ1.4.4", text = "[failure] The client closes mid-body → the read from Mantle stops, and nothing is left open." },
  { id = "T-RQ1.4.5", text = "[failure] Mantle refuses a chunk as damaged and cannot repair it → the response ends with an error, not with wrong or padded bytes, and the event names the blob." },
  { id = "T-RQ1.4.6", text = "[race] A blob deleted while a `GET` of it streams → the stream completes with the right bytes or ends in an error; a later `GET` is `404`." },
  { id = "T-RQ1.4.7", text = "[exhaustion] More slow readers than the read budget admits → the rest are refused `429` or `503` with `Retry-After`; admitted readers are not slowed past their interval." },
  { id = "T-RQ1.4.8", text = "[hostile] A client that opens a `GET` and never reads → its memory stays one piece, and it is cut when it shows no progress by RQ0.8's rule." },
]

[[own]]
id = "RQ1.5"
phase = "RQ1"
title = "Manifests, tags and referrers"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2"]
needs = ["RQ1.1", "RQ1.2"]
criteria = [
  { id = "AC-RQ1.5.1", text = "A manifest pushed by digest or tag is returned byte for byte, with the `Content-Type` it was pushed with and its digest in `Docker-Content-Digest`." },
  { id = "AC-RQ1.5.2", text = "A manifest that references something absent is refused `MANIFEST_BLOB_UNKNOWN` and names it; one with a missing `subject` alone is accepted." },
  { id = "AC-RQ1.5.3", text = "A manifest over the bound is refused `413`; the bound is derived, is at least 4 megabytes, and is in the constants register as derived." },
  { id = "AC-RQ1.5.4", text = "The referrers API never answers `404` for a valid digest, returns an empty index where there are none, sets `artifactType` by the spec's fallback rule, and pages with `Link` where the index would pass the manifest bound." },
  { id = "AC-RQ1.5.5", text = "Tag listings are in the spec's order, honor `n` and `last`, set `Link` when more remain, and cost time independent of the repository's total tags." },
  { id = "AC-RQ1.5.6", text = "Deleting a manifest by digest removes every tag on it and its referrer entries; deleting by tag removes that tag alone; each is `202`, then `404`." },
  { id = "AC-RQ1.5.7", text = "The `tag` query parameters on a push by digest create each tag and answer `OCI-Tag`, as the spec's `main` states." },
  { id = "AC-RQ1.5.8", text = "A media type Reliquary does not know is stored and served, never refused for being unknown; an unknown `artifactType` likewise." },
]
tests = [
  { id = "T-RQ1.5.1", text = "[happy] Push an image manifest, an index of two images, an index of indexes, and an artifact with the empty config → each `201`; each pulls back identical by tag and by digest." },
  { id = "T-RQ1.5.2", text = "[refusal] A body that is not JSON; JSON whose `mediaType` differs from `Content-Type`; a descriptor with no digest; a digest in the URL that is not the body's → `MANIFEST_INVALID` ×3, `DIGEST_INVALID`." },
  { id = "T-RQ1.5.3", text = "[refusal] A manifest whose config, one layer, or one index entry is absent → `MANIFEST_BLOB_UNKNOWN` naming the digest." },
  { id = "T-RQ1.5.4", text = "[edge] A manifest of exactly the bound, and one byte over → `201`, `413`." },
  { id = "T-RQ1.5.5", text = "[edge] A manifest with no layers; with one layer listed many times; with unknown extra fields; with a `data` field; with a nondistributable layer not pushed → accepted as the conformance suite's data settings expect." },
  { id = "T-RQ1.5.6", text = "[edge] A manifest pushed with a `subject` that does not exist, then the subject pushed → the referrers list holds it both before and after." },
  { id = "T-RQ1.5.7", text = "[edge] Referrers of a digest with none; with one; with more than fit one index; filtered by a type none has → empty index; one; pages by `Link`; empty with `OCI-Filters-Applied`." },
  { id = "T-RQ1.5.8", text = "[edge] Tag lists with `n=0`, `n` larger than the tags, `last` naming a tag that does not exist, and a repository with no tags → the spec's answers." },
  { id = "T-RQ1.5.9", text = "[race] A tag read while it moves → the old digest or the new, with that digest's manifest; never one's digest with the other's bytes." },
  { id = "T-RQ1.5.10", text = "[race] A manifest deleted while a tag is being put on it → the tag ends on a manifest that exists, or the put is refused; never a dangling tag." },
  { id = "T-RQ1.5.11", text = "[race] Two referrers pushed for one subject at once → both listed, neither lost." },
  { id = "T-RQ1.5.12", text = "[hostile] JSON nested deeper than the parser's flat budget; a megabyte string of escapes; duplicate keys; a manifest listing the same digest with two sizes → refused typed, in linear time, with no recursion." },
  { id = "T-RQ1.5.13", text = "[exhaustion] A listing of a repository with more tags than memory would hold at once → served page by page in bounded memory." },
  { id = "T-RQ1.5.14", text = "[happy] `GET` a manifest with `Accept` naming only another type → the stored manifest with its own `Content-Type`, and the decision is in the design record." },
]

[[own]]
id = "RQ1.6"
phase = "RQ1"
title = "The OCI door over HTTP/1.1 and TLS"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2"]
needs = ["RQ0"]
criteria = [
  { id = "AC-RQ1.6.1", text = "Every endpoint of the spec is routed, and any other path under `/v2/` answers the spec's `404` or `405` with a JSON error." },
  { id = "AC-RQ1.6.2", text = "A response's errors are `{\"errors\":[{\"code\",\"message\",\"detail\"}]}` with a code from the spec's table." },
  { id = "AC-RQ1.6.3", text = "A connection's memory is counted and bounded, idle or active; the count is pinned by a test." },
  { id = "AC-RQ1.6.4", text = "No request can hold a shard: a handler that would run past its turn yields, and a slow client's socket never blocks another connection." },
  { id = "AC-RQ1.6.5", text = "TLS is 1.3 with the certificate the operator states or one `reliquary init` makes; plain HTTP is served only on loopback unless stated." },
  { id = "AC-RQ1.6.6", text = "On a stop signal, requests in flight complete or are cut at the drain's end with a typed close, and the listener takes no new ones." },
  { id = "AC-RQ1.6.7", text = "`Warning` headers, when sent, follow the spec's form and its 4,096-byte bound." },
]
tests = [
  { id = "T-RQ1.6.1", text = "[happy] Each endpoint through a raw socket and through curl → the spec's status, headers and body." },
  { id = "T-RQ1.6.2", text = "[edge] `/v2`, `/v2/`, a name with the most components the grammar allows, a path that only looks like a route (`/v2/a/blobs/uploads/` as a repository named `a/blobs`) → routed as the grammar says." },
  { id = "T-RQ1.6.3", text = "[edge] `Expect: 100-continue` on an upload that will be refused → the refusal comes before any body is read." },
  { id = "T-RQ1.6.4", text = "[edge] Two requests pipelined on one connection; a request after a response with `Connection: close` → answered in order; the second refused by closing." },
  { id = "T-RQ1.6.5", text = "[hostile] The HTTP request-smuggling corpus: `Content-Length` with `Transfer-Encoding`, duplicate lengths, obsolete line folding, bare LF, a chunk extension flood → each refused `400` and the connection closed." },
  { id = "T-RQ1.6.6", text = "[hostile] A head sent one byte at a time; a head that never ends; more headers than the bound → cut by progress, refused by the bound, refused by the bound." },
  { id = "T-RQ1.6.7", text = "[hostile] TLS: a handshake that stalls after ClientHello; a downgrade to TLS 1.2; a client that renegotiates → cut by progress; refused; refused." },
  { id = "T-RQ1.6.8", text = "[exhaustion] Open connections until the memory budget is reached → further ones are refused at accept with nothing allocated per refusal; closing some admits new ones." },
  { id = "T-RQ1.6.9", text = "[deadlock] Every admitted connection uploading while every one's response is blocked on a full send buffer → each makes progress or is cut; the shard's loop never stops turning." },
  { id = "T-RQ1.6.10", text = "[failure] Stop the server during a large upload and a large download → the download finishes or is cut cleanly at the drain's end; the upload's session keeps its durable offset." },
  { id = "T-RQ1.6.11", text = "[happy] The same requests against the door on Linux, macOS and Windows → the same answers." },
]

[[own]]
id = "RQ1.7"
phase = "RQ1"
title = "Authentication and authorization"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.2"]
needs = ["RQ1.1"]
criteria = [
  { id = "AC-RQ1.7.1", text = "An unauthenticated request to a protected endpoint is answered `401` with `WWW-Authenticate: Bearer realm=…,service=…,scope=…` naming exactly the scope the request needs." },
  { id = "AC-RQ1.7.2", text = "The token endpoint grants only the intersection of the scopes asked and the principal's grants, and says which it granted." },
  { id = "AC-RQ1.7.3", text = "A request beyond its token's scopes is `403` `DENIED`; with an expired, malformed or wrongly signed token `401` `UNAUTHORIZED`." },
  { id = "AC-RQ1.7.4", text = "A token's lifetime is the operator's statement, or the token specification's 60-second default, and is never below that specification's 60-second floor." },
  { id = "AC-RQ1.7.5", text = "`docker login`, containerd, Podman, ORAS and crane each authenticate, push and pull with no client-side special case." },
  { id = "AC-RQ1.7.6", text = "Secrets (signing keys, passwords) are never logged, never in an error body, and held in memory that is wiped on drop." },
  { id = "AC-RQ1.7.7", text = "A password check costs the same time for a known and an unknown user, within the measurement's interval." },
]
tests = [
  { id = "T-RQ1.7.1", text = "[happy] `docker login`, then push and pull a private repository → succeeds; the same without login → `401` then the client's prompt." },
  { id = "T-RQ1.7.2", text = "[refusal] A pull token used to push; a token for repository A used on B; a token after its expiry; a token signed by another key; a token with `alg: none` → `403`, `403`, `401`, `401`, `401`." },
  { id = "T-RQ1.7.3", text = "[edge] A request needing two scopes (a mount: pull on the source, push on the target) → the challenge names both, and a token with one is refused." },
  { id = "T-RQ1.7.4", text = "[edge] A token that expires during a long upload → the chunk in flight completes; the next is `401`; after a new token the session continues from its offset." },
  { id = "T-RQ1.7.5", text = "[hostile] A token longer than the head's bound; a JWT with a nested JWT; a `kid` that is a file path; scopes repeated past the bound → refused in bounded time and memory." },
  { id = "T-RQ1.7.6", text = "[hostile] A run of wrong passwords for one user → each costs the full check; the limiter RQ4.3 adds later is not assumed here, and the test records the rate one core allows." },
  { id = "T-RQ1.7.7", text = "[race] A grant revoked while a token made under it is in use → the token works until it expires and no longer; a new token lacks the scope." },
  { id = "T-RQ1.7.8", text = "[exhaustion] The token endpoint asked faster than it signs → refused `429` with `Retry-After`; registry requests with valid tokens are unaffected." },
  { id = "T-RQ1.7.9", text = "[happy] Ask the catalog endpoint as each of two principals with different grants → each sees only the repositories it may pull." },
]

[[own]]
id = "RQ1.8"
phase = "RQ1"
title = "Records on Amphora and bytes on Mantle, inside the process"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.1"]
needs = ["RQ0.4"]
criteria = [
  { id = "AC-RQ1.8.1", text = "The real `Records` and `Bytes` pass the same conformance suites as their simulators, on each of the five targets." },
  { id = "AC-RQ1.8.2", text = "No push is acknowledged before its bytes and its rows are durable; a power cut after an acknowledgement loses nothing." },
  { id = "AC-RQ1.8.3", text = "Mantle's node has a shard to itself, and the registry's request shards are never blocked by its compaction or flushes." },
  { id = "AC-RQ1.8.4", text = "The request to Mantle's owner for the in-process entry point is recorded with its answer; the interim start is one module, named in the manifest's exception, and is deleted when the entry point lands." },
  { id = "AC-RQ1.8.5", text = "`Busy` and `Full` from Mantle, and `Full`, `Timeout` and `UnknownOutcome` from Amphora, each reach the client as a typed refusal with a derived `Retry-After` or are reconciled; none is retried in a loop." },
]
tests = [
  { id = "T-RQ1.8.1", text = "[happy] Run both seam suites against the real implementations → every clause passes." },
  { id = "T-RQ1.8.2", text = "[crash] `kill -9` the process at random points during pushes, many times, on APFS, ext4 and NTFS → after each restart every acknowledged blob and manifest is present and verifies; none is partial." },
  { id = "T-RQ1.8.3", text = "[failure] Fill the device until Mantle answers `Full` → pushes are refused typed; pulls keep working; after space is freed pushes resume without a restart." },
  { id = "T-RQ1.8.4", text = "[failure] Amphora's flush fails once → the store refuses what waits, the registry refuses writes typed and says why, and a restart recovers every acknowledged row." },
  { id = "T-RQ1.8.5", text = "[edge] A machine that sleeps mid-push and wakes → the push resumes or is refused typed; no wait is trusted across the sleep." },
  { id = "T-RQ1.8.6", text = "[exhaustion] Mantle's write queue answers `Busy` under a burst → the door answers `503` with a `Retry-After` derived from the queue's drain, and the burst completes without a retry storm." },
  { id = "T-RQ1.8.7", text = "[deadlock] Records and bytes each waiting on the other's flush under full load → the commit order is fixed (bytes, then rows), and no cycle of waits forms." },
]

[[own]]
id = "RQ1.9"
phase = "RQ1"
title = "The binary and what it is told"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.1"]
needs = ["RQ1.6", "RQ1.8"]
criteria = [
  { id = "AC-RQ1.9.1", text = "From an empty directory, `reliquary init` then `reliquary serve` gives a registry that takes a push, with no other file written by hand." },
  { id = "AC-RQ1.9.2", text = "The configuration has no field for a timeout, a retry count, a queue length, a cache size, a chunk size or a concurrency." },
  { id = "AC-RQ1.9.3", text = "`reliquary doctor` lists each stated, measured and derived value with its source, and each derived value matches the one the running node uses." },
  { id = "AC-RQ1.9.4", text = "A second `reliquary serve` on the same directory is refused, naming the holder." },
  { id = "AC-RQ1.9.5", text = "The node refuses to start, naming the class of work, when its memory allowance is below the floor that admits one unit of each class." },
  { id = "AC-RQ1.9.6", text = "The node is ready (its health endpoint says so) only after recovery completes, and says \"not ready\" with the reason before." },
  { id = "AC-RQ1.9.7", text = "The same binary, configuration and data directory work on each of the five targets." },
]
tests = [
  { id = "T-RQ1.9.1", text = "[happy] `init`, `serve`, push, stop, `serve`, pull → the image is identical." },
  { id = "T-RQ1.9.2", text = "[refusal] A configuration with an unknown key, a port in use, an unreadable certificate, or a data directory on a read-only device → one typed line each, exit status non-zero, nothing half-started." },
  { id = "T-RQ1.9.3", text = "[edge] Start under a cgroup memory limit, a Windows job limit and no limit → the derived budgets follow each." },
  { id = "T-RQ1.9.4", text = "[edge] Start with one core granted; with all cores → both serve; the derived shard count follows." },
  { id = "T-RQ1.9.5", text = "[exhaustion] A memory ceiling below the floor → refused at start with the class and the floor." },
  { id = "T-RQ1.9.6", text = "[failure] `kill -9` during startup recovery, then start again → recovery completes; nothing is recovered twice." },
  { id = "T-RQ1.9.7", text = "[race] Two `serve` processes started at the same instant on one directory → exactly one runs." },
  { id = "T-RQ1.9.8", text = "[happy] Run `reliquary --version` and `reliquary doctor` on a fresh directory → the name, version and commit; every value with its source, and none marked unknown without saying what would measure it." },
]

