  { id = "T-RQ3.9.2", text = "[happy] Push each artifact kind by Docker or ORAS, pull by `reliquary-client`, and the reverse → identical." },
  { id = "T-RQ3.9.3", text = "[race] A tag moved through one door while read through the other → every read is a value some linearization allows." },
