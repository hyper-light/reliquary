[package]
name = "reliquary-bench"
description = "reliquary bench: a measurement that states its intervals, compares two builds, gates instruction counts and finds change points (plan RQ0.7, docs/design/measurement.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# hyper-measure: each process's own account (CPU time, instructions where the OS counts them), the
# machine's load average, the open loop's Poisson schedule, the median and the order-statistic quantile
# intervals (vendor/MANIFEST.toml names it, with its -api exception). hyper-timing: the log-linear
# latency buckets a state's quantiles are read from in fixed room. serde and serde_json: the worker's
# lines and the records in bench/; toml: bench/gated.toml and bench/changes.toml.
[dependencies]
hyper-measure = "0.1"
hyper-timing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
