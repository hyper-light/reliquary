  { id = "AC-RQ3.9.1", text = "A history split at random across both doors matches the model on every operation." },
  { id = "AC-RQ3.9.2", text = "An artifact pushed through one door pulls identically through the other, for every kind." },
  { id = "AC-RQ3.9.3", text = "Every refusal of the core maps to exactly one OCI error code and one native refusal, in a table a doc-truth test holds to the code." },
