[env]
# aws-lc-sys (crates.io's 0.46.0, under the vendored aws-lc-rs) built as kiln and Mantle build it, so
# Reliquary links aws-lc-rs as kiln does (vendor/aws-lc-rs/UPSTREAM.md; kiln's .cargo/config.toml, by
# the person's word of 2026-11-03): no CPU jitter entropy, which costs a process 17.6 ms before its first
# random bytes, and AWS-LC built from its own source, never a system one found by OPENSSL_DIR or
# pkg-config.
AWS_LC_SYS_NO_JITTER_ENTROPY = "1"
AWS_LC_SYS_USE_SYSTEM = "0"
