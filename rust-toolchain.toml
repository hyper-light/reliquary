[toolchain]
# An exact version: the gates must mean the same on every machine and CI runner. The targets are
# Reliquary's five (CLAUDE.md §12), which the gates lint from any one host (scripts/gates.sh).
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
