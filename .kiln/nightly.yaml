# The nightly latency run (plan RQ0.7, AC-RQ0.7.6; bench/README.md): the branch's tip (main's, at
# night), built naming its commit, measured on a runner alone, open loop at the power point, its p99 from
# each operation's intended start; a point of record is fed to kiln's metrics ($KILN_METRICS, kiln's
# docs/ci.md W16-R07). Then the series kiln keeps of it, one per fingerprint, a point a night for up to a
# year, goes to the change-point detector, which reads each series alone and fails the run on a change
# for the worse that bench/changes.toml does not acknowledge, naming its commit range and the last commit
# of the history it read.
#
# Until RQ1 brings `reliquary_pull` (AC-T9.1.4), the bench measured is `judge`, the tool's own judgment:
# Reliquary code with no setting a person picks. The schedule is the slot the person books on kiln's
# bench calendar (CLAUDE.md, "Working here"); until then it runs by hand.
name: nightly
on:
  schedule: ["41 2 * * *"]
  manual: true
jobs:
  latency:
    name: nightly latency (judge, open loop at the power point, p99)
    # A night takes the bench host (the runner labelled `bench`) in its slot on kiln's bench calendar. A
    # run by hand has no slot, and the bench host runs production (CLAUDE.md, "Working here"), so it
    # takes a whole arm64 Mac runner instead; its points go to that fingerprint's series.
    runs-on: [baremetal, "${{ github.event_name == 'schedule' && 'bench' || 'macos' }}"]
    exclusive: true
    toolchain: rust
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    artifacts: ["records"]
    steps:
      - name: build the branch's tip, naming its commit
        run: BENCH_WORK="$RUNNER_TEMP/bench-build" bash scripts/bench-build.sh HEAD builds/b
      - name: measure, and feed a point of record to kiln's metrics
        run: |
          mkdir -p records
          builds/b/reliquary bench run judge --metric latency:p99 --load power \
            --machine "${KILN_AGENT:-bench}" --record records --metrics "$KILN_METRICS"

  changes:
    name: change points in the nightly series
    needs: [latency]
    # A Linux container on a runner with docker (kiln's runners offer no k8s), never adacachy.
    # `container:` puts the steps in it; `image:` alone ran them on the Mac's own shell (2026-11-21).
    runs-on: [baremetal]
    requires: ["arch == aarch64", "executors has docker"]
    container: docker.io/library/rust:1.99.1-trixie
    # The metrics API reads the repository's runs (kiln's docs/ci.md, `ci.metrics.repo`: runs.read).
    permissions: { actions: read }
    timeout-minutes: 60
    steps:
      - name: build the detector
        run: cargo build --release --locked -p reliquary --bin reliquary
      - name: read the series kiln keeps of this branch, and look for change points
        run: |
          repo=$(printf %s "$KILN_REPO" | sed 's#/#%2F#g')
          curl -fsS -G -H "Authorization: Bearer $KILN_TOKEN" \
            --data-urlencode "name=reliquary.bench.judge.latency_99_100" \
            --data-urlencode "branch=$KILN_BRANCH" --data-urlencode "days=365" \
            "$GITHUB_SERVER_URL/api/ci/repos/$repo/metrics" -o series.json
          target/release/reliquary bench changes series.json --acknowledged bench/changes.toml
