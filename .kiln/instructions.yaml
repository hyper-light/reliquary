# The gate on instruction counts (plan RQ0.7, AC-RQ0.7.6; bench/README.md): on every push to main and
# every pull request, the benches bench/gated.toml names are counted in the change (B) and its base (A),
# interleaved, by cachegrind, which counts every instruction a process runs with no hardware counter,
# so a pod needs no privilege for it (research/07 F17, F19, F24). A bench whose B rises, its interval
# separated above A's (or, where an arm cannot be judged, every unit of B above every unit of A), fails
# the leg unless a commit of the change carries `Bench-accepted: <bench>: <why>`; a bench the base does
# not run passes as new. The base's own `reliquary bench gate` judges, so a change to the judging cannot pass its own gate;
# a base with no gate yet leaves it to the change's. The record is kept as the leg's artifact.
name: instructions
on:
  push: { branches: [main] }
  pull_request: {}
  manual: true
concurrency: { group: "instructions-${{ branch }}", cancel-in-progress: true }
defaults: { run: { shell: bash } }
jobs:
  gate:
    name: instruction counts (bench/gated.toml, the change against its base)
    # A Linux container on a runner with docker: kiln's runners offer docker and host executors, and no
    # k8s; on arm64, where Valgrind runs as well (research/07 F21), so on a Mac's docker, never
    # adacachy, which runs production. `container:` puts the steps in it: `image:` alone only names the
    # image of a leg already in one, and on 2026-11-21 the steps ran on the Mac's own shell.
    runs-on: [baremetal]
    requires: ["arch == aarch64", "executors has docker"]
    container: docker.io/library/rust:1.99.1-trixie
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    artifacts: ["records"]
    # kiln's own checkout is the commit alone (`--depth=1`), and a later `git fetch` has no token:
    # the history the base is found in comes through kiln/checkout, the base's first for a pull request.
    checkout: false
    steps:
      - name: the base's history (a pull request's)
        if: github.event_name == 'pull_request'
        uses: kiln/checkout@v1
        with: { ref: "${{ github.event.pull_request.base.sha }}", fetch-depth: 0 }
      - name: the change, with its history
        uses: kiln/checkout@v1
        with: { fetch-depth: 0 }
      # The steps run as root over a workspace the runner's user owns, which git refuses until told.
      - name: valgrind, git and python3; git trusts the workspace
        run: |
          command -v valgrind >/dev/null && command -v git >/dev/null && command -v python3 >/dev/null || { apt-get update && apt-get install -y --no-install-recommends valgrind git python3; }
          git config --global --add safe.directory '*'
      - name: toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # A pull request is measured against where it leaves its base branch; a push against the commit
      # the branch held before it, so a push of several commits is gated whole (its parent when the
      # event names none, as a run by hand does). The two builds go to paths of one length:
      # cachegrind's counts move with a file name's length (research/07 F18).
      - name: build the base (A) and the change (B)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git merge-base HEAD "$BASE_SHA")
          else
            before=$(python3 -I -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("before",""))' 2>/dev/null || true)
            if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then base=$before; else base=$(git rev-parse HEAD~1); fi
          fi
          echo "$base" > base.txt
          export BENCH_WORK="$RUNNER_TEMP/bench-build"
          bash scripts/bench-build.sh "$base" builds/a
          bash scripts/bench-build.sh HEAD builds/b
      - name: the gate
        run: |
          base=$(cat base.txt)
          accept=()
          while IFS= read -r name; do
            [ -n "$name" ] && accept+=(--accept "$name")
          done < <(git log --format=%B "$base"..HEAD | sed -n 's/^Bench-accepted: *\([^:]*\):.*/\1/p')
          mkdir -p records "$RUNNER_TEMP/cachegrind"
          judge=builds/a/reliquary
          builds/a/reliquary bench list >/dev/null 2>&1 || judge=builds/b/reliquary
          "$judge" bench gate bench/gated.toml --a builds/a/reliquary --b builds/b/reliquary \
            --counter cachegrind --scratch "$RUNNER_TEMP/cachegrind" --record records "${accept[@]}"
