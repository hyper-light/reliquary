  { id = "T-RQ5.6.3", text = "[failure] Upstream answers `429` with `Retry-After`, `500`, or a truncated body → waited out as told, retried by RQ0.8's rule, refused whole; never a half-updated server." },
  { id = "T-RQ5.6.4", text = "[failure] Upstream's cursor is lost mid-follow (a restart) → the follow resumes from the last committed position and ends equal." },
  { id = "T-RQ5.6.5", text = "[hostile] Upstream serves a `server.json` that fails the schema, or claims a name in a locally held namespace → that record is refused and reported; the rest follow." },
  { id = "T-RQ5.6.6", text = "[race] A local publish of a name while the follow brings the same name → the local namespace rule decides; the result is the same whichever came first." },
]

