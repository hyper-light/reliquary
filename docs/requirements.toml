  { id = "T-RQ12.4.2", text = "[race] Three regions move the tag at once, with one partitioned until later → all three end the same." },
  { id = "T-RQ12.4.3", text = "[edge] Two moves with equal clocks → the fixed order of regions decides, the same everywhere." },
  { id = "T-RQ12.4.4", text = "[edge] A move and a delete of the tag at once → the stated rule; the same everywhere." },
  { id = "T-RQ12.4.5", text = "[hostile] One region's wall clock set a day ahead → its moves win only until the others' clocks pass what it stamped; it does not win a move made after its own." },
  { id = "T-RQ12.4.6", text = "[refusal] A homed repository's tag moved in a region cut off from the home → refused typed, saying where the home is." },
  { id = "T-RQ12.4.7", text = "[model] The register's model with generated concurrent moves → convergence in every run." },
]

