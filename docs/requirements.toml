[[own]]
id = "RQ3.8"
phase = "RQ3"
title = "Hex's nodes get their images from Reliquary"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["CP-T7.8", "CP-T9.6"]
needs = ["RQ3.6"]
criteria = [
  { id = "AC-RQ3.8.1", text = "The seam's trait, its simulator and its conformance suite are agreed with Hex's owner and recorded in both projects." },
  { id = "AC-RQ3.8.2", text = "A box Hex starts from an image only Reliquary holds runs, on Linux, macOS and Windows, for the `oci`, `shards` and `shards-image` classes." },
  { id = "AC-RQ3.8.3", text = "Content shared by two artifacts is on the node's disk once." },
  { id = "AC-RQ3.8.4", text = "Nothing a running box uses is ever dropped; under pressure the store drops unused content by re-fetch cost, and refuses typed when nothing can be dropped." },
  { id = "AC-RQ3.8.5", text = "\"Bytes to bring this artifact to this node\" answers from the holdings report, and equals what a pull then transfers, within one piece." },
  { id = "AC-RQ3.8.6", text = "An artifact revoked by policy reaches every node that holds it as an event; a node that missed events reconciles on reconnect." },
  { id = "AC-RQ3.8.7", text = "The store survives the node agent's crash: after restart it holds exactly what it verified, and nothing half-fetched is usable." },
]
tests = [
  { id = "T-RQ3.8.1", text = "[happy] Hex starts an `oci` box, a Shards image VM and a Firecracker VM from Reliquary by digest → each runs." },
  { id = "T-RQ3.8.2", text = "[edge] Two images sharing a base → the base's layers are fetched once and stored once." },
  { id = "T-RQ3.8.3", text = "[race] Two boxes ask for one image at once → one fetch; both start." },
  { id = "T-RQ3.8.4", text = "[race] The store is dropping an image as a box asks for it → the box gets it (the drop yields) or it is fetched again; never a box on a half-removed image." },
  { id = "T-RQ3.8.5", text = "[exhaustion] The disk fills during a fetch → the fetch is refused typed; unused content is dropped by cost; a retry succeeds if room was made; running boxes are untouched." },
  { id = "T-RQ3.8.6", text = "[failure] Kill the node agent mid-fetch, restart → the fetch resumes from its verified prefix; boxes started before still run." },
  { id = "T-RQ3.8.7", text = "[failure] Reliquary is unreachable → boxes whose images the node holds still start; others are refused typed, naming the image." },
  { id = "T-RQ3.8.8", text = "[hostile] A file in the store altered on disk → detected on its next verification, refetched, and never handed to a box." },
  { id = "T-RQ3.8.9", text = "[happy] Ask the cost of bringing an image to a node that holds some of its layers, then pull it there → the bytes moved equal the cost answered." },
  { id = "T-RQ3.8.10", text = "[model] Hex's seam suite against Hex's simulator and against Reliquary → the same clauses pass." },
]

