# Reliquary's requirement registry: the goals of track T9 of kiln's critical path (kiln plan
# 01a157fe104d7444a38c808b89f2fae0), each acceptance criterion (AC-T9.n.k) and test (T-T9.n.k) with its ID,
# from the plan's version below on 2026-10-20. Code comments, commits, tests and benchmarks cite these IDs;
# kiln's citation gate (CP-T6.6) reads them from kiln's vendored copy. Reliquary's own IDs join them as
# its design names them.

plan = "01a157fe104d7444a38c808b89f2fae0"
plan_version = 1
track = "CP-T9"

[[goal]]
id = "CP-T9.1"
title = "Reliquary set up from kiln's registry; Shards' artifacts checked"
criteria = [
  { id = "AC-T9.1.1", text = "Usable now: shards push, shards pull and AGENT … FROM work against kiln's registry with every artifact checked, in a change request that passes the gate; Reliquary's repository has its CLAUDE.md, STATUS.md and gate" },
  { id = "AC-T9.1.2", text = "OCI distribution-spec conformance tests passed (pull, push, discovery, management) is exactly 100%, measured by the spec's conformance suite" },
  { id = "AC-T9.1.3", text = "§12.17's refusal cases accepted on push is exactly 0, measured by a test of every refusal case" },
  { id = "AC-T9.1.4", text = "1 MiB blob GET p99 on a LAN is at most 10 ms, measured by bench reliquary_pull" },
]
tests = [
  { id = "T-T9.1.1", text = "Everything kiln's registry served before the move — passes when it is served identically after it, by digest" },
]

[[goal]]
id = "CP-T9.2"
title = "Skills and MCP servers, first-class"
criteria = [
  { id = "AC-T9.2.1", text = "Usable now: kiln's agents get their skills and MCP servers from Reliquary, in a change request that passes the gate" },
  { id = "AC-T9.2.2", text = "An MCP client discovers Reliquary's servers through the MCP Registry API, checked against the official server.json schema" },
  { id = "AC-T9.2.3", text = "invalid skills accepted on publish, over a corpus of real and mutated skills is exactly 0, measured by the publish checks" },
]
tests = [
  { id = "T-T9.2.1", text = "A skill published from git at a ref — passes when it pulls back byte for byte, with its version and digest" },
]

[[goal]]
id = "CP-T9.3"
title = "The catalog and search"
criteria = [
  { id = "AC-T9.3.1", text = "Usable now: people and agents find agents, skills, MCP servers and images by search through the API, in a change request that passes the gate" },
  { id = "AC-T9.3.2", text = "search p99 over 100,000 artifacts is at most 50 ms, measured by bench reliquary_search" },
  { id = "AC-T9.3.3", text = "artifacts missing from search 1 s after publish is exactly 0, measured by a test publishing and searching" },
]
tests = [
  { id = "T-T9.3.1", text = "An artifact's asks — passes when they show as its config states them, for each platform" },
]

[[goal]]
id = "CP-T9.4"
title = "Trust: signatures, TUF, policies at pull, provenance"
criteria = [
  { id = "AC-T9.4.1", text = "Usable now: kiln refuses to launch an Agentfile whose agent or harness isn't signed by an allowed key, in a change request that passes the gate" },
  { id = "AC-T9.4.2", text = "unsigned, wrongly signed or stale artifacts accepted where policy forbids them is exactly 0, measured by a test of planted cases" },
  { id = "AC-T9.4.3", text = "kiln-built artifacts without provenance is exactly 0, measured by a check over the registry" },
]
tests = [
  { id = "T-T9.4.1", text = "A rollback attack with old TUF metadata — passes when it is refused" },
]

[[goal]]
id = "CP-T9.5"
title = "Pull-through caches and mirrors"
criteria = [
  { id = "AC-T9.5.1", text = "Usable now: every runner pulls through Reliquary at LAN speed and CI never hits an upstream rate limit, in a change request that passes the gate" },
  { id = "AC-T9.5.2", text = "upstream rate-limit failures in CI over a week is exactly 0, measured by CI's records" },
  { id = "AC-T9.5.3", text = "cached pulls failed while an upstream is down is exactly 0, measured by an outage drill" },
]
tests = [
  { id = "T-T9.5.1", text = "An upstream tag moved — passes when the cache serves the new digest within its freshness window and never mixes the two" },
]

[[goal]]
id = "CP-T9.6"
title = "Fast distribution: P2P, lazy loading, images ready to boot"
criteria = [
  { id = "AC-T9.6.1", text = "Usable now: CI legs and agent VMs start before their image is fully downloaded, in a change request that passes the gate" },
  { id = "AC-T9.6.2", text = "time to a 2 GB image's workload running, lazy against a full pull falls by at least 70% compared with a full pull, measured by bench image_start on fedora" },
  { id = "AC-T9.6.3", text = "origin bytes sent for one image pulled by 100 runners, in image sizes is at most 3, measured by a P2P lab with simulated runners" },
]
tests = [
  { id = "T-T9.6.1", text = "A peer serving corrupted chunks — passes when it is caught by digest and dropped, and the pull completes" },
]

[[goal]]
id = "CP-T9.7"
title = "On Mantle's cluster: garbage collection, quotas, retention"
criteria = [
  { id = "AC-T9.7.1", text = "Usable now: kiln's registry survives the loss of a disk or a machine, in a change request that passes the gate" },
  { id = "AC-T9.7.2", text = "blobs lost when a storage node's disk is wiped is exactly 0, measured by the Mantle lab" },
  { id = "AC-T9.7.3", text = "pushes or pulls failed during garbage collection under load is exactly 0, measured by a GC drill" },
  { id = "AC-T9.7.4", text = "referenced blobs collected is exactly 0, measured by a property test of generated histories" },
]
tests = [
  { id = "T-T9.7.1", text = "A push racing a collection of its blobs — passes when the push completes and its blobs stay" },
]

[[goal]]
id = "CP-T9.8"
title = "Kiln's own artifacts in Reliquary"
criteria = [
  { id = "AC-T9.8.1", text = "Usable now: kiln hands out every artifact from one store, and runner upgrades download only what changed, in a change request that passes the gate" },
  { id = "AC-T9.8.2", text = "bytes a runner upgrade downloads, against the binary's size is at most 30%, measured by the upgrade lab over 10 consecutive releases" },
  { id = "AC-T9.8.3", text = "The CI cache and artifact services (GitHub's cache and artifact APIs) work unchanged on Reliquary" },
]
tests = [
  { id = "T-T9.8.1", text = "The blue/green upgrade lab (33 checks), unchanged in what it checks" },
]

[[goal]]
id = "CP-T9.9"
title = "Replication and regions"
criteria = [
  { id = "AC-T9.9.1", text = "Usable now: kiln's runners pull from their own region, in a change request that passes the gate" },
  { id = "AC-T9.9.2", text = "tag replication between regions, p99 is at most 1 s, measured by a simulated 3-region lab at 60 ms apart" },
  { id = "AC-T9.9.3", text = "pulls failed while one region is lost is exactly 0, measured by the region-loss drill" },
]
tests = [
  { id = "T-T9.9.1", text = "A tag moved in two regions at once — passes when it ends the same in both, by the stated rule" },
]

[[goal]]
id = "CP-T9.10"
title = "Reliquary on its own, and its bar"
criteria = [
  { id = "AC-T9.10.1", text = "Usable now: production kiln runs on Reliquary with its comparison published, and Reliquary installs on its own" },
  { id = "AC-T9.10.2", text = "pull p99 against CNCF Distribution's on the same hardware is at most 100%, measured by bench reliquary_compare" },
  { id = "AC-T9.10.3", text = "artifacts lost in the fire drills (node off, disk lost, partition, region lost) is exactly 0, measured by the drills' counts" },
]
tests = [
  { id = "T-T9.10.1", text = "A fresh machine to a working Reliquary from its README alone, by a fresh subagent" },
]

# Reliquary's own requirements, beside kiln's: the phased plan (docs/design/plan/, phases RQ0 to RQ13), from the
# person's direction of 2026-11-20. A phase is `RQn`, an item `RQn.m`, a criterion `AC-RQn.m.k` and a test
# `T-RQn.m.k`, beside kiln's `CP-T9.n`, `AC-T9.n.k` and `T-T9.n.k`. `serves` names the kiln IDs an item serves;
# a test's text is "[what it exercises] do X → expect Y". This block is generated from the plan's files.

[[phase]]
id = "RQ0"
title = "The ground"
goal = "Every later change is made under gates that hold the rules, against seams that have simulators, and judged by a measurement tool that states intervals."
file = "docs/design/plan/phase-00-ground.md"

[[phase]]
id = "RQ1"
title = "The slice"
goal = "One `reliquary` binary on one machine takes `docker push` and gives `docker pull`, passes the OCI conformance suite, and loses nothing it acknowledged when its power is cut."
file = "docs/design/plan/phase-01-slice.md"

[[phase]]
id = "RQ2"
title = "Artifacts, checked on push"
goal = "Reliquary knows what it is handed. An agent, a harness, an MCP server, a microVM, a Firecracker pair, a tar or a zip is checked by its own rules as it is pushed, and one that breaks them is refused before anyone can pull it. Kiln's registry moves here."
file = "docs/design/plan/phase-02-artifacts.md"

[[phase]]
id = "RQ3"
title = "The native door"
goal = "Shards, Hex and kiln push, pull and manage artifacts over hyper-quic: a pull is one exchange and a stream of bytes from Mantle, a push is two, and both resume where they stopped."
file = "docs/design/plan/phase-03-native-door.md"

[[phase]]
id = "RQ4"
title = "Speed on one node"
goal = "On the same hardware, class for class, Reliquary's latency, throughput and cost per operation are each ten times better than the best of CNCF Distribution, Zot, Harbor and the Rust registries, or sit at the hardware's measured limit where a competitor already does; and it says so with records anyone can run again."
file = "docs/design/plan/phase-04-speed.md"

[[phase]]
id = "RQ5"
title = "Skills and MCP servers"
goal = "A skill and an MCP server are first-class: published from where they are written, checked against the formats that define them, versioned, and found by the clients that use them. An MCP client discovers Reliquary's servers through the MCP Registry API, and kiln's agents take their skills and servers from Reliquary."
file = "docs/design/plan/phase-05-skills-mcp.md"

[[phase]]
id = "RQ6"
title = "The catalog and search"
goal = "People and agents find agents, skills, MCP servers, microVMs and images by what they are and what they say about themselves, within a second of their being published, and see for each its versions, platforms, what it asks for, who signed it and how often it is pulled."
file = "docs/design/plan/phase-06-catalog.md"

[[phase]]
id = "RQ7"
title = "Trust, identity and audit"
goal = "What Reliquary hands out can be held to a rule: who signed it, that it is the newest its name should give, that it has an SBOM and a provenance, that nothing known is wrong with it. An artifact a policy forbids is not served, and kiln refuses to launch an Agentfile whose agent or harness is not signed by an allowed key. Who pushed is known, with no stored secret wherever a workload can prove itself; every change has its audit record; and whoever must act on a change is told of it, with no event lost."
file = "docs/design/plan/phase-07-trust.md"

[[phase]]
id = "RQ8"
title = "Pull-through caches and mirrors"
goal = "Every runner pulls its images through Reliquary at LAN speed. CI never meets an upstream's rate limit, and a pull of anything Reliquary holds succeeds while its upstream is down."
file = "docs/design/plan/phase-08-pull-through.md"

[[phase]]
id = "RQ9"
title = "A cluster: many nodes, garbage collection, quotas, retention"
goal = "Reliquary runs as many nodes over Mantle's and Amphora's clusters. It reclaims what nothing references while pushes and pulls go on, never collects what is referenced, holds each namespace to its quota and its retention rules, and loses nothing when a disk or a machine is lost."
file = "docs/design/plan/phase-09-cluster.md"

[[phase]]
id = "RQ10"
title = "Fast distribution"
goal = "A CI leg or an agent's microVM starts before its image has finished downloading. A node fetches only the blocks it reads, verifies each one alone, shares identical blocks between images, gets them from its neighbors when they have them, and has ready the blocks it read last time."
file = "docs/design/plan/phase-10-fast-distribution.md"

[[phase]]
id = "RQ11"
title = "Kiln's own artifacts"
goal = "Kiln hands out everything it builds and keeps from Reliquary: runner binaries, CI caches and artifacts, its own images and Agentfile images. A runner's upgrade downloads only what changed."
file = "docs/design/plan/phase-11-kiln-artifacts.md"

[[phase]]
id = "RQ12"
title = "Regions"
goal = "Reliquary runs in several regions as one registry. A pull is served in the client's own region. A tag pushed in one region is visible in the others within a second. Losing a region loses no artifact and fails no pull of what was replicated."
file = "docs/design/plan/phase-12-regions.md"

[[phase]]
id = "RQ13"
title = "Scale, drills and the release"
goal = "Reliquary is shown to hold at the scale Hex runs and beyond, loses nothing in any fire drill, installs on its own from its README, runs production kiln, and publishes its comparison with every competitor for anyone to repeat."
file = "docs/design/plan/phase-13-scale-release.md"

[[own]]
id = "RQ0.1"
phase = "RQ0"
title = "Vendor the shared crates at kiln's revisions"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1"]
needs = []
criteria = [
  { id = "AC-RQ0.1.1", text = "`python3 scripts/vendor.py check` passes: each vendored tree is its upstream at its revision plus its recorded changes, byte for byte." },
  { id = "AC-RQ0.1.2", text = "Each vendored project's revision equals the one kiln's manifest names, checked by a test that reads both manifests." },
  { id = "AC-RQ0.1.3", text = "The workspace links one revision of each shared crate: a test fails the build when `cargo metadata` shows two." },
  { id = "AC-RQ0.1.4", text = "The workspace builds for `x86_64-unknown-linux-gnu`, `aarch64-unknown-linux-gnu`, `aarch64-apple-darwin`, `x86_64-pc-windows-msvc` and `aarch64-pc-windows-msvc`." },
  { id = "AC-RQ0.1.5", text = "Each exception to the `-api` rule is one line of `vendor/MANIFEST.toml` saying which crate, why, and what ends it." },
]
tests = [
  { id = "T-RQ0.1.1", text = "[happy] Re-vendor each project at its current revision → the tree is unchanged, by diff." },
  { id = "T-RQ0.1.2", text = "[refusal] Change one byte in a vendored file without recording it → `vendor.py check` fails and names the file." },
  { id = "T-RQ0.1.3", text = "[refusal] Point one project at a revision other than kiln's → the pin test fails and names both revisions." },
  { id = "T-RQ0.1.4", text = "[refusal] Add a dependency that pulls a second copy of `hyper-quic` → the one-revision test fails and names both paths." },
  { id = "T-RQ0.1.5", text = "[edge] A recorded change that conflicts with a new upstream revision → the re-vendor stops and names the file and the change." },
  { id = "T-RQ0.1.6", text = "[edge] Build each of the five targets from a clean checkout with no network after `cargo fetch` → each builds." },
]

[[own]]
id = "RQ0.2"
phase = "RQ0"
title = "Make the rule on numbers a gate"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1"]
needs = ["RQ0.1"]
criteria = [
  { id = "AC-RQ0.2.1", text = "The gate fails on each of: an unlisted number, a row naming no number, a row whose value is not the code's, and a `learned` or `derived` row whose basis names one machine's measurement or a point read off one curve." },
  { id = "AC-RQ0.2.2", text = "The open list is empty, and the gate refuses a non-empty one." },
  { id = "AC-RQ0.2.3", text = "Every `learned` row names what is measured, on what (path, device, peer, repository or workload class), where it is kept, and how it follows a change." },
  { id = "AC-RQ0.2.4", text = "Every `derived` row names its model and its inputs, and a unit test computes the value from them." },
  { id = "AC-RQ0.2.5", text = "`docs/design/numbers.md` lists what an operator states, what a node measures and what it derives, and a doc-truth test checks each list against the configuration type and the code." },
]
tests = [
  { id = "T-RQ0.2.1", text = "[refusal] Add `const RETRIES: u32 = 3;` with no row → the gate fails and names the file and key." },
  { id = "T-RQ0.2.2", text = "[refusal] Add a row whose kind is `picked` → the gate fails." },
  { id = "T-RQ0.2.3", text = "[refusal] Add a `derived` row whose basis reads \"measured on fedora\" → the gate fails with \"one machine's measurement\"." },
  { id = "T-RQ0.2.4", text = "[refusal] Change a listed constant's value in code only → the gate fails and shows both values." },
  { id = "T-RQ0.2.5", text = "[edge] A literal passed as a duration or capacity argument (`Duration::from_millis(500)`, `with_capacity(64)`) → found and held to a row like a named constant." },
  { id = "T-RQ0.2.6", text = "[edge] Zero as an empty count, and one as a first value or a `max(1)` floor → accepted without rows, as Mantle's checker accepts them." },
  { id = "T-RQ0.2.7", text = "[happy] The checker's own tests run it on a fixture tree with one of each violation → each is reported once, by name." },
]

[[own]]
id = "RQ0.3"
phase = "RQ0"
title = "Structural gates and the platform matrix"
source = "docs/design/plan/phase-00-ground.md"
serves = ["CP-T9.1"]
needs = ["RQ0.1"]
criteria = [
  { id = "AC-RQ0.3.1", text = "`bash scripts/gates.sh` runs, in order: contracts, fmt, clippy for five targets, the production check, recursion, deny, tests, and the vendor check, and stops at the first failure." },
  { id = "AC-RQ0.3.2", text = "The test suite runs on Linux x86_64 and arm64, macOS arm64, and Windows x86_64 and arm64 on every change; a target with no runner is named in STATUS.md with what would close it." },
  { id = "AC-RQ0.3.3", text = "A call-graph cycle anywhere in production code fails the gate, named." },
  { id = "AC-RQ0.3.4", text = "Every `#[test]` cites an `AC-…` or `T-…` ID that the registry holds; an unknown or missing ID fails the gate." },
  { id = "AC-RQ0.3.5", text = "Every skipped test appears in the skip record printed after the suite, pass or fail." },
  { id = "AC-RQ0.3.6", text = "The proposed Gates lines are recorded as approved by the person, with the date, before CLAUDE.md changes." },
  { id = "AC-RQ0.3.7", text = "On Linux the suite also runs in containers of each major distribution family (Debian, Red Hat, SUSE, Arch, and Alpine with musl), on both architectures; a family that fails is named, never skipped in silence." },
]
tests = [
