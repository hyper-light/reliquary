[[own]]
id = "RQ11.1"
phase = "RQ11"
title = "An upgrade that downloads only what changed"
source = "docs/design/plan/phase-11-kiln-artifacts.md"
serves = ["AC-T9.8.2"]
needs = ["RQ10.1", "RQ10.3"]
criteria = [
  { id = "AC-RQ11.1.1", text = "Bytes a runner upgrade downloads, against the binary's size, is at most 30%, measured by the upgrade lab over 10 consecutive releases (AC-T9.8.2), for each target kiln ships." },
  { id = "AC-RQ11.1.2", text = "The A|B record lists each method's bytes downloaded, publisher cost and client cost over those releases, and names the method kept." },
  { id = "AC-RQ11.1.3", text = "The binary a runner ends with is byte-identical to the published one, and its signature verifies, whatever build it started from." },
  { id = "AC-RQ11.1.4", text = "A runner on a build with no cheap path (too old, or unknown) gets the whole binary, with no error." },
  { id = "AC-RQ11.1.5", text = "The client's memory and time to apply an upgrade are recorded per target and bounded by a budget derived from the runner's allowance." },
  { id = "AC-RQ11.1.6", text = "No chunk size, patch window or \"how many versions back\" is fixed in code; each comes from the measurement or the release's own history." },
]
tests = [
  { id = "T-RQ11.1.1", text = "[happy] Upgrade through ten consecutive releases on each target → each download at most 30% of its binary; each result verifies." },
  { id = "T-RQ11.1.2", text = "[edge] Upgrade from two, five and twenty releases back; from a build of another branch; from a corrupted local binary → cheapest valid path; whole download; whole download." },
  { id = "T-RQ11.1.3", text = "[failure] The download is cut at points across it → resumed; the result verifies; no verified byte fetched twice." },
  { id = "T-RQ11.1.4", text = "[hostile] A delta that applies to a binary other than the stated one; a delta whose result has the wrong digest → refused before use; the whole binary is fetched." },
  { id = "T-RQ11.1.5", text = "[crash] Kill the runner while it applies an upgrade → the old binary is intact; the retry completes." },
  { id = "T-RQ11.1.6", text = "[exhaustion] A runner with little memory or disk → the method within its budget is used, or the whole download; never a failed upgrade for lack of room that a smaller method would fit." },
  { id = "T-RQ11.1.7", text = "[race] A release is published while a runner is mid-upgrade to the previous one → it finishes that upgrade; the next takes it to the newest." },
]

