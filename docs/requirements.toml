[[own]]
id = "RQ3.1"
phase = "RQ3"
title = "The protocol"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["AC-T9.1.1"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ3.1.1", text = "Every operation of the registry core has a request, a reply and its refusals in the wire crate, and a doc-truth test holds `docs/design/native-protocol.md` to it." },
  { id = "AC-RQ3.1.2", text = "Every message has a golden vector; a change to any encoded byte fails a test." },
  { id = "AC-RQ3.1.3", text = "A new message or field is appended; an existing one's encoding never changes, checked against the vectors of every released version." },
  { id = "AC-RQ3.1.4", text = "Two ends of different versions either interoperate on the messages both know or refuse at the hello, naming both versions; never a misparse." },
  { id = "AC-RQ3.1.5", text = "Every length in a message is bounded by the wire's own field widths or a budget its receiver derives; a longer one is refused before it is read." },
]
tests = [
  { id = "T-RQ3.1.1", text = "[happy] Encode and decode every message → round-trips; equals its golden vector." },
  { id = "T-RQ3.1.2", text = "[hostile] Fuzz the decoder with truncated, extended and bit-flipped messages → typed refusal or a clean decode; no panic, no allocation past the bound." },
  { id = "T-RQ3.1.3", text = "[edge] A message with every optional field absent, and with every one at its longest → decodes." },
  { id = "T-RQ3.1.4", text = "[refusal] An unknown message kind; a known kind on the wrong lane; a reply with no request → refused typed, and the connection survives where the transport allows." },
  { id = "T-RQ3.1.5", text = "[happy] A version N client against a version N+1 server and the reverse → the common subset works; a call only the newer knows is refused as unsupported." },
  { id = "T-RQ3.1.6", text = "[model] The OCI door and the native door given the same generated history → the same answers, operation for operation." },
]

[[own]]
id = "RQ3.2"
phase = "RQ3"
title = "The listener, and who is calling"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["AC-T9.1.1"]
needs = ["RQ3.1"]
criteria = [
  { id = "AC-RQ3.2.1", text = "A connection that does not negotiate TLS 1.3 with AES-256-GCM, or presents no certificate under the authority, is refused in the handshake." },
  { id = "AC-RQ3.2.2", text = "`reliquary enroll` obtains a certificate by signing request; the private key is created on the client and never sent." },
  { id = "AC-RQ3.2.3", text = "A principal has the same rights through both doors: a request the OCI door refuses `DENIED` the native door refuses `Denied`, and the reverse." },
  { id = "AC-RQ3.2.4", text = "A revoked certificate is refused from the revocation's commit on, on every node, with no wait for a list to expire." },
  { id = "AC-RQ3.2.5", text = "A handshake that answers but does not advance gives up its place by its progress, not at a fixed time." },
  { id = "AC-RQ3.2.6", text = "The listener works on Linux, macOS and Windows, and a client on each reaches a server on each." },
]
tests = [
  { id = "T-RQ3.2.1", text = "[happy] Enroll a client, connect, call → answered; the node's link report names the peer, suite and group." },
  { id = "T-RQ3.2.2", text = "[refusal] A client offering only ChaCha20-Poly1305 or AES-128-GCM; a self-signed certificate; a certificate from another deployment; an expired one → each refused in the handshake." },
  { id = "T-RQ3.2.3", text = "[refusal] A signing request for a name the enrolling principal may not take → refused, nothing issued." },
  { id = "T-RQ3.2.4", text = "[race] A certificate revoked while its connection is mid-push → the exchange in flight ends as the stated rule says, and the next is refused." },
  { id = "T-RQ3.2.5", text = "[hostile] A flood of initial packets from spoofed addresses → answered with retry tokens; memory per unverified address is zero." },
  { id = "T-RQ3.2.6", text = "[hostile] A peer that opens lanes up to its grant and sends nothing → holds its grant and no more; cut by progress." },
  { id = "T-RQ3.2.7", text = "[failure] The client's address changes mid-transfer (Wi-Fi to wired) → the connection migrates and the transfer continues." },
  { id = "T-RQ3.2.8", text = "[exhaustion] More connections than the memory budget admits → refused at the handshake with a typed close; existing ones unaffected." },
]

[[own]]
id = "RQ3.3"
phase = "RQ3"
title = "A pull in one exchange"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["CP-T9.6", "AC-T9.1.4"]
needs = ["RQ3.1"]
criteria = [
  { id = "AC-RQ3.3.1", text = "Pulling an image of any number of layers takes one control exchange, measured by a counter on the lane." },
  { id = "AC-RQ3.3.2", text = "The bytes a client receives for each blob match its digest, checked before any of it is handed to the caller as complete." },
  { id = "AC-RQ3.3.3", text = "A pull interrupted at any byte resumes from its verified prefix and sends no verified byte again." },
  { id = "AC-RQ3.3.4", text = "A pull by tag is pinned: the plan names the digest the tag had, and every later fetch of that pull uses the digest." },
  { id = "AC-RQ3.3.5", text = "A reference the principal may not read, and one that does not exist, are answered alike in content and, within the measurement's interval, in time." },
  { id = "AC-RQ3.3.6", text = "The plan's size is bounded; a closure too large for one reply is paged, and the client still makes no per-layer control request." },
]
tests = [
  { id = "T-RQ3.3.1", text = "[happy] Pull a multi-platform image by tag → one exchange; the right platform's layers; every digest verifies." },
  { id = "T-RQ3.3.2", text = "[edge] An image with no layers; with one layer listed twice; with more layers than one reply holds; an index nested in an index → pulled correctly." },
  { id = "T-RQ3.3.3", text = "[edge] The client says it holds every layer → the plan grants nothing and the pull moves no blob bytes." },
  { id = "T-RQ3.3.4", text = "[refusal] A platform the index lacks → refused typed, listing the platforms it has." },
  { id = "T-RQ3.3.5", text = "[race] The tag moves between the plan and the last fetch → the pull completes with the planned digest's content." },
  { id = "T-RQ3.3.6", text = "[race] A layer is deleted between the plan and its fetch → that fetch is refused typed; the client's pull fails naming the layer; nothing partial is kept as complete." },
  { id = "T-RQ3.3.7", text = "[failure] The connection is cut at a random byte, many times → each resume continues from the verified prefix; total bytes received equal the image's size plus at most one unverified piece per cut." },
  { id = "T-RQ3.3.8", text = "[hostile] A server (simulated) that sends a wrong byte in a layer → the client refuses the layer at the piece that fails, and keeps nothing of it as verified." },
  { id = "T-RQ3.3.9", text = "[exhaustion] A client pulling more at once than its memory budget allows → its own admission holds transfers back; none is dropped, and peak memory stays within the budget." },
]

[[own]]
id = "RQ3.4"
phase = "RQ3"
title = "A push in two exchanges"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["AC-T9.1.1"]
needs = ["RQ3.1"]
criteria = [
  { id = "AC-RQ3.4.1", text = "Pushing an image of any number of layers takes two control exchanges and the uploads, measured by a counter." },
  { id = "AC-RQ3.4.2", text = "A blob the repository already links is never sent; one another repository holds is linked only where the principal may read it there." },
  { id = "AC-RQ3.4.3", text = "The commit is atomic: after it, every manifest, tag and referrer of the push is visible; before it, or if it is refused, none is." },
  { id = "AC-RQ3.4.4", text = "An upload interrupted at any byte resumes from the server's durable offset, on any node." },
  { id = "AC-RQ3.4.5", text = "A commit asked again after its answer was lost returns the first answer and changes nothing." },
  { id = "AC-RQ3.4.6", text = "Content checks that RQ2 defines run during the upload where the offer names the type, and a failing layer ends the push before its commit." },
  { id = "AC-RQ3.4.7", text = "What an offer reserves (sessions, staged bytes) is charged to the principal and freed if no commit comes, by RQ1.3's rule." },
]
tests = [
  { id = "T-RQ3.4.1", text = "[happy] Push an image, then push it again → the first sends its blobs; the second sends none; both commit." },
  { id = "T-RQ3.4.2", text = "[happy] Push an index, its two images and a signature for each in one commit → all visible together." },
  { id = "T-RQ3.4.3", text = "[refusal] A commit naming a blob never uploaded; a manifest RQ2 refuses; a tag the repository holds immutable → the whole commit refused, naming the cause; nothing visible." },
  { id = "T-RQ3.4.4", text = "[failure] Kill the client after the uploads and before the commit, then run it again → no blob is sent again; the commit succeeds." },
  { id = "T-RQ3.4.5", text = "[failure] Lose the commit's answer → the retry returns the same result; the tag moved once." },
  { id = "T-RQ3.4.6", text = "[race] Two clients push different manifests to one tag at once → one tag value results; each client's answer says which won." },
  { id = "T-RQ3.4.7", text = "[race] Two clients push the same new blob at once → both succeed; one copy is kept." },
  { id = "T-RQ3.4.8", text = "[hostile] A blob whose bytes do not match the offered digest; one longer or shorter than offered → refused at its end; the push's commit refuses." },
  { id = "T-RQ3.4.9", text = "[exhaustion] An offer for more staged bytes than the principal's quota → refused at the offer, before any byte is sent, saying what remains." },
  { id = "T-RQ3.4.10", text = "[livelock] Two clients each waiting to commit on a blob the other is uploading → each commit proceeds when its own blobs are present; neither waits on the other." },
]

[[own]]
id = "RQ3.5"
phase = "RQ3"
title = "Bytes straight between the client and Mantle"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["CP-T9.6", "AC-T9.1.4"]
needs = ["RQ3.1"]
criteria = [
  { id = "AC-RQ3.5.1", text = "The request to Mantle's owner, the grant's shape and Mantle's answer are in the design record." },
  { id = "AC-RQ3.5.2", text = "Through either path, the bytes a client gets are the same, verified against the blob's digest." },
  { id = "AC-RQ3.5.3", text = "A grant lets its holder read or write exactly the named object, by the named method, of the named length, until its expiry; anything else is refused by Mantle." },
  { id = "AC-RQ3.5.4", text = "A grant's life is derived from the transfer it is for (its bytes over the path's learned rate, renewed while the transfer shows progress), never a fixed duration." },
  { id = "AC-RQ3.5.5", text = "With the relay path, Reliquary's memory per transfer is one piece and the counted overhead." },
  { id = "AC-RQ3.5.6", text = "An A|B record compares the relay and the direct path on the same hardware, and the default follows the record." },
]
tests = [
  { id = "T-RQ3.5.1", text = "[happy] Pull and push the same blob by the relay and by the direct path → identical bytes and digests." },
  { id = "T-RQ3.5.2", text = "[refusal] Use a read grant to write; use it on another key; use it after expiry; change its length → each refused by Mantle's door." },
  { id = "T-RQ3.5.3", text = "[edge] A transfer slower than its grant's first life → the grant is renewed while bytes move, and the transfer completes." },
  { id = "T-RQ3.5.4", text = "[failure] The client cannot reach Mantle's nodes (a firewall) → it falls back to the relay with no error to the caller, and the event says which path it took." },
  { id = "T-RQ3.5.5", text = "[failure] A Mantle node dies mid-transfer → the client resumes at another node from the durable offset." },
  { id = "T-RQ3.5.6", text = "[hostile] A client that takes a write grant and uploads other bytes of the same length → the commit's digest check refuses the blob; the object is deleted." },
  { id = "T-RQ3.5.7", text = "[exhaustion] More relayed transfers than the node's stream credit → held by credit, none dropped, memory within budget." },
]

[[own]]
id = "RQ3.6"
phase = "RQ3"
title = "The client library and the command line"
source = "docs/design/plan/phase-03-native-door.md"
serves = ["AC-T9.1.1"]
needs = ["RQ3.2", "RQ3.3", "RQ3.4", "RQ3.5"]
criteria = [
  { id = "AC-RQ3.6.1", text = "The library's memory is its stated budget and does not grow with an artifact's size or layer count, shown by a counting-allocator test." },
  { id = "AC-RQ3.6.2", text = "A process killed at any journal write or protocol step resumes every open transfer, sends no committed byte again, and never commits a wrong artifact." },
  { id = "AC-RQ3.6.3", text = "A source file changed between attempts is a new push, never a resume into a wrong blob." },
  { id = "AC-RQ3.6.4", text = "The library carries no fixed timeout, retry count, part size or concurrency: each has a row in the constants register of an accepted kind." },
  { id = "AC-RQ3.6.5", text = "Every command prints the same lines through the OCI door and the native door." },
  { id = "AC-RQ3.6.6", text = "`reliquary-api`'s simulator passes the same client suite as a real server, so a consumer can test against it." },
]
tests = [
  { id = "T-RQ3.6.1", text = "[happy] Push and pull each artifact kind with the command line through each door → identical output and bytes." },
  { id = "T-RQ3.6.2", text = "[crash] Kill the client at every journal write and every protocol step of a push and a pull → run again; each completes; committed runs are not re-sent." },
  { id = "T-RQ3.6.3", text = "[edge] Pull to a file that exists; to a directory that is read-only; with the disk full → replaced atomically; refused typed; refused typed with the partial file removed or kept as the journal says." },
  { id = "T-RQ3.6.4", text = "[edge] The machine sleeps mid-transfer and wakes → the client reconciles with the server and continues; it trusts no local timer across the sleep." },
  { id = "T-RQ3.6.5", text = "[failure] The path's rate halves mid-transfer → concurrency follows; no transfer is cut while it progresses." },
  { id = "T-RQ3.6.6", text = "[race] Two processes of one user push to one tag → both journals end clean; one tag value." },
  { id = "T-RQ3.6.7", text = "[exhaustion] The journal reaches its bound of open transfers → the next is refused typed, naming the oldest open one." },
  { id = "T-RQ3.6.8", text = "[hostile] A journal file corrupted on disk → detected by its checksum, that transfer starts over, others resume." },
  { id = "T-RQ3.6.9", text = "[happy] The client suite against the simulator and against a real node → the same clauses pass." },
]

[[own]]
