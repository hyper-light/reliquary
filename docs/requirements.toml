  { id = "AC-RQ3.7.2", text = "Every Shards registry command gives the same result through the native door as through the OCI door against the same Reliquary, artifact for artifact and line for line." },
  { id = "AC-RQ3.7.3", text = "Against a registry with no native door (Docker Hub, GHCR), Shards behaves exactly as before." },
  { id = "AC-RQ3.7.4", text = "A build that takes an agent, a harness, an MCP server and a skill from Reliquary records each by digest in its provenance." },
  { id = "AC-RQ3.7.5", text = "Shards' learned waits and transfer shape for the path are kept as Shards keeps them; nothing fixed is added by this change." },
]
