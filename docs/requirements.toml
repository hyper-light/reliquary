[[own]]
id = "RQ12.2"
phase = "RQ12"
title = "Records between regions, within a second"
source = "docs/design/plan/phase-12-regions.md"
serves = ["AC-T9.9.2"]
needs = ["RQ12.1"]
criteria = [
  { id = "AC-RQ12.2.1", text = "Tag replication between regions, p99, is at most 1 s, measured by a simulated 3-region lab at 60 ms apart (AC-T9.9.2)." },
  { id = "AC-RQ12.2.2", text = "After the system is quiet, every region holding a repository has identical tags, manifests and referrers for it, compared row for row." },
  { id = "AC-RQ12.2.3", text = "A change is applied exactly once in each region under duplicated, reordered and replayed delivery." },
  { id = "AC-RQ12.2.4", text = "A region's lag is a metric, and a reader can ask a region to answer only once it has caught up to a point the reader names." },
  { id = "AC-RQ12.2.5", text = "Batching of changes on a link has no timer and no fixed size: what waited goes, as the link's credit allows." },
]
tests = [
  { id = "T-RQ12.2.1", text = "[perf] The 3-region lab at 60 ms: push tags in one region under load, measure visibility in the others → p99 at most 1 s, of record." },
  { id = "T-RQ12.2.2", text = "[failure] Cut one link for a long time, then heal → the region catches up; states equal." },
  { id = "T-RQ12.2.3", text = "[failure] A region is behind past the others' retained history → it rebuilds from a snapshot and says so; states equal." },
  { id = "T-RQ12.2.4", text = "[hostile] Deliver every change twice, out of order, and replay an old stream → states equal; nothing applied twice." },
  { id = "T-RQ12.2.5", text = "[race] A repository deleted in one region while pushed in another → the stated rule decides; all regions end the same." },
  { id = "T-RQ12.2.6", text = "[exhaustion] A burst of changes larger than a link can carry in a second → lag grows and is reported; nothing is dropped; lag returns to its usual level after." },
  { id = "T-RQ12.2.7", text = "[crash] Kill the replicator at every write → after restart it resumes from its durable position; states equal." },
  { id = "T-RQ12.2.8", text = "[livelock] Two regions each sending the other the change it just received from it → a change applied from a region is never sent back to it; the planted echo stops after one hop." },
]

[[own]]
id = "RQ12.3"
phase = "RQ12"
title = "Bytes between regions"
source = "docs/design/plan/phase-12-regions.md"
serves = ["AC-T9.9.1", "AC-T9.9.3"]
needs = ["RQ12.1", "RQ8.4"]
criteria = [
  { id = "AC-RQ12.3.1", text = "Under eager replication, a tag visible in a region is always pullable there in full with every other region unreachable." },
  { id = "AC-RQ12.3.2", text = "Under lazy replication, a first pull in a region completes with bytes fetched through, and the next is served locally." },
  { id = "AC-RQ12.3.3", text = "Bytes copied between regions for one blob wanted by many clients at once is the blob's size, plus resumes." },
  { id = "AC-RQ12.3.4", text = "A push that the rule says must be durable in more than one region is acknowledged only when it is." },
  { id = "AC-RQ12.3.5", text = "Inter-region transfer takes a share of the link the operator states or the node derives from what foreground traffic leaves; it has no fixed rate." },
]
tests = [
  { id = "T-RQ12.3.1", text = "[happy] Push in one region under eager replication → pullable in the others; cut every link → still pullable in each." },
  { id = "T-RQ12.3.2", text = "[happy] Push under lazy replication; pull from another region → served through; pull again → local." },
  { id = "T-RQ12.3.3", text = "[failure] The source region dies mid-copy → the tag is not yet visible in the destination; it appears when the copy completes from another region or after the source returns." },
  { id = "T-RQ12.3.4", text = "[race] Many clients in one region pull a blob it lacks → one fetch between regions." },
  { id = "T-RQ12.3.5", text = "[refusal] A push requiring two regions while only one is reachable → refused typed, or held, as the rule says; never acknowledged early." },
  { id = "T-RQ12.3.6", text = "[hostile] A region (simulated as compromised) sends bytes that do not match the digest → refused; nothing stored." },
]

[[own]]
id = "RQ12.4"
