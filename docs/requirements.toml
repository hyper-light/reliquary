[[own]]
id = "RQ5.2"
phase = "RQ5"
title = "Skills checked on publish"
source = "docs/design/plan/phase-05-skills-mcp.md"
serves = ["AC-T9.2.3"]
needs = ["RQ5.1", "RQ2.2"]
criteria = [
  { id = "AC-RQ5.2.1", text = "Invalid skills accepted on publish, over a corpus of real and mutated skills, is exactly 0 (AC-T9.2.3)." },
  { id = "AC-RQ5.2.2", text = "Valid skills refused, over the corpus's real skills, is exactly 0." },
  { id = "AC-RQ5.2.3", text = "On every skill of the corpus, Reliquary's verdict and message equal the reference validator's, recorded from the validator at a pinned commit." },
  { id = "AC-RQ5.2.4", text = "The corpus's mutations cover every rule: its counters show each rule refused at least one skill." },
  { id = "AC-RQ5.2.5", text = "Fields that Claude Code reads beyond the open format are kept and reported, and accepted or refused by a stated, per-namespace choice between the strict format and Claude Code's." },
]
tests = [
  { id = "T-RQ5.2.1", text = "[happy] Publish every real skill in the corpus → accepted." },
  { id = "T-RQ5.2.2", text = "[refusal] One mutation per rule: no `SKILL.md`; no frontmatter; a name with an upper-case letter, a leading hyphen, a double hyphen, 65 characters, or unlike its directory; an empty description; one of 1,025 characters; `compatibility` of 501; `metadata` with a non-string value; an unknown field → each refused with the validator's message." },
  { id = "T-RQ5.2.3", text = "[edge] A name of exactly 64 characters; a description of exactly 1,024; a name in a non-Latin lowercase script; a name that is equal only after Unicode normalization → as the validator decides, pinned." },
  { id = "T-RQ5.2.4", text = "[hostile] Frontmatter with YAML anchors, aliases, tags, merge keys, flow style, duplicate keys, or a megabyte scalar → refused, in bounded time." },
  { id = "T-RQ5.2.5", text = "[hostile] A `SKILL.md` of invalid UTF-8; with a byte-order mark; with CRLF line ends; with only a first `---` → as the validator reads a file, pinned." },
  { id = "T-RQ5.2.6", text = "[model] The whole corpus through the reference validator and through Reliquary → equal verdicts." },
  { id = "T-RQ5.2.7", text = "[non-vacuity] Each rule's counter after the corpus run → above zero." },
]

[[own]]
id = "RQ5.3"
phase = "RQ5"
title = "Skills from git, a URL, a path or a registry"
source = "docs/design/plan/phase-05-skills-mcp.md"
serves = ["T-T9.2.1", "AC-T9.2.1"]
needs = ["RQ5.1", "RQ5.2"]
criteria = [
  { id = "AC-RQ5.3.1", text = "A skill published from git at a ref pulls back byte for byte, with its version and digest (T-T9.2.1)." },
  { id = "AC-RQ5.3.2", text = "The published config names the source URL and the exact commit, and the same commit publishes to the same digest from any machine." },
  { id = "AC-RQ5.3.3", text = "A repository holding several skills publishes each under its own name; one invalid skill fails its own publish and is reported, without publishing a part of it." },
  { id = "AC-RQ5.3.4", text = "Publishing a version that exists with other content is refused unless the repository allows tags to move; with the same content it succeeds and changes nothing." },
  { id = "AC-RQ5.3.5", text = "The server makes no outbound request on behalf of a publish." },
]
tests = [
  { id = "T-RQ5.3.1", text = "[happy] Publish a skill from a git tag, a branch and a commit; from a tarball URL; from a path; from another registry → each pulls back identical to its source tree." },
  { id = "T-RQ5.3.2", text = "[edge] A ref that moves between two publishes → two versions, each recording its own commit." },
  { id = "T-RQ5.3.3", text = "[edge] A git repository whose skill sits in a subdirectory; one with a submodule; one with large files by pointer → the first published; the others handled by a stated rule and refused typed where they cannot be read whole." },
  { id = "T-RQ5.3.4", text = "[refusal] A URL that answers `404`, redirects to another host, or serves a different body on each fetch → refused, naming what happened; the digest is of what was fetched once." },
  { id = "T-RQ5.3.5", text = "[failure] The network drops mid-fetch or mid-push → nothing is published; running again publishes once." },
  { id = "T-RQ5.3.6", text = "[race] Two publishers push version `1.2.0` of one skill with different content at once → one wins; the other is refused, naming the existing digest." },
  { id = "T-RQ5.3.7", text = "[hostile] A git repository with a path that escapes the checkout, a file named like a device, or a symlink to `/etc` → refused by the content rules before any push." },
]

[[own]]
id = "RQ5.4"
phase = "RQ5"
title = "MCP servers and their `server.json`"
source = "docs/design/plan/phase-05-skills-mcp.md"
serves = ["AC-T9.2.2"]
needs = ["RQ2.3"]
criteria = [
  { id = "AC-RQ5.4.1", text = "Every stored `server.json` validates against the official schema version it names; one that does not is refused with the schema's path and reason." },
  { id = "AC-RQ5.4.2", text = "A package reference into Reliquary that does not resolve, or whose digest or hash disagrees with the bytes, is refused; references elsewhere are recorded as unverified and say so." },
  { id = "AC-RQ5.4.3", text = "A publisher can publish only under a namespace it holds, proven by a DNS record for a domain namespace or by the identity provider for an account namespace; the proof is recorded." },
  { id = "AC-RQ5.4.4", text = "A version, once published, never changes content; its status can move between active, deprecated and deleted with a message." },
  { id = "AC-RQ5.4.5", text = "Publisher-provided `_meta` is returned exactly as published, or the publish is refused naming the key; nothing is silently dropped." },
]
tests = [
  { id = "T-RQ5.4.1", text = "[happy] Publish a server with an `oci` package held here, one with an `mcpb` bundle held here, one with a remote URL, and one with an npm package → each stored; the first two verified, the others marked unverified." },
  { id = "T-RQ5.4.2", text = "[refusal] A `server.json` missing `name`; with a version of `latest`; with a package of an unknown registry type; with a remote URL that is not https → refused with the schema's reason." },
  { id = "T-RQ5.4.3", text = "[refusal] An `oci` identifier naming a tag here whose digest differs from the stated one; an `mcpb` `fileSha256` that is not the file's → refused, naming both values." },
  { id = "T-RQ5.4.4", text = "[refusal] Publishing `com.example/x` without holding `example.com` → refused; nothing stored." },
  { id = "T-RQ5.4.5", text = "[edge] The same version published twice with identical content; with different content → unchanged and accepted; refused." },
  { id = "T-RQ5.4.6", text = "[edge] A name at the schema's length limit; a description at its limit; every optional field absent → accepted." },
  { id = "T-RQ5.4.7", text = "[race] Two publishers publish the first version of one name at once → one wins the name; the other is refused." },
  { id = "T-RQ5.4.8", text = "[race] The image an `oci` package points at is deleted after publish → the server's page marks the package unresolved; a policy can forbid the delete while a server references it." },
  { id = "T-RQ5.4.9", text = "[hostile] A `server.json` with deep nesting, megabyte strings or duplicate keys → refused in bounded time." },
]

[[own]]
id = "RQ5.5"
phase = "RQ5"
title = "The MCP Registry API"
source = "docs/design/plan/phase-05-skills-mcp.md"
serves = ["AC-T9.2.2"]
needs = ["RQ5.4"]
criteria = [
  { id = "AC-RQ5.5.1", text = "An MCP client discovers Reliquary's servers through the MCP Registry API, checked against the official `server.json` schema (AC-T9.2.2): every response validates against the pinned OpenAPI document." },
  { id = "AC-RQ5.5.2", text = "The official registry's own publisher tool and at least two independent MCP clients list, fetch and, where they publish, publish against Reliquary unchanged." },
  { id = "AC-RQ5.5.3", text = "Walking a listing by cursor while servers are published and deleted returns every server that existed throughout exactly once." },
  { id = "AC-RQ5.5.4", text = "`updated_since` returns every server whose record changed after that instant, deletions included." },
  { id = "AC-RQ5.5.5", text = "A reader sees only the servers its grants allow; a server it may not see is absent from lists and `404` by name, alike in time within the interval." },
  { id = "AC-RQ5.5.6", text = "A listing's cost does not grow with the number of servers stored, at the plan's three scale sizes." },
]
tests = [
  { id = "T-RQ5.5.1", text = "[happy] List, page to the end, fetch a version, fetch `latest` → each validates against the schema." },
  { id = "T-RQ5.5.2", text = "[edge] `limit` of 1, of the maximum, and above it; a cursor from another listing; an empty registry → the specified answers; a foreign cursor is refused `400`." },
  { id = "T-RQ5.5.3", text = "[edge] A server name with a slash and characters that need URL encoding → found by its encoded path." },
  { id = "T-RQ5.5.4", text = "[race] Page through a listing while another client publishes and deletes → nothing that existed throughout is skipped or repeated." },
  { id = "T-RQ5.5.5", text = "[refusal] Publish without a token; with a read-only token; to another's namespace → `401`, `403`, `403`." },
  { id = "T-RQ5.5.6", text = "[hostile] A cursor edited by the client; a `limit` beyond any integer the schema allows; an `updated_since` far in the past or the future → refused or clamped as the schema states; never a full scan." },
  { id = "T-RQ5.5.7", text = "[exhaustion] Many clients polling `updated_since` as fast as they can → served from the change feed's position, each poll's cost bounded by what changed." },
  { id = "T-RQ5.5.8", text = "[model] Generated publish, status and list histories against a model of the API → every answer matches." },
]

[[own]]
id = "RQ5.6"
