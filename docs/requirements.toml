[[own]]
id = "RQ4.1"
phase = "RQ4"
title = "Measure the competitors on our hardware"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.10.2", "CP-T9.10"]
needs = ["RQ0.7"]
criteria = [
  { id = "AC-RQ4.1.1", text = "Each competitor's version, digest, configuration and storage backend are in the record, and its own conformance run is recorded beside it." },
  { id = "AC-RQ4.1.2", text = "Every workload runs unchanged against any registry that speaks the distribution spec; a registry is named by URL alone." },
  { id = "AC-RQ4.1.3", text = "Each point is measured by RQ0.7's rules and is of record." },
  { id = "AC-RQ4.1.4", text = "Each registry is measured at its best: its recommended cache and storage settings, stated, and a second run with its defaults." },
  { id = "AC-RQ4.1.5", text = "The hardware's own limits are measured the same day: link bandwidth, the device's durable write bandwidth, and SHA-256 throughput on one core, so a result at a limit can be told from a result below it." },
  { id = "AC-RQ4.1.6", text = "The trace replay's source, its request mix and its size distribution are cited in `docs/research/`." },
]
tests = [
  { id = "T-RQ4.1.1", text = "[happy] Run the pull matrix against Distribution twice on a quiet machine → each point's two intervals overlap." },
  { id = "T-RQ4.1.2", text = "[edge] Run the workload against a registry that refuses deletes → the delete points are reported as unsupported, not as zero." },
  { id = "T-RQ4.1.3", text = "[refusal] Point the workload at a registry that fails conformance → the record says so before any timing." },
  { id = "T-RQ4.1.4", text = "[happy] Verify every byte pulled in a timed run against its digest → no mismatch; a registry that serves a wrong byte fails the run." },
  { id = "T-RQ4.1.5", text = "[edge] A point where the client, not the registry, is the limit → the harness detects its own saturation (client CPU at its ceiling) and marks the point." },
]

[[own]]
id = "RQ4.2"
phase = "RQ4"
title = "Find where a request's time and bytes go"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.1.4"]
needs = ["RQ1", "RQ0.7"]
criteria = [
  { id = "AC-RQ4.2.1", text = "`bench/records/` holds a cost table per request kind and door: every stage's instructions, allocations, system calls, copies and time, with intervals." },
  { id = "AC-RQ4.2.2", text = "The stages' times sum to the request's measured time within the table's interval; an unexplained remainder is its own row." },
  { id = "AC-RQ4.2.3", text = "The table is produced by one command and is of record under RQ0.7." },
  { id = "AC-RQ4.2.4", text = "Each later item of this phase names the rows it will move and by what test it will know." },
]
tests = [
  { id = "T-RQ4.2.1", text = "[happy] Produce the table twice on a quiet machine → each row's intervals overlap." },
  { id = "T-RQ4.2.2", text = "[edge] A request kind with a planted sleep in one stage → the table shows it in that stage's off-CPU time and nowhere else." },
  { id = "T-RQ4.2.3", text = "[edge] Tracing switched on and off → the cost of tracing itself is a stated row, and the untraced latency is the one reported." },
  { id = "T-RQ4.2.4", text = "[non-vacuity] List the request kinds of both doors against the tables → each has one; a new endpoint without one fails the check." },
]

[[own]]
id = "RQ4.3"
phase = "RQ4"
title = "Checking a token costs almost nothing"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.1.4"]
needs = ["RQ4.2"]
criteria = [
  { id = "AC-RQ4.3.1", text = "A request with a token seen before runs no signature verification, by counter, and its token stage's cost is a row of the cost table." },
  { id = "AC-RQ4.3.2", text = "Every answer with the cache equals the answer without it, over generated histories that include expiry, revocation and key rotation." },
  { id = "AC-RQ4.3.3", text = "The cache's memory is within its budget, and an eviction never changes an answer, only its cost." },
  { id = "AC-RQ4.3.4", text = "Failed authentications by one source are admitted at a rate derived from the check's measured cost and the cores granted; past it they are refused `429` before the check runs." },
  { id = "AC-RQ4.3.5", text = "The choice of eviction rule is an A|B record over the trace's token reuse." },
]
tests = [
  { id = "T-RQ4.3.1", text = "[happy] Many requests with one token → one signature verification." },
  { id = "T-RQ4.3.2", text = "[edge] A token that expires between two requests → the second is `401`, cached or not." },
  { id = "T-RQ4.3.3", text = "[race] A signing key rotated while tokens under the old key are cached → they are honored exactly as long as the uncached rule honors them." },
  { id = "T-RQ4.3.4", text = "[hostile] A flood of distinct forged tokens → each costs at most one refusal; the cache does not fill with them; valid tokens' latency stays within its interval." },
  { id = "T-RQ4.3.5", text = "[hostile] Password guessing from one address and from many → the per-source bound holds for the one; the total stays within the share of CPU the stage is admitted." },
  { id = "T-RQ4.3.6", text = "[exhaustion] More live tokens than the cache holds → correct answers, verification cost for the evicted." },
  { id = "T-RQ4.3.7", text = "[model] The cache against the no-cache oracle on generated histories → identical answers." },
]

[[own]]
id = "RQ4.4"
phase = "RQ4"
title = "Manifests, tags and referrers from memory, never stale"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.1.4"]
needs = ["RQ4.2"]
criteria = [
  { id = "AC-RQ4.4.1", text = "Every cached answer equals a linearizable read's, over generated concurrent histories with the nemesis, on one node and on three." },
  { id = "AC-RQ4.4.2", text = "A manifest or tag `GET`/`HEAD` served from memory performs no records read beyond what the freshness proof needs, by counter." },
  { id = "AC-RQ4.4.3", text = "The A|B records name the winner for the freshness design and for the eviction rule, with every candidate's intervals." },
  { id = "AC-RQ4.4.4", text = "The cache's size is derived from the node's memory budget; with the budget halved the node still serves, and the hit rate's change is recorded." },
  { id = "AC-RQ4.4.5", text = "A manifest too large for the cache's admission is served from Mantle, correct, at its own cost." },
  { id = "AC-RQ4.4.6", text = "A share inside the chosen eviction rule (a queue's part of the cache) stays fixed only where the record shows the result insensitive across the range tested on our traces; otherwise it is learned per node, by whichever of a downsized simulation on sampled requests and an online climber wins the A|B." },
]
tests = [
  { id = "T-RQ4.4.1", text = "[happy] `GET` one manifest by tag repeatedly → after the first, the path's records-read counter moves only by the freshness proof's cost." },
  { id = "T-RQ4.4.2", text = "[race] A tag moved on node A and read on node B at once, with delays and partitions injected → B never returns a value that was not current at some instant inside the read." },
  { id = "T-RQ4.4.3", text = "[race] A manifest deleted while cached on another node → the next read after the delete's acknowledgement is `404`." },
  { id = "T-RQ4.4.4", text = "[failure] The change feed stalls → reads fall back to validated reads or refuse typed; none serves from a cache it cannot prove fresh." },
  { id = "T-RQ4.4.5", text = "[failure] The feed answers that its history was compacted past the node's position → the cache is emptied and rebuilt; no stale answer in between." },
  { id = "T-RQ4.4.6", text = "[exhaustion] More distinct manifests requested than fit → eviction by the chosen rule; answers stay correct." },
  { id = "T-RQ4.4.7", text = "[hostile] A scan of distinct, non-existent tags → the cache of absences, if any, is bounded and validated; the scan cannot evict the working set past the rule's guarantee." },
  { id = "T-RQ4.4.8", text = "[model] The cached read path against the uncached oracle over generated histories → identical answers." },
  { id = "T-RQ4.4.9", text = "[deadlock] Readers waiting on a freshness proof while the feed's apply waits to update the entries they read → no reader holds an entry across a wait; the apply completes and every reader is answered or refused typed." },
  { id = "T-RQ4.4.10", text = "[livelock] A tag moved faster than a reader can prove its copy fresh → the reader falls back to a validated read within its counted budget; it does not retry the proof without end." },
  { id = "T-RQ4.4.11", text = "[edge] Replay a trace whose objects are mostly asked for exactly twice, the case queue-based rules lose on → the comparison record includes it; the chosen rule is the winner over all traces by the stated objective, and its loss on this one is stated, not hidden." },
]

[[own]]
id = "RQ4.5"
phase = "RQ4"
title = "Blob bytes by the shortest path"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.1.4", "AC-T9.10.2"]
needs = ["RQ4.2"]
criteria = [
  { id = "AC-RQ4.5.1", text = "A 1 MiB blob `GET` on a LAN has p99 at most 10 ms, measured by bench `reliquary_pull` (AC-T9.1.4)." },
  { id = "AC-RQ4.5.2", text = "The rule that picks redirect or relay has no threshold in the code: its inputs are measured, its form is in the design record, and an A|B record shows it at least matches the better of always-redirect and always-relay at every blob size in the matrix." },
  { id = "AC-RQ4.5.3", text = "On the relay path, bytes copied per byte served, and CPU seconds per GiB served, are each at most a tenth of the best competitor's, or the link is the limit." },
  { id = "AC-RQ4.5.4", text = "A redirect's URL lets its holder read exactly that blob, for a life derived as RQ3.5's grants are, and carries no credential of the client's across hosts." },
  { id = "AC-RQ4.5.5", text = "Every stock client in RQ1.10's matrix follows the redirect and verifies; one that cannot is served by relay, decided from what it says of itself or how it behaves, and the list is in the record." },
  { id = "AC-RQ4.5.6", text = "Blob `HEAD` and range `GET` meet the same bar as whole `GET` at their own points of the matrix." },
]
tests = [
  { id = "T-RQ4.5.1", text = "[happy] `GET` blobs of every size in the matrix by each path → identical bytes; digests verify." },
  { id = "T-RQ4.5.2", text = "[edge] A blob at the size where the two paths cost the same → either path, and latency within the better path's interval." },
  { id = "T-RQ4.5.3", text = "[edge] A client on a path far slower than the last one seen → the rule follows that client's path, not the previous client's." },
  { id = "T-RQ4.5.4", text = "[refusal] A presigned URL used for another blob, after its life, or with another method → refused by Mantle." },
  { id = "T-RQ4.5.5", text = "[failure] Mantle's S3 door is unreachable from the client → the client's retry is served by relay; the rule learns that path." },
  { id = "T-RQ4.5.6", text = "[race] A blob deleted between the redirect and the client's read → Mantle answers `404`; no other blob's bytes." },
  { id = "T-RQ4.5.7", text = "[hostile] A client that follows redirects and sends its registry token to the storage host → the storage host ignores it, and it is not logged." },
  { id = "T-RQ4.5.8", text = "[exhaustion] Relay readers past the relay's admitted bytes in flight → refused with `Retry-After`; redirected readers are unaffected." },
  { id = "T-RQ4.5.9", text = "[perf] Bench `reliquary_pull` across the matrix, of record → the bar's verdict at every point." },
]

[[own]]
id = "RQ4.6"
phase = "RQ4"
title = "HTTP/2 on the OCI door"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.10.2"]
needs = ["RQ4.2"]
criteria = [
  { id = "AC-RQ4.6.1", text = "The conformance suite and RQ1.10's client matrix pass over HTTP/2, and over HTTP/1.1 as before." },
  { id = "AC-RQ4.6.2", text = "An h2spec run reports no failure, or each one is listed with the RFC text that decides it." },
  { id = "AC-RQ4.6.3", text = "A connection's memory is bounded by its charge whatever a peer sends; the bound is counted and pinned." },
  { id = "AC-RQ4.6.4", text = "Each named attack costs the server no more than a stated, counted amount of work per attacker byte, and ends in a typed connection close." },
  { id = "AC-RQ4.6.5", text = "An A|B record shows HTTP/2 against HTTP/1.1 for pulls of many small layers and of few large ones, and the door's default follows it." },
  { id = "AC-RQ4.6.6", text = "Window sizes have no fixed value: each is derived, and a slow path and a fast one get different windows in the same run." },
  { id = "AC-RQ4.6.7", text = "Handlers running for a connection never exceed its advertised stream limit, by counter, whoever reset the streams and however fast; a stream past the limit is refused." },
  { id = "AC-RQ4.6.8", text = "A header block is bounded in encoded bytes, in frames and by progress toward its end, and its decoded size is counted while it is decoded; each refusal is counted by kind in a metric and told as an event, since no request line exists for it." },
]
tests = [
  { id = "T-RQ4.6.1", text = "[happy] Pull an image of many layers over one HTTP/2 connection → identical; streams ran concurrently." },
  { id = "T-RQ4.6.2", text = "[hostile] Open and reset streams as fast as the peer can; send HEADERS with CONTINUATION frames that never end; send SETTINGS and PING floods; send zero-length DATA frames → each closed typed; CPU per attacker byte within the stated bound; other connections' latency within their interval." },
  { id = "T-RQ4.6.3", text = "[hostile] A client that opens every stream and never grants window → held to its charge and cut by progress." },
  { id = "T-RQ4.6.4", text = "[hostile] HPACK: a header block that expands past the bound; a dynamic table resize flood → refused at the bound." },
  { id = "T-RQ4.6.5", text = "[edge] A request body larger than its window sent in one flight; a response to a client that closes its stream midway → flow control holds; the stream ends cleanly." },
  { id = "T-RQ4.6.6", text = "[deadlock] Both ends waiting on window (the connection's is full of data for a stream the client stopped reading) → the stalled stream is cut by progress; the others continue." },
  { id = "T-RQ4.6.7", text = "[exhaustion] Streams up to the advertised limit, then one more → refused with `REFUSED_STREAM`; no state kept for it." },
  { id = "T-RQ4.6.8", text = "[happy] A client that speaks only HTTP/1.1 → served as before." },
  { id = "T-RQ4.6.9", text = "[hostile] Make the server reset streams (frames that break flow control, malformed frames) while their requests are being served, as fast as the peer can → handlers running never exceed the stream limit; cost per attacker byte within the stated bound; the connection is closed typed." },
  { id = "T-RQ4.6.10", text = "[hostile] A header block begun and never ended, sent a byte at a time just often enough to look alive → cut by progress; counted by kind; the metric shows the refusal though no request was ever logged." },
]

[[own]]
id = "RQ4.7"
phase = "RQ4"
title = "Pushes as fast as the hardware hashes and writes"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.10.2"]
needs = ["RQ4.2"]
criteria = [
  { id = "AC-RQ4.7.1", text = "A large blob's push throughput per core is what the cost table predicts from that core's measured SHA-256 throughput and the device's durable bandwidth, within its interval; the gap to each ceiling is itemized by stage." },
  { id = "AC-RQ4.7.2", text = "Each uploaded byte is hashed with SHA-256 once on the server, shown by the instruction count per byte." },
  { id = "AC-RQ4.7.3", text = "Push throughput, and CPU seconds per GiB pushed, meet the phase's bar against the best competitor at every point of the matrix." },
  { id = "AC-RQ4.7.4", text = "Under many concurrent small pushes, durable commits per second exceed one per flush: commits group, with no timer, and each push is answered only after its group is durable." },
  { id = "AC-RQ4.7.5", text = "One slow upload on a connection does not slow another on it, within the interval." },
  { id = "AC-RQ4.7.6", text = "The hash and its chunking are right on x86_64 with and without SHA extensions, and on arm64, against the published test vectors." },
]
tests = [
  { id = "T-RQ4.7.1", text = "[happy] Push blobs across the size matrix → the bar's verdict at every point; every digest verifies." },
  { id = "T-RQ4.7.2", text = "[edge] A CPU without SHA extensions (masked in a VM) → correct digests, the software path's throughput reported as its own class." },
  { id = "T-RQ4.7.3", text = "[race] Many pushes committing at once → all durable before answered; flushes are fewer than commits; none answered early." },
  { id = "T-RQ4.7.4", text = "[failure] A power cut between a group's write and its flush (simulated) → none of the group was acknowledged; none is visible after restart." },
  { id = "T-RQ4.7.5", text = "[exhaustion] More concurrent uploads than the staging budget → admission refuses the excess typed; admitted uploads keep their throughput." },
  { id = "T-RQ4.7.6", text = "[deadlock] A group commit waiting on a flush that waits on room that a commit in the group would free → cannot form: the order is fixed and the test drives the store to full to show it." },
  { id = "T-RQ4.7.7", text = "[perf] Run bench `reliquary_push` beside the day's SHA-256 and durable-write ceilings → a record of record, with the gap to each ceiling itemized." },
]

[[own]]
id = "RQ4.8"
phase = "RQ4"
title = "Overload: refuse early, never collapse"
source = "docs/design/plan/phase-04-speed.md"
serves = ["AC-T9.10.2", "AC-T9.10.3"]
needs = ["RQ4.2", "RQ0.8"]
criteria = [
  { id = "AC-RQ4.8.1", text = "As offered load rises past capacity, goodput stays within its interval of the peak, instead of falling, up to the highest load the harness can offer." },
  { id = "AC-RQ4.8.2", text = "A refused request costs at most a stated, counted number of instructions and no records or bytes work." },
  { id = "AC-RQ4.8.3", text = "`Retry-After` is derived from measured drain; clients that honor it are admitted on their return unless load rose meanwhile, and the record compares their admission with a jittered-backoff control's." },
  { id = "AC-RQ4.8.4", text = "No admission limit, queue length or share in the code is a picked number; each has a row of an accepted kind." },
  { id = "AC-RQ4.8.5", text = "With one principal offering many times its fair share, every other principal's latency stays within its interval." },
  { id = "AC-RQ4.8.6", text = "Health, metrics and the administrator's own calls are admitted from a reserve when everything else is refused." },
]
tests = [
  { id = "T-RQ4.8.1", text = "[happy] Offered load from well under capacity to well over it, open loop → goodput rises, flattens and stays flat; latency of admitted requests stays bounded." },
  { id = "T-RQ4.8.2", text = "[edge] Load that steps up and down faster than the limit's probe cycle → the limit does not oscillate to its floor; goodput stays within the interval." },
  { id = "T-RQ4.8.3", text = "[edge] A workload of only cheap requests, then only expensive ones → each finds its own limit; the cheap ones are not held to the expensive ones' limit." },
  { id = "T-RQ4.8.4", text = "[failure] The records slow by a factor (injected) → the records authority lowers its limit; the request shards keep serving cached reads." },
  { id = "T-RQ4.8.5", text = "[hostile] One principal opens connections and requests without bound → held to its share; others unaffected." },
  { id = "T-RQ4.8.6", text = "[livelock] Every client retrying at once after a stall (a thundering herd) → `Retry-After` spreads them; the herd drains in a bounded number of rounds." },
  { id = "T-RQ4.8.7", text = "[deadlock] Each authority full and waiting on the next → no cycle: admission is taken in one fixed order and released on every path, shown by driving all four to their limits together." },
  { id = "T-RQ4.8.8", text = "[exhaustion] Sustained overload for as long as the harness runs → memory stays within budget; no queue grows." },
]

