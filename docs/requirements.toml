[[own]]
id = "RQ1.11"
phase = "RQ1"
title = "Nothing acknowledged is lost"
source = "docs/design/plan/phase-01-slice.md"
serves = ["AC-T9.1.1", "AC-T9.10.3"]
needs = ["RQ1.10"]
criteria = [
  { id = "AC-RQ1.11.1", text = "Acknowledged blobs, manifests or tags lost across every simulated and real crash run is exactly 0." },
  { id = "AC-RQ1.11.2", text = "Bytes served that do not match their digest across every run is exactly 0." },
  { id = "AC-RQ1.11.3", text = "Every run that ends without a verdict (a hang) fails, with the waiters named." },
  { id = "AC-RQ1.11.4", text = "Each crash point, each fault kind and each operation kind has a non-zero count in the gate's nightly sweep." },
  { id = "AC-RQ1.11.5", text = "A failing seed reproduces its failure, and its shrunk history is kept as a regression test with the bug's record in `docs/bugs/`." },
]
tests = [
  { id = "T-RQ1.11.1", text = "[crash] Power cut before and after every write of every operation in generated histories → the registry matches the model on every acknowledged operation." },
  { id = "T-RQ1.11.2", text = "[crash] `kill -9` under mixed push and pull load on each of APFS, ext4, tmpfs and NTFS → restart, verify every acknowledged artifact by digest." },
  { id = "T-RQ1.11.3", text = "[failure] A torn write to a records page; a bit flip in a stored chunk; a flush that fails → detected, the affected operation refused typed, nothing wrong served." },
  { id = "T-RQ1.11.4", text = "[livelock] A client retrying a refused push forever while another deletes what it pushes → both make progress or are refused; the run ends." },
  { id = "T-RQ1.11.5", text = "[deadlock] Every operation kind at once at the admission limit → no run ends with work waiting and nothing running." },
  { id = "T-RQ1.11.6", text = "[non-vacuity] The sweep's counters for crash points, faults and operations → all above zero; a new write site without a crash point fails the sweep." },
  { id = "T-RQ1.11.7", text = "[exhaustion] Memory, staging room, records room and connections each driven to its bound in turn → each ends in its typed refusal, and service resumes when the pressure lifts, without a restart." },
]

[[own]]
id = "RQ2.1"
phase = "RQ2"
title = "The admission pipeline"
source = "docs/design/plan/phase-02-artifacts.md"
serves = ["AC-T9.1.3"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ2.1.1", text = "A manifest of a known kind is visible only after its checks pass; a failed one leaves no manifest, no tag and no referrer entry." },
  { id = "AC-RQ2.1.2", text = "A refusal names its rule by a stable ID, the layer's digest and the offending path or field, in the error's `detail`." },
  { id = "AC-RQ2.1.3", text = "A blob already checked for a kind at the current checker version is not read again." },
  { id = "AC-RQ2.1.4", text = "A check's memory is bounded by its admitted budget whatever the layer's size, and its unpacked bytes and entries are charged to the pusher's quota as they are produced." },
  { id = "AC-RQ2.1.5", text = "A check that exceeds its budget is refused typed, saying which budget, and is not retried by the server." },
  { id = "AC-RQ2.1.6", text = "An unknown `artifactType` or config media type is stored and served unchanged." },
  { id = "AC-RQ2.1.7", text = "Every rule of every kind has an ID in `docs/design/artifact-rules.md`, and a doc-truth test holds the document and the checkers to each other." },
]
tests = [
  { id = "T-RQ2.1.1", text = "[happy] Push a valid artifact of each known kind → `201`; pull returns it identical." },
  { id = "T-RQ2.1.2", text = "[refusal] Push an artifact whose second layer breaks a rule → `MANIFEST_INVALID` naming the rule, that layer and the path; `GET` of the manifest is `404`; its tag does not exist." },
  { id = "T-RQ2.1.3", text = "[edge] Push the same layers under a second manifest → the second push reads no layer bytes (the bytes-read counter does not move)." },
  { id = "T-RQ2.1.4", text = "[edge] Raise a checker's version → the next push of old bytes checks them again under the new rules." },
  { id = "T-RQ2.1.5", text = "[race] Two pushes of one invalid manifest at once → both refused; no interleaving leaves it visible." },
  { id = "T-RQ2.1.6", text = "[race] A layer deleted while its manifest is being checked → the push is refused `MANIFEST_BLOB_UNKNOWN`; the check stops reading." },
  { id = "T-RQ2.1.7", text = "[exhaustion] A layer that unpacks past the pusher's quota → refused typed at the byte that crossed it; memory stayed within the check's budget." },
  { id = "T-RQ2.1.8", text = "[failure] The server is killed mid-check → after restart the manifest is absent, and pushing again checks and succeeds." },
  { id = "T-RQ2.1.9", text = "[happy] A manifest of an unknown artifact type with arbitrary layers → stored, served, never read by a checker." },
  { id = "T-RQ2.1.10", text = "[deadlock] As many checks as the admission limit allows, each waiting on bytes while the bytes budget is held by checks → each proceeds in turn; the queue drains." },
]

[[own]]
id = "RQ2.2"
phase = "RQ2"
title = "Readers for tar, gzip, zstd and zip that cannot be turned against us"
source = "docs/design/plan/phase-02-artifacts.md"
serves = ["AC-T9.1.3"]
needs = ["RQ1"]
criteria = [
  { id = "AC-RQ2.2.1", text = "The tar, gzip and zstd readers are Shards' own, at kiln's revision, and Shards' oracle tests for them run in Reliquary's gate." },
  { id = "AC-RQ2.2.2", text = "The zip reader agrees with a reference implementation on a generated corpus, and refuses every archive in the published parser-differential corpus that two mainstream readers read differently." },
  { id = "AC-RQ2.2.3", text = "No reader's memory exceeds its admitted budget on any input; a zstd frame whose window exceeds the budget is refused before it is allocated." },
  { id = "AC-RQ2.2.4", text = "No reader recurses, and each ends on its byte and entry budgets." },
  { id = "AC-RQ2.2.5", text = "Every refusal is typed and names the entry and what was wrong with it." },
  { id = "AC-RQ2.2.6", text = "A deflate stream cannot expand by more than 1032 times (derived from the format, cited): a zip entry or gzip member that declares more is refused before a byte is inflated, and inflation's budget is the least of that bound, the declared size and what was admitted." },
  { id = "AC-RQ2.2.7", text = "A zip entry is inflated only by a decoder the reader bounds (stored, deflate, zstd); one packed by any other method is refused typed, naming the method." },
]
tests = [
  { id = "T-RQ2.2.1", text = "[happy] Archives made by GNU tar, bsdtar, Go's archive/tar, Docker, Info-ZIP, 7-Zip and Python's zipfile → each lists and extracts identically to its own tool." },
  { id = "T-RQ2.2.2", text = "[hostile] Paths with `..`, absolute paths, a backslash, a drive letter or a NUL; a symlink then a file written through it; a hard link to a path outside → each refused, naming the entry." },
  { id = "T-RQ2.2.3", text = "[hostile] A zip whose entries overlap (a non-recursive zip bomb); a zip whose central directory and local headers disagree on name or size; two central directories; an entry named twice → each refused." },
  { id = "T-RQ2.2.4", text = "[hostile] A gzip that expands past the budget; a zstd frame declaring a window larger than the budget; a pax header declaring a path longer than the budget → refused at the budget, with memory within it." },
  { id = "T-RQ2.2.5", text = "[hostile] Fuzz each reader with mutated real archives → no panic, no hang, memory within budget." },
  { id = "T-RQ2.2.6", text = "[edge] An empty archive; a tar with only directories; a zip64 archive with an entry over 4 GiB; a multi-member gzip; a zstd file of several frames and a skippable frame → each read correctly." },
  { id = "T-RQ2.2.7", text = "[edge] Names that differ only by case, by Unicode normalization, or that are reserved on Windows (`CON`, `aux.txt`, a trailing dot) → listed as they are, and flagged for the checks that care." },
  { id = "T-RQ2.2.8", text = "[model] Generated trees packed by the reference and read by ours, and the reverse → identical trees." },
  { id = "T-RQ2.2.9", text = "[failure] The byte source ends mid-entry → a typed \"truncated\", naming the entry and offset." },
  { id = "T-RQ2.2.10", text = "[hostile] A tar entry whose pax size and ustar size disagree, so that its content would be read as headers (CVE-2025-62518) → refused, naming the entry; nothing inside its content is listed as an entry." },
  { id = "T-RQ2.2.11", text = "[hostile] A zip entry and a gzip member each declaring an unpacked size more than 1032 times its packed size; a zip entry packed with a method the reader does not bound → each refused before any inflation, by counter." },
]

