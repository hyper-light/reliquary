criteria = [
  { id = "AC-RQ6.2.1", text = "Search p99 over 100,000 artifacts is at most 50 ms, measured by bench `reliquary_search` (AC-T9.3.2)." },
  { id = "AC-RQ6.2.2", text = "Artifacts missing from search 1 s after publish is exactly 0, measured by a test publishing and searching (AC-T9.3.3)." },
  { id = "AC-RQ6.2.3", text = "The A|B records name the chosen design, with every candidate's latency, index size, build rate and memory." },
  { id = "AC-RQ6.2.4", text = "An index rebuilt from the records alone answers every query of the test corpus exactly as the incrementally built one does." },
  { id = "AC-RQ6.2.5", text = "Search latency at the plan's larger scale sizes is recorded, and the growth from 100,000 artifacts is no worse than the design's stated bound." },
  { id = "AC-RQ6.2.6", text = "The index's memory is within the budget derived for it; past it, older segments are read from disk or Mantle, and answers stay correct." },
]
tests = [
  { id = "T-RQ6.2.1", text = "[happy] Index the corpus; query by a word of a name, of a description and of a readme → each artifact holding the word is returned, ranked." },
  { id = "T-RQ6.2.2", text = "[happy] Publish, then search at once asking for the publish's own position → found." },
  { id = "T-RQ6.2.3", text = "[edge] Queries of one character, of a phrase, of a word in every script the corpus has, of an emoji, of a term that matches everything → answered within the bound; the last pages." },
  { id = "T-RQ6.2.4", text = "[edge] An artifact deleted → gone from results by the next query that asks for the delete's position." },
  { id = "T-RQ6.2.5", text = "[failure] Kill the node while it writes a segment → after restart the index equals a rebuild; no result is duplicated or lost." },
  { id = "T-RQ6.2.6", text = "[failure] The change feed says the node's position was compacted away → the node rebuilds from a snapshot of the records and answers \"catching up\" typed until it has." },
  { id = "T-RQ6.2.7", text = "[race] Many publishes while queries run → every query's results are a state the catalog was in at some instant." },
  { id = "T-RQ6.2.8", text = "[exhaustion] More documents than the memory budget holds → correct answers, with the latency of the on-disk path recorded." },
  { id = "T-RQ6.2.9", text = "[hostile] A query built to be expensive (many wildcards, a pathological regex if regexes are offered) → refused or bounded in time by a counted budget; other queries' latency stays in its interval." },
  { id = "T-RQ6.2.10", text = "[model] The index against a brute-force scan of the documents on generated queries → the same set of results." },
  { id = "T-RQ6.2.11", text = "[perf] Run bench `reliquary_search` at 100,000 artifacts and at the plan's larger scale sizes → records of record; p99 at most 50 ms at 100,000." },
]

