[[own]]
id = "RQ10.1"
phase = "RQ10"
title = "Measure the images before designing for them"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["AC-T9.6.2"]
needs = ["RQ0.7"]
criteria = [
  { id = "AC-RQ10.1.1", text = "`bench/corpus/` holds, for each corpus, sharing and index cost against chunk size for fixed and content-defined chunking, on compressed and uncompressed bytes, with the corpus's digests so it can be re-run." },
  { id = "AC-RQ10.1.2", text = "It holds, for each bootable image in the corpus, the blocks read from start to \"workload running\", over repeated starts, and how much of that set is common to all starts." },
  { id = "AC-RQ10.1.3", text = "The cost model that later items use (index bytes, bytes fetched, requests made, each priced on a measured path) reproduces the measured transfer of a sample of images within its interval." },
  { id = "AC-RQ10.1.4", text = "The report states which content is worth storing by chunk and which is not, and what would change the answer." },
]
tests = [
  { id = "T-RQ10.1.1", text = "[happy] Re-run the measurement on the recorded corpus → the tables reproduce exactly (they are deterministic)." },
  { id = "T-RQ10.1.2", text = "[edge] A corpus of one image; of two identical images; of two images with nothing shared → sharing of none, all, none." },
  { id = "T-RQ10.1.3", text = "[model] The cost model's prediction for a held-out image against its measured lazy start → within the interval." },
  { id = "T-RQ10.1.4", text = "[non-vacuity] Check each corpus for an image where content-defined chunking beats fixed and one where it does not → both exist, or the report says the corpus has none and why." },
]

[[own]]
id = "RQ10.2"
phase = "RQ10"
title = "Any range, verified by itself"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["T-T9.6.1", "AC-T9.6.1"]
needs = ["RQ10.1"]
criteria = [
  { id = "AC-RQ10.2.1", text = "For every blob in the test corpus, every block and every aligned run verifies against the root with its proof, and any single flipped bit in a block or a proof fails." },
  { id = "AC-RQ10.2.2", text = "The tree is computed in the same pass that hashes the upload: the bytes are read once." },
  { id = "AC-RQ10.2.3", text = "The root is bound to the blob's digest in a record written in the blob's own commit; a root for another blob never verifies this one's blocks." },
  { id = "AC-RQ10.2.4", text = "The fetch size is not in the format: one tree serves a reader that fetches a block at a time and one that fetches megabytes at a time." },
  { id = "AC-RQ10.2.5", text = "Where the tree is Linux verity's, a Linux kernel given the root and the tree accepts the image and refuses a corrupted one." },
  { id = "AC-RQ10.2.6", text = "A lazily started artifact's whole digest is verified when its last byte arrives; a mismatch is an alarm, and the artifact is marked damaged." },
]
tests = [
  { id = "T-RQ10.2.1", text = "[happy] Read every block of an image at random, verifying each → all verify; the union equals the blob." },
  { id = "T-RQ10.2.2", text = "[hostile] Flip one bit in a block; in a proof; swap two blocks; serve a block of another image → each refused at that block." },
  { id = "T-RQ10.2.3", text = "[edge] A blob of zero bytes; of one byte; of exactly one block; not a multiple of the block; larger than memory → trees built and verified." },
  { id = "T-RQ10.2.4", text = "[edge] Runs of one block and of the whole blob through the same tree → both verify." },
  { id = "T-RQ10.2.5", text = "[race] A blob read by range while its tree referrer is being deleted by retention → the read fails typed or completes verified; never unverified bytes." },
  { id = "T-RQ10.2.6", text = "[failure] The tree's own bytes are damaged → detected by its own digest; rebuilt from the blob." },
  { id = "T-RQ10.2.7", text = "[model] The tree against a reference implementation on generated inputs → identical roots." },
]

[[own]]
id = "RQ10.3"
phase = "RQ10"
title = "A chunk store for what is read by range"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["AC-T9.6.1", "AC-T9.6.2"]
needs = ["RQ10.1", "RQ9.3"]
criteria = [
  { id = "AC-RQ10.3.1", text = "An artifact stored as a recipe reassembles to its original bytes and digest, for every artifact in the corpus." },
  { id = "AC-RQ10.3.2", text = "Stored bytes for the corpus are within the interval of what RQ10.1's table predicts for the chosen chunking." },
  { id = "AC-RQ10.3.3", text = "No chunk size or boundary rule is fixed in code: each is a parameter in the recipe, chosen by the stated rule from measured tables." },
  { id = "AC-RQ10.3.4", text = "A whole read of a recipe-stored artifact meets the same bar against competitors as a whole blob, or the artifact is also kept whole while it is read whole often, by a rule on measured reads." },
  { id = "AC-RQ10.3.5", text = "Chunks shared between namespaces are charged to each (RQ9.5), and whether a chunk already exists is never observable to a pusher." },
  { id = "AC-RQ10.3.6", text = "The property of RQ9.3 holds for chunks: referenced chunks collected is exactly 0." },
]
tests = [
  { id = "T-RQ10.3.1", text = "[happy] Push two microVM disks built from one base → stored bytes are about one base plus two differences; each pulls back identical." },
  { id = "T-RQ10.3.2", text = "[edge] An artifact of one chunk; of all-identical chunks; of chunks none of which repeats → stored and read back." },
  { id = "T-RQ10.3.3", text = "[race] Two pushes store the same new chunk at once → one copy; both recipes valid." },
  { id = "T-RQ10.3.4", text = "[race] A recipe deleted while another recipe that shares its chunks is being pushed → the second's chunks stay." },
  { id = "T-RQ10.3.5", text = "[hostile] A pusher times its uploads to learn whether a chunk exists → upload time and answers do not differ within the interval." },
  { id = "T-RQ10.3.6", text = "[exhaustion] A recipe with more chunks than one records transaction holds → committed in stages; invisible until whole." },
  { id = "T-RQ10.3.7", text = "[crash] Power cut at every write of a recipe push → after restart the artifact is whole or absent; no chunk is orphaned past the collector's reach." },
]

[[own]]
id = "RQ10.4"
phase = "RQ10"
title = "Blocks on demand, on every platform"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["AC-T9.6.1", "AC-T9.6.2"]
needs = ["RQ10.2", "RQ10.3", "RQ3.8"]
criteria = [
  { id = "AC-RQ10.4.1", text = "A Shards microVM and a Firecracker microVM each boot and run a workload from a disk of which the node held nothing, on Linux; a Shards microVM does on macOS and on Windows." },
  { id = "AC-RQ10.4.2", text = "Time to a 2 GB image's workload running, lazy against a full pull, falls by at least 70% compared with a full pull, measured by bench `image_start` on fedora (AC-T9.6.2)." },
  { id = "AC-RQ10.4.3", text = "Every block handed to a guest was verified against the image's root." },
  { id = "AC-RQ10.4.4", text = "Once the disk is whole, a guest's read latency is within the interval of a disk that was pulled in full." },
  { id = "AC-RQ10.4.5", text = "A block shared by two images on one node is fetched and stored once." },
  { id = "AC-RQ10.4.6", text = "The background fill's pace and the fetch size are learned on the path (RQ0.8) and yield to foreground reads; neither is a fixed figure." },
  { id = "AC-RQ10.4.7", text = "The A|B records compare the candidate device paths on each host platform, and the record names what Shards' and Hex's owners chose." },
]
tests = [
  { id = "T-RQ10.4.1", text = "[happy] Boot from an unheld image, run the workload → it completes; the blocks fetched before \"running\" are a fraction of the disk." },
  { id = "T-RQ10.4.2", text = "[failure] Reliquary and every peer unreachable mid-boot → the guest's read of a missing block returns an I/O error within the wait RQ0.8 learns; the VM is reported failed, naming the image; blocks already held still read." },
  { id = "T-RQ10.4.3", text = "[failure] The network drops and returns during the background fill → the fill resumes; the guest never notices." },
  { id = "T-RQ10.4.4", text = "[hostile] A source that serves a corrupted block → refused at that block; fetched from another source; the guest gets the right bytes or an error." },
  { id = "T-RQ10.4.5", text = "[race] Two VMs booting from one image fault on the same block at once → one fetch; both served." },
  { id = "T-RQ10.4.6", text = "[race] The guest reads a block the background fill is writing → the right bytes; no torn block." },
  { id = "T-RQ10.4.7", text = "[crash] Kill the VMM or the node agent mid-fill → after restart, blocks marked held are verified ones; the fill resumes." },
  { id = "T-RQ10.4.8", text = "[exhaustion] The node's disk fills during the fill → the fill stops; reads of unheld blocks still fetch into memory within budget or fail typed; nothing a running VM holds is dropped." },
  { id = "T-RQ10.4.9", text = "[deadlock] The guest's read waits on a fetch whose connection is flow-controlled by a fill that the guest's own I/O is delaying → foreground reads have their own credit; the read completes." },
  { id = "T-RQ10.4.10", text = "[perf] Run bench `image_start` on fedora, lazy against a full pull, on a 2 GB image and across the corpus's sizes, then read latency after the fill → records of record; the fall is at least 70% on the 2 GB image." },
]

[[own]]
id = "RQ10.5"
phase = "RQ10"
title = "The blocks it read last time, ready this time"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["AC-T9.6.2"]
needs = ["RQ10.4"]
criteria = [
  { id = "AC-RQ10.5.1", text = "With a working set, the guest's reads that had to wait on a fetch, between start and running, fall to those blocks the set lacked, by counter." },
  { id = "AC-RQ10.5.2", text = "Start time with a working set is no worse than without one, within the interval, on every image in the corpus; where the set does not help, it is not used." },
  { id = "AC-RQ10.5.3", text = "The working set's size and membership come from recorded starts; no fraction or count is picked." },
  { id = "AC-RQ10.5.4", text = "A working set reveals nothing across namespaces: it is derived from, and served to, only principals who may read the image." },
  { id = "AC-RQ10.5.5", text = "Recording costs the guest's reads nothing measurable, within the interval." },
]
tests = [
  { id = "T-RQ10.5.1", text = "[happy] Start an image cold, then again on another node → the second start's waits on fetch are near none; its time is shorter." },
  { id = "T-RQ10.5.2", text = "[edge] An image whose start reads differ every time (a random file) → the set holds the common part only." },
  { id = "T-RQ10.5.3", text = "[edge] The image's command changes → a separate working set; the old one is not applied." },
  { id = "T-RQ10.5.4", text = "[failure] A working set naming blocks past the image's end, or a set for another image (planted) → refused; the start proceeds without it." },
  { id = "T-RQ10.5.5", text = "[race] Many nodes report starts of one image at once → one merged set; no report lost." },
  { id = "T-RQ10.5.6", text = "[exhaustion] An image started under so many commands that sets would exceed their budget → least used sets are dropped; starts still work." },
]

[[own]]
id = "RQ10.6"
phase = "RQ10"
title = "Containers that start before they are pulled"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["AC-T9.6.1"]
needs = ["RQ10.2", "RQ3.8"]
criteria = [
  { id = "AC-RQ10.6.1", text = "On a host whose kernel has a supported mechanism, an `oci` box starts from an unheld image and its workload runs before the image is whole." },
  { id = "AC-RQ10.6.2", text = "On a host without one, the box starts by a full pull, and the reason is in its record." },
  { id = "AC-RQ10.6.3", text = "Every file a container reads is verified against the image's tree before it is returned." },
  { id = "AC-RQ10.6.4", text = "A stock Docker or containerd pull of the same image is unchanged, byte for byte." },
  { id = "AC-RQ10.6.5", text = "The A|B record names the mechanism kept for each kernel in the lab and what the others measured." },
]
tests = [
  { id = "T-RQ10.6.1", text = "[happy] An `oci` box from an unheld multi-gigabyte image → running before the image is whole; output correct." },
  { id = "T-RQ10.6.2", text = "[edge] An image of many tiny layers; of one huge layer; with hard links and whiteouts across layers → the merged view equals a full pull's, file for file." },
  { id = "T-RQ10.6.3", text = "[failure] The source vanishes mid-run → a read of an unheld file fails with an I/O error the container sees; held files still read." },
  { id = "T-RQ10.6.4", text = "[refusal] A host kernel older than any supported mechanism → the typed fallback, naming the kernel and the mechanism it lacks." },
  { id = "T-RQ10.6.5", text = "[perf] Steady-state file read latency after the fill against a full pull's → within the interval." },
]

[[own]]
id = "RQ10.7"
phase = "RQ10"
title = "Nodes fetch from each other"
source = "docs/design/plan/phase-10-fast-distribution.md"
serves = ["AC-T9.6.3", "T-T9.6.1"]
needs = ["RQ10.2", "RQ3.8"]
criteria = [
  { id = "AC-RQ10.7.1", text = "Origin bytes sent for one image pulled by 100 runners, in image sizes, is at most 3, measured by a P2P lab with simulated runners (AC-T9.6.3)." },
  { id = "AC-RQ10.7.2", text = "A peer serving corrupted chunks is caught by digest and dropped, and the pull completes (T-T9.6.1)." },
  { id = "AC-RQ10.7.3", text = "No node uses or forwards a piece it has not verified." },
  { id = "AC-RQ10.7.4", text = "A node serves peers only artifacts those peers may read, checked by a grant Reliquary issues; a node cannot learn what another holds beyond what it may read." },
  { id = "AC-RQ10.7.5", text = "Serving peers never slows the serving node's own workloads beyond a share the operator states or the node derives from idle capacity." },
  { id = "AC-RQ10.7.6", text = "With every peer gone, a pull completes from the origin with no error." },
  { id = "AC-RQ10.7.7", text = "The lab's record compares the candidate topologies at the criterion's 100 runners, at a tenth of that, and at the largest simulated count, and names the one kept for each kind of transfer." },
]
tests = [
  { id = "T-RQ10.7.1", text = "[happy] A hundred simulated runners pull one image at once → all verify; origin bytes within the bound." },
  { id = "T-RQ10.7.2", text = "[hostile] One peer serves flipped bytes; one serves pieces of another image; one stalls after accepting → each dropped for the transfer; the pull completes from others or the origin." },
  { id = "T-RQ10.7.3", text = "[hostile] A peer advertises holdings it lacks → asked once, refused or silent, dropped; its report is corrected." },
  { id = "T-RQ10.7.4", text = "[refusal] A node asks a peer for an artifact it may not read → refused; the peer's holdings of it are not revealed." },
  { id = "T-RQ10.7.5", text = "[failure] Many of the peers die mid-transfer → the rest and the origin complete it." },
  { id = "T-RQ10.7.6", text = "[race] Every runner starts at the same instant with no peer holding anything → the origin serves the first copies; later pieces come from peers; origin bytes still within the bound." },
  { id = "T-RQ10.7.7", text = "[livelock] Two nodes each waiting for the other to fetch a piece first → neither waits: a node that needs a piece and finds no holder fetches it from the origin." },
  { id = "T-RQ10.7.8", text = "[exhaustion] One popular node asked by every peer → it serves within its share and refuses the rest typed; they go elsewhere." },
  { id = "T-RQ10.7.9", text = "[edge] Small images, where a peer round trip costs more than the origin's → fetched from the origin, by the measured rule." },
]

